stralmente os cadastros realizados pela equipe e o banco de produtos certificados (Prodcert)\nRevisar casos de dupla interpretação fiscal/regulatória na classificação NCM\nDecidir o enquadramento regulatório em casos de produto novo ou de interpretação ambígua\nValidar e decidir o modelo de certificação em casos atípicos ou de maior exposição a risco\nRevisar dossiês técnicos de produtos críticos ou de maior complexidade normativa\nEscalar e negociar prazos em processos de homologação travados ou críticos\nIntervir em divergências técnicas complexas junto ao Inmetro/OCC\nDefinir critérios de auditoria do banco de produtos certificados\nApresentar e comentar relatórios de status de homologação junto à Diretoria de P&D\nAvaliar previamente a viabilidade regulatória de novos produtos e recomendar a decisão de importação à Diretoria\nInterpretar o impacto de mudanças normativas e definir plano de adequação\nConduzir negociações técnicas complexas com fornecedores estrangeiros\nMentorar e revisar o trabalho de analistas Júnior e Pleno\nLiderar a proposição e implementação de melhorias de processo e mitigação de risco regulatório","formacao":"Superior completo em Engenharia, Comércio Exterior, Administração ou áreas correlatas; Desejável pós-graduação em Qualidade, Regulatório ou Comex","experiencia":"6 anos","conhecimentos":"Domínio completo dos modelos de certificação Inmetro; ERP avançado; inglês avançado; gestão de processos de certificação complexos; mentoria e liderança técnica","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-07-01","elaborador":"Rafael Veiber","aprovador":"Leandro de Azevedo","dataHist":"2026-07-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Leandro de Azevedo","atual":"Atual"},{"row":379,"empresa":"WAP","gestor":"GERENTE DE SUPRIMENTOS","area":"SUPRIMENTOS","cargo":"COORDENADOR DE COMEX","cargoNovo":"COORDENADOR DE COMEX","cbo":"354305","sumaria":"Planeja, coordena e controla as operações de comércio exterior da companhia, liderando equipe multidisciplinar responsável por pré-embarque, pós-embarque, planejamento e controle de pedidos e materiais importados (PCPM), câmbio e ordens de compra, com o objetivo de garantir o abastecimento internacional de matérias-primas, componentes e produtos acabados dentro do prazo, custo e conformidade legal exigidos pela operação industrial multiunidade. Atua como ponto focal de comércio exterior perante Suprimentos, Produção, Logística, Financeiro e Jurídico, respondendo pelo desempenho da área em indicadores de custo, prazo de desembaraço e aderência regulatória, e pela gestão e desenvolvimento da equipe sob sua responsabilidade.","atividades":"Planeja e coordena o fluxo de importação e exportação da companhia, definindo prioridades de embarque a partir do planejamento de produção, e distribuindo as demandas entre os especialistas de pré-embarque, pós-embarque, PCPM, câmbio e analistas de ordens de compra sob sua coordenação, ajustando a alocação da equipe conforme sazonalidade e volume de processos em aberto.\nAnalisa e aprova processos de importação antes do embarque, validando classificação fiscal, incidência tributária e a aplicabilidade de regimes especiais como drawback, admissão temporária e ex-tarifário, decidindo quando um processo deve ser submetido à consultoria aduaneira externa ou à área jurídica em função do risco regulatório envolvido.\nAcompanha o desembaraço aduaneiro nos sistemas do governo federal para comércio exterior, monitorando licenças de importação, declarações de exportação e o enquadramento das cargas nos canais de conferência, e define junto ao despachante aduaneiro as ações corretivas quando uma carga é dico, alinhando cronogramas de importação com o planejamento de produção das unidades de São José dos Pinhais, Espírito Santo e Ceará, e comunicando de forma proativa riscos de desabastecimento.\nConsolida e reporta indicadores da área, como lead time de desembaraço, aderência ao cronograma de embarques e custo de frete e tributos por processo, apresentando os resultados à liderança de Suprimentos e propondo iniciativas de melhoria contínua, como oportunidades de ex-tarifário ou reclassificação fiscal.\nGerencia a equipe sob sua coordenação, definindo metas, acompanhando desempenho, identificando necessidades de capacitação em legislação aduaneira e cambial, e participando de decisões de dimensionamento e contratação da área junto à área de Pessoas.","formacao":"Ensino superior completo em Comércio Exterior, Relações Internacionais, Administração, Engenharia de Produção ou áreas correlatas. Desejável Pós-graduação ou MBA em Comércio Exterior, Logística Internacional ou Supply Chain Management.","experiencia":"8 anos","conhecimentos":"Legislação aduaneira e regime tributário de importação e exportação. Regimes aduaneiros especiais, como drawback, admissão temporária e ex-tarifário. Incoterms e negociação internacional de condições comerciais. Operações cambiais, incluindo contratos de câmbio e mecanismos de proteção cambial. Sistemas do governo federal para comércio exterior utilizados no registro e acompanhamento de licenças de importação e declarações de exportação. Gestão de despachantes aduaneiros, agentes de carga e transportadoras internacionais nos modais marítimo, aéreo e rodoviário. Planejamento e controle de materiais (PCM/PCP) aplicado a insumos importados. Pacote Office avançado, com ênfase em planilhas eletrônicas. Inglês avançado, com fluência para negociação internacional. Espanhol é considerado diferencial. Gestão de equipes, definição e acompanhamento de indicadores de desempenho (KPIs).","softskills":"Planejamento Estratégico Operacional – Traduz me /* ---------- helpers ---------- */
function parseData(s){
  if(!s) return null;
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}
function fmtBR(s){ const d = parseData(s); if(!d) return (s||''); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function esc(s){ return (s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
function diasDesde(d){ return d ? Math.floor((HOJE - d)/86400000) : null; }

/* ---------- agrupamento (mesma lógica do VBA: cargoNovo+área, exige CBO) ---------- */
const validas = ROWS.filter(r => r.cargoNovo && r.cbo);
const grupos = new Map();
for(const r of validas){
  const k = r.cargoNovo + '||' + (r.area || '(Sem área)');
  if(!grupos.has(k)) grupos.set(k, []);
  grupos.get(k).push(r);
}
const cargos = [];
for(const [k, rows] of grupos){
  let atual = null, antiga = null;
  for(const r of rows){
    const d = parseData(r.dataHist);
    if(d){ if(!atual || d > parseData(atual.dataHist)) atual = r; if(!antiga || d < parseData(antiga.dataHist)) antiga = r; }
  }
  if(!atual) atual = rows[rows.length-1];
  if(!antiga) antiga = rows[0];
  const dRef = parseData(atual.dataRevisao) || parseData(atual.dataHist);
  const idade = diasDesde(dRef);
  let st = 'ok';
  if(idade === null || idade > 365) st = 'bad';
  else if(idade > 305) st = 'warn';
  cargos.push({key:k, cargo:atual.cargoNovo, area:atual.area || '(Sem área)', rows, atual, antiga, dRef, idade, st});
}
/* ---------- áreas compostas: "PRODUÇÃO / EXPEDIÇÃO" aparece em PRODUÇÃO e em EXPEDIÇÃO ---------- */
const areaNames = new Map();
function normArea(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
function regArea(parte){
  const k = normArea(parte);
  const atual = areaNames.get(k);
  if(!atual) areaNames.set(k, parte.trim());
  else if(/[^\x00-\x7F]/.test(parte) && !/[^\x00-\x7F]/.test(atual)) areaNames.set(k, parte.trim());
  return k;
}
function splitAreas(s){
  const partes = (s||'').split('/').map(p=>p.trim()).filter(Boolean);
  return partes.length ? partes : ['(Sem área)'];
}
function dispArea(k){ return areaNames.get(k) || k; }
for(const r of ROWS) splitAreas(r.area).forEach(regArea);

const entradas = [];
for(const c of cargos){
  const vistos = new Set();
  for(const parte of splitAreas(c.area)){
    const k = regArea(parte);
    if(vistos.has(k)) continue;
    vistos.add(k);
    entradas.push({k, c});
  }
}
entradas.sort((a,b)=> dispArea(a.k).localeCompare(dispArea(b.k),'pt') || a.c.cargo.localeCompare(b.c.cargo,'pt'));

/* ---------- filtros / lista ---------- */
const selArea = document.getElementById('fArea');
[...areaNames.keys()].sort((a,b)=>dispArea(a).localeCompare(dispArea(b),'pt')).forEach(k=>{
  const o = document.createElement('option'); o.value = k; o.textContent = dispArea(k); selArea.appendChild(o);
});
let selKey = null;
function renderLista(){
  const q = document.getElementById('busca').value.trim().toLowerCase();
  const fa = selArea.value, fs = document.getElementById('fStatus').value;
  const el = document.getElementById('lista'); el.innerHTML = '';
  const mostrados = new Set();
  let areaAtual = null;
  for(const e of entradas){
    const c = e.c;
    if(fa && e.k !== fa) continue;
    if(fs && c.st !== fs) continue;
    if(q && !(c.cargo.toLowerCase().includes(q) || c.area.toLowerCase().includes(q) || dispArea(e.k).toLowerCase().includes(q) || (c.atual.gestor||'').toLowerCase().includes(q))) continue;
    mostrados.add(c.key);
    if(e.k !== areaAtual){
      areaAtual = e.k;
      const g = document.createElement('div'); g.className = 'grpArea'; g.textContent = dispArea(e.k); el.appendChild(g);
    }
    const it = document.createElement('div');
    it.className = 'item' + (c.key === selKey ? ' sel' : '');
    const stTxt = c.st==='bad' ? (c.dRef ? 'Vencida' : 'Sem data') : c.st==='warn' ? 'A vencer' : 'Em dia';
    const compostaTag = splitAreas(c.area).length > 1 ? esc(c.area)+'<br>' : '';
    it.innerHTML = '<div><div class="nome">'+esc(c.cargo)+'</div><div class="meta">'+compostaTag+'Rev.: '+(c.dRef?fmtBR(c.atual.dataRevisao||c.atual.dataHist):'—')+' · v'+esc(String(c.atual.versao||'?'))+'</div></div>'+
                   '<span class="chip '+c.st+'">'+stTxt+'</span>';
    it.onclick = ()=>{ selKey = c.key; renderLista(); renderDoc(c); };
    el.appendChild(it);
  }
  document.getElementById('contagem').textContent = mostrados.size + ' descrições de ' + cargos.length + ' (' + areaNames.size + ' áreas)';
}

      '<tr><td colspan="2" class="lbl">Data da Elaboração</td><td colspan="2" class="lbl">Data da Aprovação</td></tr>'+
      '<tr><td colspan="2" class="val">'+esc(fmtBR(c.antiga.dataHist))+'</td><td colspan="2" class="val">'+esc(fmtBR(a.dataRevisao))+'</td></tr>'+
    '</table>'+
    '<h2 class="secjd">JOB DESCRIPTION</h2>'+
    '<table class="ident">'+
      '<tr><td>Cargo:</td><td>'+esc(a.cargoNovo)+'</td></tr>'+
      '<tr><td>Reporte:</td><td>'+esc(a.gestor||'')+'</td></tr>'+
      '<tr><td>Área:</td><td>'+esc(a.area||'')+'</td></tr>'+
      '<tr><td>CBO:</td><td>'+esc(a.cbo||'')+'</td></tr>'+
    '</table>'+
    '<h3 class="sec">Descrição Sumária</h3><p class="txt">'+esc(a.sumaria||'')+'</p>'+
    '<h3 class="sec">Principais Responsabilidades</h3><p class="txt">'+esc(a.atividades||'')+'</p>'+
    '<h3 class="sec">Hard Skills</h3>'+
      '<div class="hs"><b>Formação:</b><p class="txt">'+esc(a.formacao||'')+'</p></div>'+
      '<div class="hs"><b>Experiência:</b><p class="txt">'+esc(a.experiencia||'')+'</p></div>'+
      '<div class="hs"><b>Conhecimentos desejáveis:</b><p class="txt">'+esc(a.conhecimentos||'')+'</p></div>'+
    '<h3 class="sec">Soft Skills</h3><p class="txt">'+esc(a.softskills||'')+'</p>'+
    '<div class="rodape"><b>DATA ÚLTIMA REVISÃO:</b> '+esc(fmtBR(a.dataRevisao))+'<br><b>APROVADO POR:</b> '+esc(a.aprovador||'')+'</div>'+
    '<h3 class="sec">Controle de Revisão</h3>'+
    '<table class="hist"><tr><th style="width:80px">Data</th><th style="width:60px">Revisão</th><th>Descrição/Modificação</th><th style="width:110px">Revisor</th><th style="width:110px">Aprovador</th></tr>'+
    (histHtml || '<tr><td colspan="5" style="text-align:center;color:#888">Sem histórico registrado</td></tr>')+
    '</table>'+
  '</div>';
  document.getElementById('toolbar').style.display = 'flex';
  const vTag = c.idade!==null ? (c.idade>365 ? ' · ⚠️ revisão vencida há '+(c.idade-365)+' dias' : '') : ' · ⚠️ sem data de revisão';
  document.getElementById('infoSel').textContent = c.cargo+' ('+c.area+') · '+c.rows.length+' linha(s) na base'+vTag;

document.getElementById('btnPdf').onclick = ()=>{
  if(!cargoSel) return;
  const t = document.title;
  document.title = 'Descrição de Cargo - '+cargoSel.cargo.replace(/[\\\/:*?"<>|]/g,'_')+' ('+cargoSel.area.replace(/[\\\/:*?"<>|]/g,'_')+')';
  window.print();
  setTimeout(()=>{ document.title = t; }, 500);
};
document.getElementById('busca').oninput = renderLista;
selArea.onchange = renderLista;
document.getElementById('fStatus').onchange = renderLista;
renderLista();
</script>
<script>
/* ================================================================
   ATUALIZADOR: lê DESCRICAO DE CARGO.xlsm direto no navegador.
   - 1º uso: clique em "Atualizar dados" e aponte a planilha.
   - Depois: a página tenta ler sozinha ao abrir (se o navegador
     mantiver a permissão) e usa sempre o dado mais novo.
   ================================================================ */
(function(){
  const NOME_LS = 'dcDadosV1';
  const COLS = ['empresa','gestor','area','cargo','cargoNovo','cbo','sumaria','atividades','formacao','experiencia','conhecimentos','softskills','areaAtuacao','eGestor','nivel','dataRevisao','elaborador','aprovador','dataHist','versao','descRev','revisor','aprovadorHist','atual'];

  function idb(){ return new Promise((res,rej)=>{ const rq = indexedDB.open('dcArquivos',1); rq.onupgradeneeded = ()=>rq.result.createObjectStore('kv'); rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error); }); }
  async function idbGet(k){ const db = await idb(); return new Promise((res,rej)=>{ const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = ()=>res(t.result); t.onerror = ()=>rej(t.error); }); }
  async function idbSet(k,v){ const db = await idb(); return new Promise((res,rej)=>{ const t = db.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess = ()=>res(); t.onerror = ()=>rej(t.error); }); }

  function desEsc(s){ return s.replace(/_x([0-9A-Fa-f]{4})_/g,(m,h)=>String.fromCharCode(parseInt(h,16))); }
  function textoSi(si){ let s=''; for(const t of si.getElementsByTagName('t')) s += t.textContent; return desEsc(s).replace(/\r\n?/g,'\n'); }
  function colIdx(ref){ let n=0; for(let i=0;i<ref.length;i++){ const c = ref.charCodeAt(i); if(c>=65&&c<=90) n = n*26+c-64; else break; } return n; }
  function serialParaIso(raw){ const n = Number(raw); if(!isFinite(n)||n<60) return String(raw); return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10); }

  async function descompactar(buf){
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error('o arquivo não parece ser uma planilha válida');
    const total = dv.getUint16(eocd+10,true);
    let off = dv.getUint32(eocd+16,true);
    const ent = new Map();
    for(let i=0;i<total;i++){
      if(dv.getUint32(off,true)!==0x02014b50) break;
      const metodo = dv.getUint16(off+10,true), tam = dv.getUint32(off+20,true);
      const nl = dv.getUint16(off+28,true), xl = dv.getUint16(off+30,true), cl = dv.getUint16(off+32,true);
      const lo = dv.getUint32(off+42,true);
      ent.set(new TextDecoder().decode(u8.subarray(off+46,off+46+nl)), {metodo,tam,lo});
      off += 46+nl+xl+cl;
    }
    return async function ler(nome){
      const e = ent.get(nome);
      if(!e) return null;
      const nl = dv.getUint16(e.lo+26,true), xl = dv.getUint16(e.lo+28,true);
      const ini = e.lo+30+nl+xl;
      const dados = u8.subarray(ini, ini+e.tam);
      if(e.metodo===0) return new TextDecoder().decode(dados);
      return await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
  }

  function lerCelulas(doc, shared){
    const grade = new Map(); let maxR = 0;
    for(const c of doc.getElementsByTagName('c')){
      const ref = c.getAttribute('r'); if(!ref) continue;
      const col = colIdx(ref), lin = parseInt(ref.replace(/[A-Z]/g,''),10);
      const t = c.getAttribute('t'); let val = '';
      if(t==='inlineStr'){ const is = c.getElementsByTagName('is')[0]; val = is ? textoSi(is) : ''; }
      else{
        const v = c.getElementsByTagName('v')[0];
        if(v){
          const raw = v.textContent;
          if(t==='s') val = shared[parseInt(raw,10)] ?? '';
          else if(t==='b') val = raw==='1' ? 'VERDADEIRO' : 'FALSO';
          else if(t==='e') val = '';
          else val = raw;
        }
      }
      if(val!==''){ grade.set(lin+':'+col, val); if(lin>maxR) maxR = lin; }
    }
    return {grade, maxR};
  }

  async function lerXlsm(file){
    const ler = await descompactar(await file.arrayBuffer());
    const dp = new DOMParser();
    const wb = dp.parseFromString(await ler('xl/workbook.xml'),'text/xml');
    const rl = dp.parseFromString(await ler('xl/_rels/workbook.xml.rels'),'text/xml');
    const rels = {};
    for(const r of rl.getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    const alvos = {};
    for(const sh of wb.getElementsByTagName('sheet')){
      let tg = rels[sh.getAttribute('r:id')];
      if(!tg) continue;
      alvos[sh.getAttribute('name')] = tg.startsWith('/') ? tg.slice(1) : 'xl/'+tg;
    }
    const shared = [];
    const ssTxt = await ler('xl/sharedStrings.xml');
    if(ssTxt){ for(const si of dp.parseFromString(ssTxt,'text/xml').getElementsByTagName('si')) shared.push(textoSi(si)); }

    const nomeBase = Object.keys(alvos).find(n=>n.toLowerCase().startsWith('descri'));
    if(!nomeBase) throw new Error('aba "Descrições de cargo" não encontrada no arquivo');
    const nomeSS = Object.keys(alvos).find(n=>n.toUpperCase().includes('SOFT'));

    const base = lerCelulas(dp.parseFromString(await ler(alvos[nomeBase]),'text/xml'), shared);
    const rows = [];
    for(let r=4;r<=base.maxR;r++){
      const o = {row:r}; let tem = false;
      for(let c=1;c<=24;c++){
        let s = String(base.grade.get(r+':'+c) ?? '');
        if((c===16||c===19) && /^\d+(\.\d+)?$/.test(s.trim())) s = serialParaIso(s.trim());
        s = s.trim();
        if(s) tem = true;
        o[COLS[c-1]] = s;
      }
      if(tem) rows.push(o);
    }
    let softskills = [];
    if(nomeSS){
      const ss = lerCelulas(dp.parseFromString(await ler(alvos[nomeSS]),'text/xml'), shared);
      for(let r=2;r<=ss.maxR;r++){
        const nv = String(ss.grade.get(r+':1') ?? '').trim();
        if(nv) softskills.push({nivel:nv, skills:String(ss.grade.get(r+':2') ?? '').trim()});
      }
    }
    const dt = new Date(file.lastModified);
    return { ts: dt.toISOString().slice(0,19)+'Z',
             geradoEm: String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'),
             rows, softskills };
  }

  async function obterArquivo(interativo){
    if('showOpenFilePicker' in window){
      try{
        let h = await idbGet('xlsm');
        if(h){
          let p = await h.queryPermission({mode:'read'});
          if(p!=='granted' && interativo) p = await h.requestPermission({mode:'read'});
          if(p==='granted'){ try{ return await h.getFile(); }catch(e){} }
          if(!interativo) return null;
        }
        if(!interativo) return null;
        const [nh] = await window.showOpenFilePicker({types:[{description:'Planilha de descrições de cargo', accept:{'application/vnd.ms-excel.sheet.macroEnabled.12':['.xlsm'],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});
        await idbSet('xlsm', nh);
        return await nh.getFile();
      }catch(e){ if(e && e.name==='AbortError') return null; if(!interativo) return null; }
    }
    if(!interativo) return null;
    return new Promise(res=>{
      const i = document.createElement('input');
      i.type = 'file'; i.accept = '.xlsm,.xlsx';
      i.onchange = ()=>res(i.files[0]||null);
      i.click();
    });
  }

  async function atualizar(interativo){
    const st = document.getElementById('fonteInfo');
    try{
      const file = await obterArquivo(interativo);
      if(!file) return;
      const tsArq = new Date(file.lastModified).toISOString().slice(0,19)+'Z';
      if(window.__tsMs(tsArq) <= window.__tsMs(window.__FONTE_TS)){
        if(interativo && st) st.textContent = (st.textContent||'').replace(/ · planilha.*$/,'') + ' · planilha não mudou desde então';
        return;
      }
      if(st) st.textContent = 'lendo a planilha…';
      const fonte = await lerXlsm(file);
      localStorage.setItem(NOME_LS, JSON.stringify(fonte));
      location.reload();
    }catch(e){
      if(interativo) alert('Não foi possível ler a planilha: ' + (e && e.message ? e.message : e));
    }
  }

  /* Hospedado em http/https (GitHub Pages) não existe planilha local para ler:
     esconde o botão e não tenta a leitura automática. Em file:// mantém tudo. */
  const NA_WEB = location.protocol === 'http:' || location.protocol === 'https:';
  const b = document.getElementById('btnAtualizar');
  if(NA_WEB){
    if(b) b.remove();
    return;
  }
  if(b) b.onclick = ()=>atualizar(true);
  atualizar(false);
})();
</script>
