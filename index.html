:"GERENTE DE PEOPLE","area":"PEOPLE","cargo":"BUSINESS PARTNER JR","cargoNovo":"BUSINESS PARTNER","cbo":"252405","sumaria":"Alinhar a estratégia de gestão de pessoas aos objetivos da empresa, atuando como consultor interno das áreas de negócio. Apoiar líderes na tomada de decisão, no desenvolvimento de times e na construção de um ambiente de alta performance, por meio de soluções de RH integradas (talentos, desempenho, cultura, clima, remuneração e engajamento).","atividades":"Alinhar as práticas de People aos objetivos estratégicos das áreas atendidas, apoiando na seleção, desenvolvimento e retenção de talentos, em linha com a estratégia do negócio. \nAtuar como parceiro da liderança, assessorando a alta gestão na tomada de decisões estratégicas relacionadas a pessoas (estrutura, sucessão, desempenho, movimentações, clima).\nPromover o engajamento e a cultura organizacional, apoiando líderes na disseminação de valores, comportamentos‑chave e práticas de alta performance dentro das equipes. \nFacilitar mudanças organizacionais, liderando ou apoiando iniciativas de mudança (reorganizações, novos modelos de trabalho, implantação de políticas/processos de RH, projetos específicos da área atendida). \nMapear necessidades das áreas de negócio (capacidade organizacional, competências, estrutura, clima) e propor soluções de RH integradas (treinamento, desenvolvimento, desenho de cargos, planos de sucessão, ações de engajamento). \nAnalisar dados de pessoas (People Analytics) – indicadores de turnover, absenteísmo, performance, clima, engajamento, headcount, equidade – identificando falhas, riscos e oportunidades e construindo planos de ação com os gestores. \nConduzir, apoiar e acompanhar o ciclo de gestão de desempenho, garantindo alinhamento de metas, calibragem, feedbacks e planos de desenvolvimento individual/por equipe.\nApoiar a implementação de políticas, programas e processos de RH (R&S, TD&E, remuneração e benefícios, diversidade & inclusão, saúde mental, etc.) nas áreas atendidas, garantindo entendimento e aderência.\nAtuar em temas trabalhistas e de relações de trabalho, orientando gestores quanto à legislação, políticas internas, conduta, gestão de conflitos e riscos de passivo.\nParticipar de reuniões com stakeholders internos para entender necessidades de negócio, traduzir em demandas de pessoas e cocriar soluções com as demais células de People (R&S, TD&E, Remuneração, DHO).\nDesenvolver líderes, apoiando em temas de liderança, feedback, comunicação, gestão de conflitos e tomada de decisão sobre o time.\nPlanejar e acompanhar planos de ação de clima organizacional, incluindo leitura de pesquisas de engajamento, construção de ações com o negócio e monitoramento de resultados.\nAtender demandas operacionais e administrativas de RH relacionadas às áreas de negócio (movimentações, enquadramentos, dúvidas de políticas, interfaces com DP/Folha), garantindo fluidez com o backoffice.\nIdentificar oportunidades de melhoria nos processos internos de People, propondo ações, automações e novos fluxos, inclusive com uso de RPA e IA quando aplicável.\nApoiar comunicação e engajamento entre People e as demais áreas, garantindo clareza de mensagens, alinhamento das iniciativas e coerência com a cultura","formacao":"Ensino Superior completo em Psicologia, Administração, Contabilidade, Gestão de Recursos Humanos ou áreas correlatas.\nDesejável: Pós‑graduação em Gestão de Pessoas, Negócios, Estratégia ou áreas afins.","experiencia":"4 anos","conhecimentos":"Gestão de talentos e desenvolvimento humano organizacional (R&S, trilhas de desenvolvimento, sucessão, cultura e clima). \nLegislação trabalhista e Compliance, incluindo conceitos de relações de trabalho, jornada, benefícios e práticas éticas de gestão de pessoas.\nModelos de gestão de desempenho e ferramentas de clima organizacional, incluindo construção de metas, feedback estruturado e leitura de indicadores.\nPeople Analytics e ferramentas de dados de RH (Excel avançado, Power BI e sistemas de gestão de RH, Gupy, Sólides ou similares). \nMetodologias ágeis e noções básicas de automação (RPA) e Inteligência Artificial aplicadas a processos de RH.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-10-29","elaborador":"Rafael Veiber","aprovador":"Cicero Brandt","dataHist":"2026-10-29","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Cicero Brandt","atual":"Atual"},{"row":192,"empresa":"WAP","gestor":"GERENTE DE PEOPLE","area":"PEOPLE","cargo":"BUSINESS PARTNER JR","cargoNovo":"BUSINESS PARTNER","cbo":"252405","sumaria":"Alinhar a estratégia de gestão de pessoas aos objetivos da empresa, atuando como consultor interno das áreas de negócio. Apoiar líderes na tomada de decisão, no desenvolvimento de times e na construção de um ambiente de alta performance, por meio de soluções de RH integradas (talentos, desempenho, cultura, clima, remuneração e engajamento).","atividades":"Alinhar as práticas de People aos objetivos estratégicos das áreas atendidas, apoiando na seleção, desenvolvimento e retenção de talentos, em linha com a estratégia do negócio. \nAtuar como parceiro da liderança, assessorando a alta gestão na tomada de decisões estratégicas relacionadas a pessoas (estrutura, sucessão, desempenho, movimentações, clima).\nPromover o engajamento e a cultura organizacional, apoiando líderes na disseminação de valores, comportamentos‑chave e práticas de alta performance dentro das equipes. \nFacilitar mudanças organizacionais, liderando ou apoiando iniciativas de mudança (reorganizações, novos modelos de trabalho, implantação de políticas/processos de RH, projetos específicos da área atendida). \nMapear necessidades das á pedição e recebimento, garantindo acuracidade e conformidade fiscal.","atividades":"Conferir produtos recebidos e expedidos, validando quantidade, qualidade e especificações.\nAnalisar documentação fiscal e pedidos de compra/venda.\nAtualizar sistemas de gestão de estoque com movimentações.\nRealizar cubagem e roteirização de cargas.\nApoiar inventários e auditorias internas.\nIdentificar e reportar divergências para áreas responsáveis.\nOrientar auxiliares sobre procedimentos corretos.\nGarantir cumprimento das normas de segurança e qualidade.","formacao":"Ensino médio completo (desejável técnico em logística","experiencia":"1 ano","conhecimentos":"Interpretação de notas fiscais e pedidos.\nSistemas de gestão de estoque (ERP/WMS).\nTécnicas de armazenagem e expedição.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Operador","dataRevisao":"2026-01-02","elaborador":"Rafael Veiber","aprovador":"Rogerio Rezende","dataHist":"2026-01-02","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Rogerio Rezende","atual":"Atual"},{"row":197,"empresa":"WAP","gestor":"LIDER DE LOGISTICA / PRODUCAO / EXPEDICAO","area":"LOGISTICA / PRODUÇÃO / EXPEDICAO","cargo":"CONFERENTE SR","cargoNovo":"CONFERENTE SR","cbo":"414215","sumaria":"Responsável por garantir a acuracidade dos processos de conferência, liderar inventários, propor melhorias e atuar como referência técnica para equipe, assegurando compliance e eficiência operacional.","atividades":"Coordenar e executar conferência de cargas complexas e sensíveis.\nValidar documentação fiscal e garantir conformidade legal.\nPlanejar e liderar inventários gerais e rotativos.\nAnalisar indicadores de acuracidade e propor melhorias.\nTreinar e orientar equipe  marca, como ecommerces e site correlacionados.","formacao":"Ensino superior completo em Design Gráfico, Design de Comunicação, Publicidade e Propaganda ou áreas correlatas.\nDesejável certificações ou cursos avançados em ferramentas de criação, motion básico ou design digital.","experiencia":"2 anos","conhecimentos":"Domínio de ferramentas de criação (Adobe Photoshop, Illustrator, InDesign; desejável conhecimento em Figma/XD/Canva profissional).\nConhecimento de princípios de branding, tipografia, teoria das cores, composição e hierarquia visual.\nBoa compreensão de requisitos técnicos para impressão e meios digitais, incluindo otimização para web e mobile.\nNoções de UX/UI para apoiar elaboração de layouts voltados a interfaces digitais.\nCapacidade de interpretar briefings, propor soluções e argumentar tecnicamente com clientes internos.\nNoção básica de edição de vídeo.\n","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-02-05","elaborador":"Rafael Veiber","aprovador":"Tiago Fedalto, Maicon Olimpio","dataHist":"2026-02-05","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Tiago Fedalto, Maicon Olimpio","atual":"Atual"},{"row":229,"empresa":"WAP","gestor":"SUPERVISOR DE MARKETING","area":"MARKETING","cargo":"DESIGNER PL","cargoNovo":"DESIGNER SR","cbo":"262410","sumaria":"Atua como referência técnica em design gráfico, liderando soluções visuais para campanhas e projetos estratégicos, garantindo a evolução e a consistência da identidade visual da marca. Orienta profissionais menos experientes, apoia decisões de comunicação visual e interage com múltiplos stakeholders internos e externos.","atividades":"Conduzir o desenvolvimento de conceitos visuais e campanhas gráficas complexas, do briefing à entrega final, para canais on e offline.\nAtuar como guardião da identidade visual da marca, definindo e atualizando padrões, manuais de aplicação e guidelines para a organização.\nOrientar e revisar o trabalho de Designers Júnior/Pleno e terceiros (agências, freelancers), garantindo qualidade técnica e conceitual.\nDesenvolver layouts avançados para materiais estratégicos (grandes campanhas, lançamentos de produto, apresentações de alta gestão, relatórios institucionais).\nPropor melhorias de linguagem visual e soluções criativas que aumentem impacto, clareza de mensagem e experiência do usuário.\nConduzir a interface com áreas-chave (Marketing, Comercial, Produto, Comunicação Interna, Alta Gestão) para alinhamento de expectativas e apresentação de propostas.\nApoiar decisões relacionadas à contratação e avaliação de fornecedores gráficos, agências e ferramentas de criação.\nMonitorar tendências de design, comunicação e tecnologia, incorporando boas práticas e inovações ao padrão de materiais da empresa.\nContribuir na definição de processos, fluxos e ferramentas da área de criação, buscando eficiência e padronização.\nGarantir aderência às diretrizes de marca em todas as frentes de comunicação visual, inclusive iniciativas não diretamente produzidas pela equipe (ex.: materiais de parceiros).\nDesenvolvimento e criação de materiais PDV, assim como acompanhamento da produção do material.\nCriação de Landing Page para os canais da marca, como ecommerces e site correlacionados.","formacao":"Ensino superior completo em Design Gráfico, Design de Comunicação, Publicidade \ne Propaganda ou áreas correlatas.\nDesejável certificações ou cursos avançados em ferramentas de criação, motion básico ou \ndesign digital.","experiencia":"4 anos","conhecimentos":"Domínio avançado de ferramentas de criação e diagramação (Adobe Creative Cloud completa; desejável conhecimento em motion design e prototipagem).\n nsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-02-11","elaborador":"Rafael Veiber","aprovador":"Leandro de Azevedo","dataHist":"2026-02-11","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Leandro de Azevedo","atual":"Atual"},{"row":231,"empresa":"WAP","gestor":"GERENTE INOVACAO E DEV DE SOFTWARE","area":"TI","cargo":"DIGITAL PRODUCT OWNER SR","cargoNovo":"DIGITAL PRODUCT OWNER SR","cbo":"142510","sumaria":"Maximiza o valor entregue pelos produtos digitais sob sua responsabilidade, conectando objetivos do negócio às entregas do time. Define visão, roadmap e backlog priorizado por valor, risco e dependências, garantindo clareza e governança de decisões. Conduz alinhamentos com áreas usuárias e valida incrementos com usuários para assegurar aderência e adoção. Trabalha com soluções digitais e engenharia para equilibrar evolução, qualidade e confiabilidade, evitando crescimento desordenado de escopo. Acompanha indicadores do produto e orienta ajustes contínuos com base em evidências.","atividades":"Definir visão e objetivos do produto, consolidando critérios de sucesso mensuráveis e prioridades claras.\nEstruturar roadmap e traduzir estratégia em entregas incrementais com valor verificável.\nConstruir e priorizar backlog por valor, risco, dependências e esforço, garantindo transparência de decisões.\nGarantir qualidade de requisitos e critérios de aceite com apoio dos analistas de negócio e processos.\nFacilitar alinhamento com áreas usuárias, mediar conflitos e consolidar decisões de escopo e prioridade.\nPlanejar releases e coordenar validação com usuários, garantindo aceite, adoção e transição organizada.\nAcompanhar indicadores de adoção, satisfação, qualidade e eficiência, propondo melhorias orientadas por dados.\nControlar mudanças de escopo, assegurando rastreabilidade e evitando ambiguidade em decisões.\nTrabalhar com soluções digitais e desenvolvimento sinalizar necessidade de escalonamento técnico.\nZelar pela organização da área, ferramentas, instrumentos e sobressalentes utilizados no trabalho.\nCumprir normas técnicas, requisitos de qualidade, segurança do trabalho e preservação ambiental.","formacao":"Curso Técnico completo em Eletromecânica, Mecânica, Elétrica, Eletrotécnica ou áreas correlatas.","experiencia":"1 ano","conhecimentos":"Leitura e interpretação de desenhos técnicos, diagramas e esquemas elétricos. Noções de manutenção preventiva e corretiva em máquinas e instalações eletromecânicas. Conhecimento básico de desmontagem, montagem, ajuste e testes funcionais de componentes. Noções de instrumentos de medição, comandos elétricos, componentes mecânicos e práticas seguras de manutenção. Conhecimento inicial em identificação de falhas, registros de manutenção e rotinas industriais padronizadas. [ocupacoes.com.br]","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Operador","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Rogério Rezende","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Rogério Rezende","atual":"Atual"},{"row":238,"empresa":"WAP","gestor":"COORDENADOR DE PRODUCAO","area":"PRODUÇÃO","cargo":"ELETROMECANICO PL","cargoNovo":"ELETROMECANICO PL","cbo":"300305","sumaria":"Executar com autonomia operacional moderada atividades de manutenção preventiva, corretiva e diagnóstico eletromecânico em máquinas, equipamentos e instalações, atuando na identificação de falhas, substituição e regulagem de componentes, testes de desempenho e apoio à melhoria da confiabilidade dos ativos.","atividades":"Executar manutenções preventivas e corretivas em máquinas, equipamentos e instalações eletromecânicas com autonomia operacional, respeitando rotinas, prioridades, padrões técnicos e requisitos de segurança.\nDiagnosticar falhas eletromecânicas por meio de análise de sintomas, inspeção técnica, testes funcionais, interpretação de esquemas e verificação do comportamento operacional dos equipamentos.\nInterpretar desenhos técnicos, diagramas elétricos, especificações, listas de materiais e orientações de montagem para conduzir intervenções com precisão técnica.\nRealizar desmontagem, reparo, substituição, alinhamento, regulagem, ajuste e remontagem de conjuntos, subconjuntos e componentes eletromecânicos.\nTestar e validar o funcionamento dos equipamentos após manutenção, assegurando a qualidade da intervenção, a segurança da liberação e a retomada adequada da operação.\nIdentificar causas prováveis de falhas recorrentes, propor correções de rotina e recomendar ações preventivas para reduzir reincidência e elevar a confiabilidade dos ativos.\nApoiar o planejamento técnico das intervenções, avaliando recursos, materiais, sequência de execução, tempo estimado e impacto operacional da atividade.\nRegistrar de forma estruturada as intervenções realizadas, causas observadas, peças aplicadas, testes executados, resultados obtidos e recomendações para histórico técnico.\nAcompanhar o comportamento do equipamento após reparos, monitorando sinais de anomalia e propondo ajustes adicionais quando necessário para estabilização operacional.\nOrientar tecnicamente profissionais menos experientes em procedimentos de execução, desmontagem, montagem, testes e cuidados básicos de manutenção.\nAtuar em conjunto com operação e liderança local para priorização de atendimentos, definição de janelas de intervenção e minimização do impacto produtivo.\nContribuir para melhoria contínua dos processos de manutenção, sugerindo ajustes em rotinas, métodos, componentes e padrões de execução com foco em segurança, qualidade e eficiência.","formacao":"Curso Técnico completo em Eletromecânica, Mecânica, Elétrica, Eletrotécnica ou áreas correlatas.","experiencia":"3 anos","conhecimentos":"Leitura e interpretação avançada de desenhos técnicos, diagramas e esquemas elétricos. Diagnóstico de falhas mecânicas, elétricas e eletromecânicas em equipamentos industriais. Montagem, alinhamento, regulagem, ajuste e testes funcionais em conjuntos eletromecânicos. Conhecimento de manutenção preventiva, corretiva e práticas de análise de falhas. Noções consolidadas de confiabilidade, registro técnico da manutenção, priorização de chamados e segurança em manutenção industrial.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Operador","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Rogério Rezende","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Rogério Rezende","atual":"Atual"},{"row":239,"empresa":"","gestor":"","area":"FACILITIES","cargo":"ENCARREGADO DE MANUTENÇÃO","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":240,"empresa":"WAP","gestor":"GERENTE DE DADOS E IA","area":"DADOS","cargo":"ENGENHEIRO DE DADOS JR","cargoNovo":"ENGENHEIRO DE DADOS JR","cbo":"242410","sumaria":"Responsável por apoiar o desenvolvimento e a manutenção de pipelines e estruturas de dados, garantindo a ingestão, armazenamento e disponibilização básica de informações para uso analítico. Atua em atividades mais estruturadas, sob orientação de profissionais Pl e Sr, com foco em qualidade, organização e aprendizado de boas práticas de engenharia de dados.","atividades":"Apoiar a construção e manutenção de pipelines de dados (ETL/ELT) para ingestão de fontes internas e externas.\nImplementar ajustes simples em scripts de transformação (SQL/Python) conforme especificações do time.\nAjudar na criação e atualização de tabelas e partições em data lake / data warehouse, seguindo padrões definidos.\nExecutar testes básicos de qualidade de dados (completude, consistência, duplicidade) e registrar evidências.\nMonitorar rotinas de dados (jobs agendados), sinalizando falhas e atuando em correções simples.\nAtualizar documentação de fluxos, tabelas e mapeamentos de origem-destino.\nAuxiliar na configuração e manutenção de conexões entre fontes de dados e ambientes analíticos.\nColaborar com Analytics Engineers, Engenheiros de Dados Pl/Sr e equipe de BI em demandas pontuais de dados.","formacao":"Superior cursando ou completo em Ciência da Computação, Engenharia, Sistemas de Informação, Estatística ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Conhecimento prático de SQL e noções de Python para manipulação de dados; entendimento básico de conceitos de ETL/ELT, data lake e data warehouse; familiaridade com ao menos um banco de dados relacional; noções de versionamento de código (Git) e organização de repositórios; entendimento básico de ambientes de TI e comunicação de dados corporativos.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-03-06","elaborador":"Rafael Veiber","aprovador":"Beatriz Paulino","dataHist":"2026-03-06","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Beatriz Paulino","atual":"Atual"},{"row":241,"empresa":"WAP","gestor":"GERENTE DE DADOS E IA","area":"DADOS","cargo":"ENGENHEIRO DE DADOS PL","cargoNovo":"ENGENHEIRO DE DADOS PL","cbo":"242410","sumaria":"Responsável por desenhar, desenvolver e manter pipelines de dados e estruturas analíticas de média complexidade, garantindo ingestão, transformação, armazenamento e disponibilização de dados com qualidade e performance adequadas. Atua em colaboração com Engenharia de Dados Sr, Analytics e áreas de negócio, com autonomia moderada para propor melhorias em processos e modelos de dados.","atividades":"Projetar e implementar pipelines de dados (ETL/ELT) de ponta a ponta, integrando múltiplas fontes (APIs, bancos relacionais, arquivos, etc.).\nModelar dados em estruturas de data lake e data warehouse, respeitando padrões definidos (modelagem dimensional, normalização, particionamento).\nOtimizar consultas e processos de dados (tuning de SQL, uso eficiente de recursos de processamento).\nGarantir qualidade e integridade de dados, implementando regras de validação e monitoramento.\nManter documentação técnica de fluxos, tabelas, mapeamentos e regras de negócio.\nApoiar projetos de migração de dados entre ambientes (on-premise / cloud), identificando impactos e dependências.\nColaborar com Analytics Engineers e profissionais de BI para disponibilização de datasets e camadas de consumo.\nAplicar boas práticas de versionamento (Git), automação e orquestração de pipelines (schedulers, workflows).\nSugerir melhorias em arquitetura, padrões de dados e processos de engenharia, com base em métricas de performance e estabilidade.","formacao":"Superior completo em Ciência da Computação, Engenharia, Sistemas de Informação, Estatística ou áreas correlatas.","experiencia":"3 anos","conhecimentos":"Conhecimento sólido em SQL e Python (ou linguagem equivalente) para construção de pipelines; experiência com ferramentas de adrões de uso de recursos.\nAtuar como referência técnica para Engenheiros de Dados Jr/Pl, revisando soluções, códigos e decisões de arquitetura.\nTrabalhar em conjunto com times de Rede/Infraestrutura (quando aplicável) para assegurar conectividade, disponibilidade e segurança entre fontes, lakes e consumidores.\nApoiar decisões estratégicas de dados junto à liderança de Dados & Analytics e de Negócios (roadmap, priorização, trade-offs técnicos).\nLiderar iniciativas de modernização de plataformas (por exemplo, migração para cloud, adoção de novas ferramentas de streaming e orquestração).\nEstabelecer e disseminar boas práticas de DataOps (CI/CD para dados, monitoramento, alertas, SLOs de pipelines).\nGarantir documentação de alto nível da arquitetura de dados e comunicação clara sobre impactos de mudanças para os stakeholders.","formacao":"Superior completo em Ciência da Computação, Engenharia, Sistemas de Informação, Estatística ou áreas correlatas.\nDesejável pós-graduação/especialização em Engenharia de Dados, Big Data, Arquitetura de Dados ou temas afins.","experiencia":"5 anos","conhecimentos":"Domínio de SQL avançado e Python (ou linguagem equivalente) para grandes volumes de dados; experiência robusta com arquiteturas de data lake / data warehouse / streaming; forte entendimento de cloud (AWS, Azure, GCP ou similares); conhecimento aprofundado de governança, segurança, compliance e monitoramento de dados; domínio de ferramentas de orquestração e integração; boa compreensão de infraestrutura de TI e comunicação de dados.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-03-06","elaborador":"Rafael Veiber","aprovador":"Beatriz Paulino","dataHist":"2026-03- ades":"Planejar e executar comunicados internos (e, quando aplicável, externos) em diversos canais (intranet, e-mail, murais, redes sociais corporativas, etc.), garantindo consistência de linguagem e alinhamento com a marca.\nCoordenar campanhas internas, eventos corporativos e ações de endomarketing, conectando-as à cultura e aos objetivos estratégicos da empresa.\nDesenvolver conteúdos institucionais e materiais de comunicação para treinamentos, programas de integração e iniciativas de cultura e pessoas.\nMonitorar indicadores de comunicação interna e, quando aplicável, insumos de clima organizacional, propondo melhorias baseadas em dados (alcance, engajamento, leitura, participação).\nAtuar na comunicação de mudanças organizacionais e situações de crise, garantindo transparência, alinhamento e mitigação de ruídos com os colaboradores.\nLiderar projetos de inovação em comunicação interna, avaliando e implementando novas tecnologias, canais e formatos (por exemplo, apps internos, vídeos, podcasts, campanhas digitais).\nGerenciar o orçamento da área de comunicação interna, otimizando recursos, avaliando fornecedores e garantindo aderência às políticas financeiras.\nEstabelecer parcerias com áreas internas (People, Marketing, Operações, Jurídico, etc.), atuando como referência técnica em comunicação interna e apoiando gestores na construção de mensagens.\nOrientar e desenvolver membros da equipe de comunicação (estagiários, analistas), distribuindo demandas, revisando entregas e promovendo boas práticas de comunicação interna.\nGarantir que todas as ações de comunicação interna estejam alinhadas às políticas corporativas, à identidade de marca e às diretrizes de compliance.","formacao":"Ensino superior completo em Comunicação Social, Jornalismo, Publicidade e Propaganda, Marketing ou áreas correlatas.","experiencia":"4 anos","conhecimentos":"Domínio em estratégias de comunicação interna e engajamento de colaboradores (campanhas, endomarketing, planos de comunicação). \nConhecimento em comunicação de crise e gestão da mudança (planejamento de mensagens, suporte à liderança, Q&A, gestão de riscos de reputação interna). \nConhecimento avançado em análise de indicadores de comunicação (taxa de abertura, alcance, engajamento, interação), utilizando ferramentas como Excel avançado e Power BI. \nExperiência com ferramentas e plataformas digitais de comunicação (intranet, comunicação via apps, newsletters, redes sociais corporativas, plataformas de vídeo). \nNoções de branding e alinhamento de comunicação interna com a marca empregadora e a estratégia de People.","softskills":"Gestão de Pessoas – Desenvolve equipe e delega responsabilidades.\nVisão Sistêmica – Compreende impacto das decisões no processo.\nInfluência Positiva – Engaja equipe para atingir metas.\nGestão de Conflitos Complexos – Media situações críticas.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Supervisor","dataRevisao":"2026-03-06","elaborador":"Rafael Veiber","aprovador":"Cicero Brandt","dataHist":"2026-03-06","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Cicero Brandt","atual":"Atual"},{"row":245,"empresa":"WAP","gestor":"DIRETOR DE NEGOCIOS","area":"P&D","cargo":"ESPECIALISTA DE INTELIGENCIA DE MERCADO","cargoNovo":"ESPECIALISTA DE INTELIGENCIA DE MERCADO","cbo":"142335","sumaria":"Responsável por atuar como referência técnica em Inteligência de Mercado e S&OP/S&OE, desenhando e aperfeiçoando modelos analíticos, processos e governança que suportam decisões estratégicas da Diretoria de Negócios e da alta gestão. Garante que as decisões de demanda, portfólio e canais estejam ancoradas em dados de mercado e em práticas avançadas de planejamento integrado de vendas e operações.","atividades":"Desenhar e evoluir a arquitetura de Inteligência de Mercado (fontes de dados, modelos de análise, indicadores-chave) conectada ao ciclo de S&OP e à estratégia da Diretoria de Negócios.\nDesenvolver modelos avançados de análise de cargoNovo":"ESPECIALISTA DE MARKETING","cbo":"142335","sumaria":"Responsável por planejar, executar e otimizar estratégias de marketing da organização, com foco em geração de demanda, fortalecimento de marca e suporte às áreas comerciais. Atua como referência técnica na análise de mercado, comportamento do cliente e performance de campanhas, propondo soluções de alta complexidade para alavancar resultados de negócios, integrando canais on-line e off-line.","atividades":"Planejar e implementar campanhas de marketing (on-line e off-line), alinhadas ao posicionamento da marca e aos objetivos de negócio.\nAnalisar mercado, concorrência e comportamento do consumidor, produzindo insights para apoiar decisões estratégicas.\nGerenciar e otimizar canais digitais, acompanhando indicadores de performance.\nDesenvolver e/ou executar a produção de conteúdos (briefings, roteiros, peças gráficas, vídeos, landing pages, etc) em conjunto com fornecedores ou equipes internas de criação.\nEstruturar e acompanhar jornadas de cliente, funil de vendas e programas de nutrição de leads, em parceria com as áreas Comercial e de Produtos.\nDefinir métricas, construir dashboards e elaborar relatórios analíticos de resultados de campanhas, propondo planos de ação para melhoria contínua.\nAtuar como consultor interno de marketing, apoiando áreas de negócio em lançamentos de produtos, eventos, feiras e ações promocionais.\nSelecionar, negociar e gerir fornecedores de marketing, avaliando qualidade, prazos e custos.\nGarantir o alinhamento de todas as peças e ações à diretriz de branding, identidade visual e posicionamento institucional da empresa.\nParticipar da elaboração do orçamento de marketing e acompanhar a execução, controlando investimentos por campanha/canal.\nMonitorar tendências de marketing, comunicação e tecnologia, propondo inovações que aumentem a efetividade das ações.\nAssegurar conformidade das campanhas com políticas internas, legislação aplicável e normas de compliance.","formacao":"Graduação completa em Marketing, Publicidade e Propaganda, Administração com ênfase em Marketing, Comunicação Social ou áreas correlatas.\nDesejável pós-graduação ou MBA em Marketing Digital, Gestão de Marketing, Inteligência de Mercado ou áreas afins.","experiencia":"5 anos","conhecimentos":"Profundo domínio de estratégias e ferramentas de marketing digital.\nConhecimento avançado em métricas de performance e ferramentas de análise de dados.\nCapacidade de estruturar planos de marketing integrados, com foco em geração de demanda, retenção e posicionamento de marca.\nConhecimento de técnicas de segmentação de público, jornada do cliente, funil de vendas e estratégias de inbound/outbound.\nDomínio de elaboração de briefings, gestão de agências e fornecedores, além de noções de criação e usabilidade para campanhas digitais.\nEntendimento de orçamento de marketing, planejamento de mídia, forecast de resultados e modelos de atribuição.\nConhecimentos de legislação e boas práticas aplicáveis.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-03-16","elaborador":"Rafael Veiber","aprovador":"Tiago Veiga","dataHist":"2026-03-16","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Tiago Veiga","atual":"Atual"},{"row":249,"empresa":"WAP","gestor":"GERENTE ADM DE VENDAS E DEMANDA","area":"ADM DE VENDAS","cargo":"ESPECIALISTA DE S&OP","cargoNovo":"ESPECIALISTA DE S&OP","cbo":"252710","sumaria":"Atuar como referência técnica em S&OP e Planejamento de Demanda, garantindo a governança do processo, a qualidade das premissas, a integração entre áreas e a geração de análises avançadas para suportar decisões estratégicas. É responsável por consolidar, interpretar e desafiar informações de demanda, Budget, metas, vendas, mercado e capacidade, propondo cenários, melhorias metodológicas, automações e recomendações para maximizar acuracidade, previsibilidade e alinhamento do plano integrado.","atividades":"Liderar tecnicamente o processo de consolidação das demandas comerciais, garantindo consistência, rastreabilidade e alinhamento das premissas. \nDesenvolver análises avançadas de demanda histórica, baseline, incrementais, Sell In, Sell Out, dados de mercado, sazonalidade, campanhas, lançamentos e variações comerciais. \nComparar Budget, forecast, demanda real, capacidade e metas acordadas, identificando desvios relevantes e recomendando ajustes ao plano. \nEstruturar cenários de demanda e projeções para suportar decisões estratégicas, trade-offs comerciais, financeiros e operacionais.\nDefinir, revisar e aprimorar KPIs de S&OP, acuracidade de forecast, aderência ao plano, variação de demanda e performance comercial.\nPreparar análises executivas e apresentações para alta gestão, traduzindo dados complexos em recomendações claras e acionáveis. \nConduzir discussões técnicas em fóruns de S&OP, influenciando stakeholders e promovendo alinhamento entre Comercial, Marketing, Finanças, Operações e Suprimentos. \nAtuar como guardião metodológico do processo de planejamento de demanda, propondo padrões, rituais, governança, critérios e melhores práticas.\nIdentificar oportunidades de automação, integração de sistemas, melhoria de bases e evolução de ferramentas analíticas. O documento original cita competências digitais como gestão de sistemas ERP/APS/CRM, análise de dados, automação de processos, previsão de demanda e integração de sistemas. \nInvestigar causas-raiz de desvios críticos, estruturando planos de ação com as áreas responsáveis.\nApoiar tecnicamente analistas e demais envolvidos no processo, elevando a maturidade analítica e a disciplina do ciclo de S&OP.\nRecomendar melhorias no modelo de planejamento, nas premissas comerciais e na integração entre demanda, capacidade e metas de negócio.","formacao":"Superior completo em Administração, Engenharia, Economia, Logística, Estatística, Ciência de Dados ou áreas correlatas. Pós-graduação ou MBA em Supply Chain, Gestão de Negócios, Planejamento, Finanças, Analytics ou áreas correlatas será diferencial.","experiencia":"7 anos","conhecimentos":"Domínio avançado de S&OP, planejamento de demanda, forecast e gestão de cenários.\nConhecimento robusto de Budget, metas, Sell In, Sell Out, baseline, incrementais e dados de mercado.\nExcel avançado, Power BI e ferramentas analíticas aplicadas à tomada de decisão.\nCapacidade de estruturar KPIs, governança, ritos de planejamento e análises executivas.\nVisão integrada de Comercial, Finanças, Suprimentos, Operações e estratégia de negócio.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Karine Fonseca","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Karine Fonseca","atual":"Atual"},{"row":250,"empresa":"WAP","gestor":"GERENTE DE SUPRIMENTOS","area":"SUPRIMENTOS","cargo":"ESPECIALISTA DE S&OP JR","cargoNovo":"ESPECIALISTA DE S&OP","cbo":"152335","sumaria":"Atuar como referência técnica no processo de S&OP e Planejamento de Demanda, garantindo a consolidação das demandas comerciais, análises de histórico e mercado, tratamento de baseline vs. incrementais, acompanhamento de KPIs e preparação de relatórios gerenciais para suportar decisões de planejamento, alinhamento interáreas e melhoria contínua do processo.","atividades":"Consolidar e validar demandas comerciais (inputs das áreas area":"PRODUÇÃO INJEÇÃO","cargo":"ESPECIALISTA EM  INJECAO","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":254,"empresa":"WAP","gestor":"HEAD DE CONTROLADORIA","area":"FP&A","cargo":"ESPECIALISTA EM FP&A","cargoNovo":"ESPECIALISTA EM FP&A","cbo":"252545","sumaria":"Atuar como referência técnica em FP&A, liderando metodologias, modelos financeiros, análises complexas, cenários, projeções e recomendações estratégicas para suporte à tomada de decisão. Responsável por aprofundar análises de performance, rentabilidade, orçamento, forecast e drivers de negócio, garantindo consistência técnica, governança das premissas e evolução da maturidade analítica da área. FP&A se caracteriza por conectar dados financeiros ao negócio, apoiando decisões com análises, projeções, cenários e visão preditiva, diferindo da controladoria tradicional por olhar mais fortemente para o futuro e para a performance esperada.","atividades":"Atuar como referência técnica em planejamento financeiro, análise de performance, forecast, orçamento e modelagem financeira.\nDesenvolver e aprimorar modelos financeiros para orçamento, forecast, cenários, business cases, análise de sensibilidade e tomada de decisão.\nDefinir e revisar metodologias, premissas, critérios e ritos de FP&A, garantindo padronização e governança das informações.\nAnalisar drivers de receita, custos, despesas, margem, EBITDA, caixa, capital de giro, rentabilidade e eficiência operacional.\nConduzir estudos de viabilidade financeira, produtividade, pricing, investimentos, expansão, redução de custos e alocação de recursos.\nApoiar a alta gestão com análises executivas, storytelling financeiro, riscos, oportunidades e recomendações orientadas a resultado.\nDesafiar premissas das áreas de negócio, promovendo disciplina financeira, visão crítica e consistência nas projeções.\nGarantir a consistência de bases, indicadores, dashboards e relatórios estratégicos de FP&A.\nIdentificar oportunidades de automação, padronização, integração de dados e melhoria dos processos analíticos.\nOrientar tecnicamente analistas e áreas parceiras quanto a modelos, premissas, metodologia e interpretação dos resultados.\nApoiar decisões estratégicas relacionadas a orçamento, forecast, rentabilidade, priorização de iniciativas e performance financeira.\nAtuar em projetos corporativos que demandem visão financeira avançada, análise multidisciplinar e integração com múltiplas áreas.","formacao":"Superior completo em Administração, Ciências Contábeis, Economia, Engenharia, Finanças, Estatística, Matemática, Ciência de Dados ou áreas correlatas.\nDesejável pós-graduação, MBA ou certificações em Finanças Corporativas, FP&A, Controladoria, Business Analytics, Estratégia, Valuation, Gestão Empresarial ou áreas correlatas.","experiencia":"7 anos","conhecimentos":"Domínio avançado de FP&A, orçamento, forecast, modelagem financeira e análise de cenários.\nConhecimento robusto de DRE gerencial, EBITDA, margem, caixa, capital de giro, custos e rentabilidade.\nExperiência com business cases, viabilidade financeira, análise de investimentos e performance.\nDomínio de ERP, plataformas de BI, bases de dados, automações e modelagem analítica.\nCapacidade de estruturar recomendações executivas e traduzir números em decisões de negócio.\nConhecimento de governança de premissas, indicadores financeiros e ritos de performance.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Marcio Milleo","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Marcio Milleo","atual":"Atual"},{"row":255,"empresa":"WAP","gestor":"SUPERVISOR DE PROJETOS JR","area":"BPM & PMO","cargo":"ESPECIALISTA EM PROJ INDUST","cargoNovo":"ESPECIALISTA EM PROJ INDUST","cbo":"142605","sumaria":"Atua como referência técnica em projetos industriais de média e alta complexidade, sendo responsável pelo planejamento, acompanhamento e suporte especializado à execução de iniciativas relacionadas à implantação, ampliação, modernização ou melhoria de processos e ativos industriais. Contribui diretamente para a tomada de decisão técnica, mitigação de riscos, padronização e otimização dos projetos, assegurando conformidade com requisitos técnicos, operacionais, de segurança, qualidade e custo.","atividades":"Atuar como especialista técnico em projetos industriais, apoiando desde a fase de concepção até a implantação.\nElaborar e validar escopos técnicos, cronogramas, estimativas de custo e análises de viabilidade.\nApoiar o planejamento e controle de projetos industriais, garantindo aderência a prazos, orçamento e requisitos técnicos.\nAvaliar riscos técnicos, operacionais e de segurança, propondo soluções e planos de mitigação.\nAtuar junto a fornecedores, integradores, engenharia, manutenção e operação na definição de soluções técnicas.\nGarantir conformidade com normas técnicas, regulatórias, ambientais e de segurança do trabalho.\nApoiar testes, comissionamento, start-up e transferência dos projetos para a operação.\nProduzir e validar documentação técnica, relatórios e pareceres especializados.\nContribuir para a padronização de soluções, lições aprendidas e boas práticas em projetos industriais.\nAtuar como ponto focal técnico junto ao PMO, fornecendo informações qualificadas para governança e tomada de decisão.","formacao":"Ensino superior completo em Engenharia de Produção, Mecânica, Elétrica, Mecatrônica, Química ou áreas correlatas.\nDesejável pós-graduação ou especialização em Gestão de Projetos, Engenharia Industrial ou áreas afins.","experiencia":"7 anos","conhecimentos":"Gestão e execução de projetos industriais.\nProcessos produtivos, layout industrial e engenharia de processos.\nPlanejamento, custos, riscos e controle de projetos.\nNormas técnicas, segurança industrial e compliance regulatório.\nInterface com fornecedores, contratos e engenharia externa.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Diego Mafioletti","dataHist":"2026-05-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Diego Mafioletti","atual":"Atual"},{"row":256,"empresa":"WAP","gestor":"GERENTE DE INFRAESTRUTURA E TI","area":"TI","cargo":"ESPECIALISTA EM SEG DA INFORM","cargoNovo":"ESPECIALISTA EM SEG DA INFORM","cbo":"212320","sumaria":"Atuar como referência técnica em Segurança da Informação, garantindo a proteção dos ativos, sistemas, dados, usuários e ambientes tecnológicos da organização. Responsável por estruturar, implementar, monitorar e aprimorar controles de segurança, gestão de riscos, resposta a incidentes, políticas, normas, conscientização, vulnerabilidades, acessos e conformidade, assegurando confidencialidade, integridade e disponibilidade das informações e apoiando a continuidade dos negócios.","atividades":"Definir, implementar e monitorar controles, políticas, normas e procedimentos de Segurança da Informação.\nMapear riscos de segurança, vulnerabilidades, ameaças, exposições e fragilidades em ambientes tecnológicos.\nApoiar ou conduzir processos de gestão de acessos, perfis, autenticação, privilégios e segregação de funções.\nMonitorar eventos, alertas, incidentes e indicadores de segurança, atuando na análise, contenção, correção e prevenção.\nConduzir análises de vulnerabilidade, hardening, revisão de configurações, testes, evidências e planos de remediação.\nApoiar auditorias internas e externas, levantando evidências, acompanhando planos de ação e garantindo conformidade.\nParticipar da definição de requisitos de segurança para projetos, sistemas, infraestrutura, cloud, integrações e fornecedores.\nAtuar em conjunto com Infraestrutura, Sistemas, Governança de TI, Desenvolvimento, Jurídico, RH e áreas de negócio.\nElaborar relatórios técnicos e executivos sobre riscos, incidentes, maturidade, controles, indicadores e recomendações.\nPromover ações de conscientização, treinamentos e comunicação sobre boas práticas de segurança da informação.\nPesquisar novas tecnologias, ameaças, frameworks e soluções para aprimorar a postura de segurança da organização.\nApoiar a gestão de continuidade, resposta a incidentes, recuperação, backup, proteção de dados e privacidade.","formacao":"Superior completo em Segurança da Informação, Tecnologia da Informação, Sistemas de Informação, Ciência da Computação, Engenharia da Computação, Redes de Computadores ou áreas correlatas.\nDesejável pós-graduação ou especialização em Segurança da Informação, Cibersegurança, Governança de TI, Riscos, Compliance, Privacidade, Redes ou Cloud Security.","experiencia":"5 anos","conhecimentos":"Gestão de riscos, controles, políticas e frameworks de Segurança da Informação.\nConhecimento em gestão de acessos, autenticação, privilégios, hardening e vulnerabilidades.\nExperiência com monitoramento de eventos, incidentes, logs, SIEM, endpoint, firewall, cloud e redes.\nNoções sólidas de LGPD, privacidade, auditoria, continuidade, backup e resposta a incidentes.\nCapacidade de elaborar relatórios, recomendações técnicas, indicadores e planos de ação.\nConhecimento em boas práticas como ISO 27001, NIST, CIS Controls, ITIL, COBIT e segurança em cloud.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Loeyderson Meira","dataHist":"2026-05-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Loeyderson Meira","atual":"Atual"},{"row":257,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ESPECIALISTA REM E BEN ESTRAT","cargoNovo":"ESPECIALISTA DE R&B","cbo":"252405","sumaria":"Responsável por desenhar, revisar e sustentar a estratégia de remuneração e benefícios da empresa, atuando como referência técnica máxima de Total Rewards. Lidera estudos de competitividade, estrutura de cargos e salários, programas de remuneração variável e arquitetura de benefícios, dando suporte técnico às decisões da liderança e garantindo equilíbrio entre competitividade, equidade interna e sustentabilidade de custos","atividades":"Definir, revisar e atualizar as políticas de remuneração fixa, variável e benefícios, em alinhamento com a estratégia do negócio e com as diretrizes de People.\nLiderar estudos de competitividade salarial e de benefícios, coordenando pesquisas de mercado, realizando pareamento de cargos, analisando percentis (P25/P50/P75) e recomendando ajustes de estruturas salariais e pacote de benefícios.\nDesenhar e revisar a arquitetura de cargos e salários (famílias, níveis, faixas, critérios de progressão), garantindo aderência ao modelo de carreira e coerência entre cargos.\nConduzir análises complexas de movimentações internas, avaliando impactos em folha, budget, compressão salarial e riscos de inversão hierárquica.\nModelar programas de remuneração variável e incentivos de longo prazo, definindo regras, critérios de cálculo, simulações e impactos financeiros.\nRedesenhar e otimizar o pacote de benefícios, analisando custo/benefício, benchmarking de mercado e percepção interna, liderando projetos como benefícios flexíveis, revisão de planos de saúde, novos benefícios de bem‑estar, entre outros.\nConduzir análises avançadas de budget de pessoal (salários, encargos, benefícios), construindo cenários e simuladores para suportar decisões de headcount, revisões salariais e mudanças de políticas.\nAtuar como consultor técnico de Remuneração & Benefícios para Business Partners, RH e liderança, suportando decisões críticas de contratação, retenção, planos de sucessão e ajustes individuais.\nParticipar e apoiar comitês de pessoas e remuneração, preparando materiais técnicos, cenários, recomendações e garantindo registro das decisões em linha com as políticas vigentes.\nRelacionar-se com consultorias de remuneração e fornecedores estratégicos de benefícios, liderando processos de RFP, avaliação de propostas e negociações de reajustes, indicadores de sinistralidade e qualidade de serviço.\nMentorar Analistas Jr/Pl/Sr de Remuneração & Benefícios, compartilhando conhecimento técnico, boas práticas e garantindo consistência metodológica na equipe","formacao":"Ensino superior completo em Administração, Economia, Contabilidade, Engenharia, Estatística, Gestão de RH ou áreas correlatas.\nDesejável: Pós-graduação em Remuneração, Finanças, Controladoria, Estatística, Gestão de Pessoas ou áreas relacionadas","experiencia":"5 anos","conhecimentos":"Metodologias avançadas de Remuneração.\nAdministração estratégica de benefícios.\nPeople Analytics aplicado a Total Rewards, com domínio de Excel avançado e bom nível em Power BI ou ferramentas similares.\nLegislação trabalhista e práticas de mercado em remuneração, benefícios, incentivos e relações trabalhistas, incluindo impactos em folha e encargos.\nConhecimento de sistemas de RH / folha e seus módulos de cargos, salários e benefícios, com capacidade de especificar melhorias e integrações.\n","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-01-29","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-01-29","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":258,"empresa":"WAP","gestor":"GERENTE INOVACAO E DEV DE SOFTWARE","area":"TI","cargo":"ESPECIALISTA SOLUCOES DIGITAIS","cargoNovo":"ESPECIALISTA SOLUCOES DIGITAIS","cbo":"212410","sumaria":"Atua como referência técnica na concepção e evolução de soluções digitais, conectando necessidades do negócio ao desenho de solução com foco em viabilidade, qualidade e sustentabilidade. Define abordagens de integração, padrões de solução e requisitos não funcionais, reduzindo risco técnico e retrabalho ao antecipar dependências e impactos. Trabalha em conjunto com produto, desenvolvimento, qualidade e áreas usuárias para alinhar requisitos, critérios de sucesso e estratégia de entrega. Apoia estabilização pós entrega e propõe melhorias estruturais para reduzir incidentes e aumentar confiabilidade. Orienta o time em tópicos complexos e eleva a consistência técnica das entregas.","atividades":"Diagnosticar necessidades do negócio e traduzir em abordagem de solução, considerando valor, restrições e riscos.\nAvaliar alternativas técnicas e propor desenho de solução, incluindo integração e fluxo de dados entre componentes.\nDefinir requisitos não funcionais relevantes, garantindo alinhamento entre expectativa do negócio e capacidade técnica.\nApoiar o Product Owner na estruturação de escopo e critérios de sucesso, sustentando decisões e trade offs.\nDirecionar padrões de solução e de engenharia, garantindo consistência entre componentes e evolução controlada.\nApoiar refinamento do backlog com visão técnica, explicitando dependências, riscos, premissas e condições de aceite técnico.\nContribuir para estratégia de validação e qualidade, garantindo cenários críticos e prevenção de falhas recorrentes.\nApoiar planejamento de releases, definindo estratégia de transição, compatibilidade e mitigação de impactos.\nAcompanhar comportamento em produção, analisar recorrência e propor correções estruturais e redução de dívida técnica.\nGarantir documentação técnica essencial, mantendo rastreabilidade entre decisão, requisito, entrega e evidências.\nOrientar o time em temas complexos, promovendo padronização e boas práticas de solução.","formacao":"Ensino superior completo em Tecnologia da Informação, Engenharia, Sistemas de Informação ou áreas correlatas.","experiencia":"5 anos","conhecimentos":"Arquitetura de solução e integrações; requisitos não funcionais e risco técnico; modelagem e consistência de dados; práticas de qualidade e governança técnica; diagnóstico de incidentes e análise de causa raiz; documentação técnica e rastreabilidade; comunicação técnica para públicos não técnicos.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Especialista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Mayra Santos","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Mayra Santos","atual":"Atual"},{"row":259,"empresa":"WAP","gestor":"COORDENADOR DE INVENTARIO","area":"INVENTARIO","cargo":"ESTOQUISTA","cargoNovo":"ESTOQUISTA","cbo": ade marketing e inteligência de mercado, assegurando alinhamento entre os objetivos comerciais, financeiros e de crescimento da companhia.","atividades":"Elabora o planejamento estratégico de marketing de médio e longo prazo, define objetivos de marca, metas de participação de mercado e prioridades de investimento, a partir da análise de cenário competitivo e do desempenho histórico das categorias.\nTraduz a estratégia em plano tático anual e no orçamento da área, acompanha a execução orçamentária junto à área financeira, identifica desvios entre orçado e realizado e redireciona verba entre iniciativas conforme o retorno observado.\nAprova diretrizes de posicionamento e identidade de marca, supervisiona o desenvolvimento de campanhas publicitárias e promocionais desde o briefing até a aprovação final, e gerencia o relacionamento comercial com agências, produtoras e veículos de mídia.\nCoordena as equipes de marketing de produto, marketing digital e trade marketing, orientando estratégias de lançamento e reposicionamento de portfólio, geração de demanda em canais digitais e execução em ponto de venda, com acompanhamento de indicadores de cada frente.\nCoordena pesquisas de mercado e monitoramento da concorrência junto a institutos externos, traduzindo os resultados em recomendações para a Diretoria e para as demais áreas de marketing.\nArticula-se com Comercial e Operações na definição de previsões de demanda e cronogramas de lançamento, com Recursos Humanos em ações de employer branding e comunicação interna, e com a área Jurídica na validação de contratos, uso de imagem e conformidade de campanhas com a legislação de proteção de dados e o código de defesa do consumidor.\nRepresenta a empresa perante imprensa, associações setoriais e eventos institucionais, definindo com a Diretoria o posicionamento público da companhia.\nDefine a estrutura da área de marketing, atribuições e metas de gerentes, coordenadores e analistas, conduz recrutamento de posições de liderança a":"Garantir a governança, eficiência e alinhamento estratégico dos projetos e processos da empresa, impulsionando a inovação e a entrega de valor.","atividades":"Definir metodologias, padrões e melhores práticas para gestão de projetos e processos alinhados à estratégia da empresa;\nPriorizar, monitorar e garantir a execução eficiente dos projetos estratégicos;\nMapear, modelar e aprimorar processos para aumentar a eficiência operacional;\nDefinir e acompanhar KPIs para medir a performance de projetos e processos;\nDesenvolver a equipe e fomentar uma cultura de inovação e melhoria contínua;\nImplementar soluções de automação (RPA, BPM, AI) para otimizar operações;\nFacilitar a colaboração entre áreas para garantir alinhamento e execução eficaz;\nAssegurar conformidade com regulamentações e minimizar riscos operacionais;\nMapear e modelar processos;\nAcompanhar a execução dos processos e garantir conformidade;\nColaborar com a equipe para otimizar atividades operacionais;\nManter os controles atualizados sobre as atividades que executa, tendo sempre visão apurada dos pontos críticos, atuando para que as medidas sejam tomadas com antecedência;\nApoiar nas atividades relacionadas ao setor e nas quais interage na falta ou ausência de colaborador entre as etapas dos processos, desde que habilitado para atividade ou sob orientação do superior imediato, buscando manter o equilíbrio entre a demanda e entrega a ser realizada;\nCuidar da ordem, equipamentos e ferramentas de trabalho em sua área de atuação, informando o superior imediato para serviços de manutenção, instalações de software ou recursos quando necessário bem como observar e garantir o tratamento de dados e acessos conforme diretriz, norma ou política interna da segurança da informação;","formacao":"Ensino superior completo, desejável pós-graduação em áreas correlatas ao campo de atuação","experiencia":"12 anos","conhecimentos":"Gestão de Portfólio de Projetos e PMO estratégico.\nModelagem, análise e melhoria de processos (BPM / BPMN).\nGovernança corporativa, indicadores de desempenho e gestão por métricas.\nTransformação organizacional e gestão da mudança.\nAutomação de processos, analytics e uso de tecnologias digitais aplicadas à eficiência operacional.","softskills":"Liderança Estratégica – Inspira e direciona áreas para objetivos corporativos.\nGestão de Stakeholders – Relaciona-se com alta liderança e parceiros.\nDecisão Complexa – Baseada em dados e riscos.\nInovação e Transformação – Promove cultura de melhoria contínua.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Head","dataRevisao":"2026-02-03","elaborador":"João Pedro","aprovador":"Paulo Sanford","dataHist":"2026-02-03","versao":"0","descRev":"Emissão Inicial","revisor":"João Pedro","aprovadorHist":"Paulo Sanford","atual":"Histórico"},{"row":291,"empresa":"WAP","gestor":"CEO","area":"BPM & PMO","cargo":"HEAD DE PMO&BPM","cargoNovo":"HEAD DE PMO&BPM","cbo":"141205","sumaria":"Responsável por liderar estrategicamente a governança corporativa de Projetos (PMO) e Processos (BPM), assegurando alinhamento com a estratégia do negócio, eficiência operacional, priorização do portfólio estratégico e geração sustentável de valor. Atua como agente de transformação organizacional, promovendo cultura de melhoria contínua, inovação, automação e tomada de decisão orientada por dados.","atividades":"Definir e manter o modelo corporativo de governança de projetos e processos, incluindo metodologias, frameworks, padrões e rituais de gestão.\nLiderar o portfólio estratégico de projetos, garantindo priorização, alocação eficiente de recursos, monitoramento de riscos e entrega de benefícios.\nEstruturar e supervisionar iniciativas de BPM, assegurando mapeamento, padronização, otimização e integração dos processos organizacionais.\nEstabelecer, acompanhar e reportar indicadores de desempenho (KPIs/OKRs) de projetos, processos e eficiência operacional.\nAtuar como principal interface entre áreas de negócio, tecnologia e l tiva de Tecnologia da Informação, garantindo alinhamento com os objetivos do negócio, sustentabilidade financeira e evolução contínua de capacidades digitais. Conecta as frentes de infraestrutura e serviços, desenvolvimento e inovação, e dados e inteligência artificial, garantindo governança, priorização e entrega integrada de valor. Direciona arquitetura, padrões e políticas, assegurando disponibilidade, segurança, conformidade e resiliência operacional. Atua como principal interlocutor de tecnologia com a liderança executiva, mediando prioridades, riscos, investimentos e resultados. Lidera o time gerencial e define metas e indicadores para garantir previsibilidade de entrega e qualidade dos serviços.","atividades":"Definir e sustentar a estratégia de TI alinhada ao planejamento do negócio, traduzindo diretrizes em prioridades, roadmaps e metas corporativas.\nLiderar a governança do portfólio de tecnologia, garantindo priorização por valor, risco, dependências e capacidade de execução. \nGarantir integração entre frentes de infraestrutura, desenvolvimento de software e dados, promovendo padrões comuns de entrega, qualidade e transição para sustentação.\nDefinir arquitetura de referência e padrões corporativos de tecnologia, assegurando consistência, escalabilidade e evolução controlada.\nAssegurar governança e conformidade de tecnologia, incluindo segurança da informação aplicada, privacidade e requisitos regulatórios pertinentes ao negócio.\nPatrocinar a agenda de inovação e modernização tecnológica, garantindo que iniciativas digitais gerem valor mensurável e sejam adotadas pelas áreas usuárias.\nGarantir continuidade e resiliência operacional de TI, assegurando disponibilidade de serviços críticos, gestão de incidentes relevantes e resposta estruturada a falhas recorrentes.\nDirecionar a governança de dados e inteligência artificial, assegurando qualidade, ownership, ética e escalabilidade de iniciativas em dados.\nGerir orçamento e investimentos de TI, definind  controles de pedidos, assegurando aderência ao que foi solicitado.\nAcompanhar e resolver ocorrências relacionadas ao cartão de ponto da equipe, garantindo a regularidade dos registros.\nAuxiliar na organização das carteiras de produtos e peças, contribuindo para eficiência no processo de faturamento.\nPrestar suporte à equipe, buscando aprimorar processos e garantir qualidade no atendimento ao cliente.\nAtuar operacionalmente no monitoramento e gerenciamento de carteiras estratégicas.\nAuxiliar, gerenciar e supervisionar processos administrativos, como controle de pedidos, acompanhamento do faturamento e melhorias no processo.","formacao":"Ensino superior completo em Administração, Gestão Comercial, Logística, Ciências Contábeis, Economia ou áreas afins. Desejável pós-graduação em áreas correlatas.","experiencia":"6 anos","conhecimentos":"Liderança de equipes administrativas e comerciais.\nExperiência em Backoffice Comercial e Administração de Vendas.\nConhecimento em controle de pedidos, faturamento, estoque e carteiras comerciais.\nAnálise de dados, relatórios e indicadores comerciais/operacionais.\nConhecimento em ERP, planilhas, sistemas de ponto e plataformas de BI.\nGestão de processos administrativos e melhoria contínua.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"sim","nivel":"Líder","dataRevisao":"2026-01-01","elaborador":"Rafael Veiber","aprovador":"Karine Fonseca","dataHist":"2026-01-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Karine Fonseca","atual":"Atual"},{"row":300,"empresa":"WAP","gestor":"GERENTE ADM DE VENDAS E DEMANDA","area":"ADM DE VENDAS","cargo":"LIDER ADM DE VENDAS SR","cargoNovo":"LIDER ADM DE VENDAS","cbo":"354140","sumaria":"Liderar as rotinas operacionais e administrativas da área de Administração de Vendas, orientando a equipe, acompanhando pedidos, faturamento, estoque, carteiras comerciais, ocorrências operacionais, indicadores e prioridades de atendimento. Atua como referência no fluxo diário do Backoffice Comercial, garantindo a execução correta dos processos, a qualidade das informações, o suporte aos representantes e gestores comerciais, a solução de pendências e a melhoria contínua das rotinas administrativas comerciais.","atividades":"Liderar e orientar a equipe de Administração de Vendas nas rotinas diárias, distribuindo prioridades, acompanhando entregas e apoiando a resolução de dúvidas operacionais.\nAcompanhar pedidos, carteiras comerciais, faturamento, pendências e prioridades de atendimento, garantindo fluidez no ciclo pedido–faturamento–entrega.\nMonitorar a situação de estoque e apoiar a definição de prioridades de atendimento em conjunto com as áreas envolvidas.\nAcompanhar vendas, negociações e processos comerciais em andamento, assegurando aderência aos fluxos, políticas e prazos definidos.\nApoiar representantes comerciais, gestores comerciais e equipe interna na tratativa de dúvidas, inconsistências e necessidades administrativas.\nConferir controles de pedidos, registros operacionais, informações comerciais e dados necessários ao correto andamento dos processos.\nAcompanhar ocorrências de ponto, escala, registros ou informações administrativas da equipe, direcionando correções conforme procedimentos internos.\nMonitorar indicadores operacionais e comerciais da área, como pedidos pendentes, faturamento, nível de atendimento, carteira e cumprimento de metas.\nApoiar a organização das carteiras de produtos, peças e clientes, garantindo atualização e qualidade das informações disponíveis.\nAtuar no monitoramento de carteiras estratégicas, acompanhando prioridades, riscos, pendências e oportunidades de melhoria no atendimento.\nIdentificar gargalos, retrabalhos e inconsistências nos processos administrativos comerciais, propondo ajustes e melhorias.\nApoiar a liderança na consolidação de informações, relatórios e análises para tomada de decisão sobre processos, equipe, pedidos, faturamento e atendimento.","formacao":"Superior completo em Administração, Gestão Comercial, Logística, Ciências Contábeis, Economia ou áreas correlatas. Desejável pós-graduação em Gestão Comercial, Processos, Administração, Suprimentos, Finanças ou áreas afins.","experiencia":"5 anos","conhecimentos":"Liderança de equipes administrativas e comerciais.\nExperiência em Backoffice Comercial e Administração de Vendas.\nConhecimento em controle de pedidos, faturamento, estoque e carteiras comerciais.\nAnálise de dados, relatórios e indicadores comerciais/operacionais.\nConhecimento em ERP, planilhas, sistemas de ponto e plataformas de BI.\nGestão de processos administrativos e melhoria contínua.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"sim","nivel":"Líder","dataRevisao":"2025-01-01","elaborador":"João Pedro","aprovador":"Karine Fonseca","dataHist":"2025-01-01","versao":"0","descRev":"Emissão inicial","revisor":"João Pedro","aprovadorHist":"Karine Fonseca","atual":"Histórico"},{"row":301,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"LIDER DE ADMINISTRAÇÃO DE PESS SR","cargoNovo":"LIDER DE ADMINISTRAÇÃO DE PESSOAL","cbo":"410105","sumaria":"Responsável por liderar a operação de Administração de Pessoal com foco em Folha de Pagamento, garantindo processamento correto e pontual, conformidade trabalhista/previdenciária, governança de dados de colaboradores e excelência no atendimento a empregados e lideranças. Atua como referência técnica do tema, conduz melhorias de processo, controles e indicadores, e assegura interface eficiente com Contabilidade, Financeiro, Jurídico, TI e fornecedores.","atividades":"Planejar e conduzir de forma corporativa o ciclo mensal de folha (fechamento, conferências, aprovações e execução), garantindo prazos e acurácia.\nValidar eventos de folha de forma corporativa (proventos, descontos, adicionais, benefícios, variáveis, afastamentos), assegurando aderência às políticas internas e legislação.\nGerir rotinas de forma corporativa de admissão, férias, afastamentos e rescisões com impacto direto em folha (cálculos, prazos, documentação e orientações).\nAssegurar recolhimentos e obrigações acessórias relacionadas à folha, mantendo trilha de auditoria e evidências para inspeções e auditorias internas/externas.\nConferir e conciliar provisões e contabilizações de folha (interfaces com Contabilidade/Controladoria), apoiando fechamentos e análises de variação.\nAdministrar e monitorar dados mestres e cadastros no sistema de folha/HRIS (movimentações, centros de custo, jornadas, rubricas e parametrizações).\nLiderar atendimento e resolução de chamados de colaboradores e lideranças, com comunicação clara e SLA.\nAcompanhar e orientar a equipe em rotinas críticas, redistribuição de demanda em picos (processos trabalhistas, fechamento, reajustes anuais, 13º, variáveis).\nGerir fornecedores e parceiros (BPO de folha, ponto, benefícios, medicina ocupacional quando houver interface), controlando contratos, entregas e qualidade.\nProduzir e analisar indicadores (ex.: acurácia da folha, retrabalho, SLA de atendimento, custo de folha, absenteísmo/afastamentos quando aplicável), propondo melhorias.\nMapear riscos e implementar controles internos (segregação de funções, dupla checagem, trilhas de aprovação, checklists de fechamento).\nConduzir melhorias e automações (padronização de rubricas, integração ponto–folha, redução de tarefas manuais, melhoria de comunicação e FAQs).","formacao":"Superior completo em Administração, Ciências Contábeis, Gestão de RH, Economia ou áreas correlatas.\nDesejável pós-graduação/MBA em Gestão de Pessoas, Controladoria, Legislação Trabalhista/Previdenciária ou áreas afins.","experiencia":"5 anos","conhecimentos":"Vivência com sistemas de folha (DATASUL TOTVS) e gestão de rubricas/parametrizações. Legislação trabalhista e previdenciária aplicada à folha (jornada, adicionais, afastamentos, férias, rescisões, encargos e convenções/acordos). Domínio de processos ponta a ponta de folha e seus controles (conferências, conciliações, provisões).Excel intermediário/avançado (tabelas dinâmicas, conciliações, análises). Noções de contabilização/provisões e interface com Financeiro/Contábil. Capacidade de atuar com auditorias e evidências. Forte orientação a prazo, acurácia e atendimento.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-01-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-01-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":302,"empresa":"","gestor":"","area":"LOGISTICA","cargo":"LIDER DE ALMOXARIFADO","cargoNovo":"","cbo":"","sumaria":"","atividades":"Auxiliar na organização física do estoque.","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":303,"empresa":"WAP","gestor":"COORDENADOR DE POS VENDA","area":"ALMOX DE PÓS VENDAS","cargo":"LIDER DE ALMOXARIFADO JR","cargoNovo":"LIDER DE ALMOXARIFADO","cbo":"391115","sumaria":"Liderar e garantir a execu
