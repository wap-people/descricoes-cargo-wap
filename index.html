nados a prazos, custos, documentação, armazenagem, transporte ou desembaraço.\nApoiar a conferência de documentos internacionais, como faturas comerciais, listas de embalagem, certificados, conhecimentos de embarque e documentos aduaneiros.\nInteragir com Compras, Fiscal, Logística, Financeiro, Contabilidade e Suprimentos para garantir alinhamento das etapas do processo internacional.\nIdentificar gargalos, retrabalhos e oportunidades de melhoria nos fluxos de Comex, propondo ajustes operacionais e padronizações.\nApoiar o Supervisor de Comex na consolidação de informações, acompanhamento de custos, indicadores e análise de performance.\nGarantir rastreabilidade, organização, confidencialidade e segurança das informações e documentos relacionados às operações internacionais.","formacao":"Superior completo em Comércio Exterior, Relações Internacionais, Administração, Logística, Economia ou áreas correlatas.\nDesejável especialização ou cursos complementares em Comércio Exterior, Logística Internacional, Gestão Aduaneira, Supply Chain, Importação, Exportação ou Negócios Internacionais.","experiencia":"4 anos","conhecimentos":"Conhecimento sólido de importação, exportação, legislação de Comércio Exterior e regimes aduaneiros.\nDomínio de documentação internacional, desembaraço aduaneiro e logística internacional.\nExperiência com custos internacionais, fretes, armazenagem, prazos e indicadores operacionais.\nConhecimento em ERP, sistemas corporativos, plataformas de gestão documental e controles internos.\nCapacidade de orientar equipe, priorizar demandas, acompanhar riscos e resolver problemas operacionais.\nInterface com Fiscal, Financeiro, Compras, Logística, Contabilidade, Suprimentos e parceiros externos.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Bruno Camargo","dataHist":"2026-05-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Bruno Camargo","atual":"Atual"},{"row":307,"empresa":"WAP","gestor":"GERENTE DE CUSTOMER EXPERIENCE","area":"CUSTOMER EXPERIENCE","cargo":"LIDER DE CUSTOMER EXPERIENCE JR","cargoNovo":"LIDER DE CUSTOMER EXPERIENCE","cbo":"520105","sumaria":"Responsável por liderar, no dia a dia, a equipe de atendimento de Customer Experience nos canais de atendimento off-line, assegurando a correta execução dos procedimentos, o cumprimento das metas operacionais e o suporte imediato aos assistentes em dúvidas e situações críticas, contribuindo para uma experiência ágil e resolutiva para clientes e revendedores.","atividades":"Atuar como referência técnica e operacional para a equipe de atendimento, esclarecendo dúvidas de processos, políticas e sistemas durante o atendimento ao cliente.\nAssegurar conformidade da execução das políticas de atendimento e empresa, que envolva relacionamento com o cliente.\nDistribuir demandas, organizar as atividades de back office, garantindo cumprimento da cobertura definida pela Gerência de Customer Experience.\nAcompanhar a operação dos canais e-mail/fale conosco, revendas, mídias sociais, reclame aqui, canal colaborador, atendimento marktplaces,  sinalizando riscos ao SLA e atuando em ações imediatas para cumprir os prazos e indicadores definidos.\nRealizar atendimento recebidos dos executivos comerciais, por meio da gerência de Customer Experience.\nApoiar supervisão no acompanhamento de indicadores operacionais, quando necessário.\nApoiar ações de treinamento on the job, reciclagens rápidas e reforços de comunicação sobre mudanças de processos, produtos e ofertas.\nGarantir que os registros de atendimento sejam feitos de forma completa e correta nos sistemas (CRM, plataformas de atendimento), orientando a equipe em casos de dúvida.\nAtuar alinhado às orientações da gerência de Customer Experience, garantindo a aplicação dos padrões de atendimento e scripts estabelecidos.","formacao":"Ensino médio completo. Desejável curso superior em andamento em Administração, Marketing, Comunicação ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Vivência em atendimento ao cliente em canais off-line, telefônicos e digitais. Familiaridade com sistemas de atendimento em mídias sociais e plataformas de registros de reclamações externas. Capacidade de orientar colegas em tempo real, mantendo equilíbrio entre produtividade e qualidade no atendimento.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-03-01","elaborador":"Rafael Veiber","aprovador":"Marcos Oliveira","dataHist":"2026-03-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Marcos Oliveira","atual":"Atual"},{"row":308,"empresa":"WAP","gestor":"GERENTE DE PEOPLE","area":"FACILITIES","cargo":"LIDER DE FACILITIES JR","cargoNovo":"LIDER DE FACILITIES","cbo":"391145","sumaria":"Responsável por liderar a equipe de Facilities (limpeza, conservação, apoio predial, portaria, recepção, copa e/ou manutenção predial leve), garantindo a disponibilidade, conservação e bom funcionamento da infraestrutura física da empresa. Atua na organização da rotina operacional, no acompanhamento de terceiros e na interface com áreas usuárias, assegurando padrões de qualidade, segurança, custos e atendimento acordados.","atividades":"Liderar a equipe operacional de Facilities, distribuindo atividades, orientando prioridades, acompanhando execução e garantindo cumprimento de procedimentos e padrões definidos.\nAcompanhar a prestação de serviços de terceiros (limpeza, vigilância, manutenção, jardinagem, copa, recepção, etc.), monitorando presença, qualidade da entrega, uso de materiais e cumprimento de contratos.\nControlar a rotina de limpeza e conservação de áreas internas e externas, garantindo organização, higiene e conservação conforme checklists e frequência estabelecida.\nApoiar a gestão de manutenção predial leve, registrando demandas, acompanhando pequenos reparos (elétrica, hidráulica, pintura, mobiliário) e escalando necessidades mais complexas para manutenção especializada.\nMonitorar consumo e reposição de materiais de Facilities (materiais de limpeza, descartáveis, café/copa, insumos de uso cotidiano), controlando estoques e evitando rupturas e desperdícios.\nRealizar vistorias periódicas nas instalações, identificando riscos, necessidades de intervenção, pontos de melhoria e oportunidades de otimização de layout/uso dos espaços.\nAssegurar o cumprimento de normas internas de segurança, saúde e meio ambiente, orientando a equipe sobre EPIs, cuidados operacionais e condutas adequadas, em alinhamento com SST/Segurança do Trabalho.\nAtuar como ponto de contato de Facilities para as áreas usuárias, recebendo demandas, priorizando chamadas e garantindo retorno dentro dos prazos definidos (SLAs).\nApoiar o coordenador/gerente de Facilities em controles administrativos, como lançamento de horas, apontamento de frequência, acompanhamento de escalas/turnos, férias, e apoio a processos de admissão/desligamento da equipe de Facilities.\nSugerir melhorias em processos e rotinas de Facilities, visando aumento de produtividade, melhor uso de recursos, redução de custos e elevação da satisfação dos usuários internos.\nAcompanhar indicadores básicos da operação, reportando resultados e pontos de atenção ao gestor imediato.\nGarantir o bom uso e conservação de equipamentos de suporte (máquinas de limpeza, ferramentas, carrinhos, equipamentos de copa, etc.), orientando a equipe e acionando manutenção quando necessário.","formacao":"Curso técnico ou profissionalizante em áreas correlatas (Edificações, Manutenção, Logística, Administração, Hotelaria ou similares).","experiencia":"3 anos","conhecimentos":"Noções de rotinas de limpeza e conservação.\nNoções de manutenção predial leve, ao menos para identificação de problemas e correta abertura de chamados.\nConhecimento básico de normas de segurança, saúde e meio ambiente relacionadas à operação predial (uso de EPIs, produtos químicos, riscos em altura, etc.).\nNoções de gestão de terceiros e contratos (escopo de serviço, jornada, pontos de controle).","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Lider","dataRevisao":"2026-01-29","elaborador":"Rafael Veiber","aprovador":"Cicero Brandt","dataHist":"2026-01-29","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Cicero Brandt","atual":"Atual"},{"row":309,"empresa":"WAP","gestor":"SUPERVISOR DE INJECAO","area":"PRODUÇÃO INJEÇÃO","cargo":"LIDER DE INJECAO","cargoNovo":"LIDER DE INJECAO","cbo":"311410","sumaria":"Liderar as atividades operacionais do setor de injeção, garantindo o cumprimento dos planos de produção, padrões de qualidade, segurança e eficiência dos processos. Atuar como referência técnica e comportamental para a equipe, promovendo o desenvolvimento dos operadores e a melhoria contínua dos processos de moldagem.","atividades":"Distribuir e acompanhar as tarefas dos operadores de máquinas injetoras.","formacao":"Cursando técnico em Plásticos, administração, mecânica ou áreas correlatas","experiencia":"2 anos","conhecimentos":"Cursando técnico em Plásticos, administração, mecânica ou áreas correlatas","softskill ncias quando aplicável.\nPropor melhorias com base em dados, indicadores, feedbacks da operação e análise de causa raiz.","formacao":"Ensino superior completo ou em andamento em Administração, Engenharia de Produção, Gestão de Processos, Qualidade, Logística, Tecnologia, Economia ou áreas correlatas.","experiencia":"7 anos","conhecimentos":"Mapeamento e documentação de processos.\nIndicadores de desempenho e análise de dados operacionais.\nFerramentas de melhoria contínua, como PDCA, 5W2H, análise de causa raiz e fluxogramas.\nNoções de qualidade, padronização, controle de rotinas e gestão de não conformidades.\nExcel/planilhas, sistemas corporativos, dashboards ou ferramentas de gestão.\nComunicação com áreas internas e condução de reuniões operacionais.\nDesejável conhecimento em Lean, BPM, Six Sigma ou gestão de projetos.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"sim","nivel":"Líder","dataRevisao":"2026-04-01","elaborador":"Rafael Veiber","aprovador":"Diego Mafioletti","dataHist":"2026-04-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Diego Mafioletti","atual":"Atual"},{"row":316,"empresa":"WAP","gestor":"SUPERVISOR DE PRODUCAO","area":"PRODUÇÃO","cargo":"LIDER DE PRODUCAO JR","cargoNovo":"LIDER DE PRODUCAO","cbo":"821405","sumaria":"Liderar e organizar as atividades operacionais da linha de produção, garantindo o cumprimento dos planos de produção, padrões de qualidade, segurança e produtividade. Atuar como elo entre a equipe operacional e a supervisão, promovendo o desenvolvimento dos colaboradores e a melhoria contínua dos processos.","atividades":"Distribuir tarefas e acompanhar o desempenho da equipe de produção.","formacao":"Ensino médio completo. Desej e processos, indicadores e políticas de R&S, assegurando compliance com legislação trabalhista e boas práticas de mercado, além de apoiar gestores na definição de perfis e decisões de contratação.","atividades":"Planejar e liderar processos seletivos para diferentes níveis hierárquicos (operacionais, administrativos, especialistas e liderança), garantindo prazos e qualidade na contratação. \nDefinir estratégias de atração de candidatos (divulgação, hunting, parcerias com instituições de ensino, redes profissionais). \nConduzir entrevistas por competências e dinâmicas de grupo para posições-chave. \nGerenciar a equipe de recrutadores de forma corporativa, distribuindo demandas, acompanhando pipeline de vagas e monitorando performance individual e da área. \nElaborar relatórios gerenciais e monitorar indicadores de R&S (tempo de contratação, custo por vaga, taxa de assertividade, funil de contratação), propondo ações de melhoria contínua. \nGarantir compliance com CLT, CBO e políticas internas em todos os processos seletivos. \nApoiar áreas clientes na definição de perfil e requisitos das vagas, atuando como parceiro de negócio em temas de atração de talentos. \nParticipar e/ou liderar projetos de employer branding e diversidade, fortalecendo a marca empregadora no mercado. \nNegociar com fornecedores de tecnologia (ATS, job boards) e consultorias especializadas em R&S, avaliando custo-benefício e qualidade das entregas.","formacao":"Ensino superior completo em Psicologia, Administração, Gestão de Recursos Humanos ou áreas correlatas.\nDesejável pós-graduação em Gestão de Pessoas, Desenvolvimento Organizacional ou áreas afins.","experiencia":"5 anos","conhecimentos":"Técnicas de entrevista por competências e condução de dinâmicas de grupo; ferramentas de avaliação psicológica e comportamental (quando habilitado); conhecimento consistente de legislação trabalhista aplicada a R&S; domínio de indicadores e métricas de R&S (tempo, custo, qualidade de contratação); domínio de Pacote Office; desejável experiência com ações de employer branding e diversidade e inclusão","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-03-05","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-03-05","versao":"0","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":321,"empresa":"","gestor":"","area":"RECEBIMENTO FISCAL","cargo":"LIDER DE RECEBIMENTO FISCAL JR","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":322,"empresa":"WAP","gestor":"COORDENADOR DE PRODUCAO","area":"REOPERAÇÃO","cargo":"LIDER DE REOPERACAO JR","cargoNovo":"LIDER DE REOPERACAO","cbo":"821405","sumaria":"Liderar e organizar as atividades de reoperação de produtos não conformes, garantindo a execução dos processos conforme normas técnicas, com foco em qualidade, produtividade e redução de perdas. Atuar como referência técnica e comportamental para a equipe, promovendo melhoria contínua e alinhamento com os objetivos operacionais.","atividades":"Distribuir e acompanhar as tarefas da equipe de reoperação.\nGarantir o cumprimento dos procedimentos técnicos e normas de segurança.\nValidar registros de entrada e saída de materiais reprocessados.\nMonitorar indicadores de retrabalho e propor ações corretivas.\nIdentificar causas de não conformidades e liderar análises de causa raiz.\nApoiar na capacitação técnica dos assistentes e novos colaboradores.\nInteragir com áreas de Qualidade, Produção e Logística para alinhamento de processos.\nElaborar relatórios gerenciais e apresentar resultados à coordenação.\nReceber, classificar, armazenar e gerenciar mercadorias devolvidas.","formacao":"Superior completo em Administração, desejável curso técnico em Produção, Qualidade ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Ferramentas de ERP (DATASUL), WMS e Office intermediário","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Operacional","eGestor":"Sim","nivel":"Líder","dataRevisao":"2025-11-19","elaborador":"Rafael Veiber","aprovador":"Juliano Oliveira","dataHist":"2025-11-19","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Juliano Oliveira","atual":"Atual"},{"row":323,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"SEGURANÇA DO TRABALHO","cargo":"LIDER DE SEGURANCA NO TRABALHO","cargoNovo":"LIDER DE SEGURANCA NO TRABALHO","cbo":"351605","sumaria":"Responsável por liderar a rotina de Saúde e Segurança do Trabalho, coordenando Técnicos/auxiliares de SST, garantindo a implementação das políticas e procedimentos corporativos de segurança, o atendimento à legislação (NRs) e a redução de riscos e acidentes, atuando como principal referência de segurança em campo para lideranças operacionais.","atividades":"Liderar a execução das rotinas de Segurança do Trabalho na unidade, coordenando equipe de Técnicos/auxiliares, distribuindo atividades e priorizando demandas de campo conforme criticidade de risco.\nGarantir a implementação das políticas e programas de SST definidos, assegurando aderência às Normas Regulamentadoras (NRs) e demais requisitos legais aplicáveis.\nRealizar e/ou coordenar inspeções de segurança, auditorias e rondas em campo, identificando condições e atos inseguros, propondo e acompanhando planos de ação corretivos e preventivos.\nConduzir e/ou apoiar investigações de acidentes e incidentes, liderando análise de causas, registro em sistema e definição de contramedidas junto às áreas envolvidas.\nAcompanhar a gestão de EPIs e EPCs nas unidades (especificação técnica, distribuição, uso correto, conservação, substituição), garantindo conformidade com normas internas e legislação. \nPlanejar e acompanhar treinamentos obrigatórios e campanhas de segurança (NRs, integrações, diálogos diários de segurança, SIPAT), atuando como instrutor em temas de sua competência.\nApoiar a elaboração, implementação e revisão de documentos técnicos de SST, como PPRA/PGR, PCMSO, APR/Permissões de Trabalho, procedimentos operacionais seguros, entre outros. \nMonitorar indicadores de SST da unidade (taxas de frequência e gravidade de acidentes, quase acidentes, desvios, treinamentos realizados), elaborando análises e relatórios para a liderança.\nAtuar como referência técnica de segurança para gestores de operação, apoiando na análise de riscos de novas atividades, mudanças de layout e introdução de novos equipamentos/produtos.\nParticipar de comitês internos de segurança (CIPA, DDS, reuniões de liderança), apresentando resultados, riscos críticos e status de planos de ação.\nGarantir a correta abertura, acompanhamento e fechamento de não conformidades de SST (auditorias internas/externas, fiscalizações).\nDesenvolver a equipe de SST sob sua liderança, dando feedbacks, orientando tecnicamente e promovendo a cultura de segurança como valor nas operações.","formacao":"Curso Técnico em Segurança do Trabalho concluído, registro no MTE.","experiencia":"4 anos","conhecimentos":"Legislação de Saúde e Segurança do Trabalho, com foco em NRs aplicáveis ao negócio.\nTécnicas de análise e gestão de riscos (APR, mapas de risco, investigação de acidentes, árvore de causas, etc.).]\nFerramentas de gestão e indicadores de SST, incluindo uso de Excel e sistemas corporativos para registro, controle e reporte de dados.\nConhecimento prático de processos operacionais da unidade (produção, manutenção, logística, etc.), para avaliação adequada dos riscos.","softskills":"Organização – Planeja e executa atividades de forma estruturada, garantindo cumprimento de prazos e padrões.\nComunicação Clara – Transmite informações técnicas de maneira objetiva e compreensível para diferentes públicos.\nProatividade – Antecipar problemas e propor soluções práticas para garantir segurança e conformidade.\nAtenção aos Detalhes – Observa minuciosamente processos e ambientes para identificar riscos e oportunidades de melhoria.","areaAtuacao":"Administrativo","eGestor":"sim","nivel":"Líder","dataRevisao":"2026-01-29","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-01-29","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":324,"empresa":"WAP","gestor":"SUPERVISOR DE DHO","area":"PEOPLE","cargo":"LIDER DE T&D","cargoNovo":"LIDER DE T&D","cbo":"252405","sumaria":"Responsável por liderar a execução e a governança das ações de Treinamento & Desenvolvimento, garantindo diagnóstico de necessidades, desenho de soluções de aprendizagem, planejamento e implementação do plano anual, gestão de fornecedores e indicadores de efetividade. Atua como ponto focal junto a gestores e áreas clientes para elevar performance, acelerar onboarding, sustentar competências críticas e fortalecer cultura de aprendizagem contínua.","atividades":"Conduzir diagnóstico de necessidades com áreas de negócio, identificando gaps técnicos e comportamentais e priorizando demandas por impacto.\nPlanejar e gerir o plano anual de T&D, estruturando cronograma, públicos, trilhas e governança (incluindo calendário corporativo e ações mandatórias). \nDesenhar soluções de aprendizagem (presencial, online, híbrido) e orientar a produção/curadoria de conteúdos, garantindo aderência às competências e à cultura.\nLiderar a implementação de programas (onboarding, capacitação técnica, comportamental, liderança), assegurando logística, comunicação e adesão. [mercer.com]\nGerir fornecedores e parceiros (consultorias, instrutores, plataformas), incluindo contratação, SLA, qualidade de entrega e conformidade.\nAdministrar orçamento de T&D conforme diretrizes internas (controle de custo por ação, otimização e justificativas). \nGerir/operar ferramentas e plataforma de aprendizagem, garantindo trilhas, turmas, registros, evidências e relatórios de auditoria quando aplicável.\nDefinir e acompanhar indicadores (KPIs) de treinamento: adesão, conclusão, satisfação, aplicabilidade e resultados; propor melhorias contínuas com base em dados.\nAtuar como consultor interno para lideranças, apoiando desenho de ações e orientando rituais de desenvolvimento no dia a dia (ex.: coaching, mentoring, multiplicadores). \nLiderar time e rotina: distribuição de tarefas, orientação técnica, priorização, feedback e desenvolvimento do time de T&D. (alinhado a práticas de estrutura/arquitetura de cargos e governança).\nGarantir padronização e documentação de processos de T&D (políticas, instruções, registros), apoiando auditorias e compliance. \nPromover cultura de aprendizagem contínua, comunicando iniciativas, reconhecendo participação e conectando programas às metas do negócio.","formacao":"Superior completo em Psicologia, Administração, Pedagogia, Gestão de RH ou áreas correlatas.\nDesejável pós-graduação em Educação Corporativa / DHO / Gestão de Pessoas / Design Instrucional.","experiencia":"5 anos","conhecimentos":"Levantamento de necessidades, desenho de soluções e gestão de portfólio de aprendizagem.\nMetodologias de aprendizagem (presencial/online/híbrida) e curadoria/produção de conteúdo.\nGestão de indicadores de efetividade e melhoria contínua baseada em dados. \nGestão de fornecedores, contratos e orçamento de T&D.\nOperação/gestão de LMS e ferramentas de colaboração (M365, formulários, trilhas, relatórios).","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-03-05","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-03-05","versao":"0","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":325,"empresa":"","gestor":"","area":"FINANCEIRO","cargo":"LIDER FINANCEIRO JR","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":326,"empresa":"WAP","gestor":"SUPERVISOR DE GARANTIA TECNICA","area":"GARANTIA TECNICA","cargo":"LIDER TÉCNICO JR","cargoNovo":"LIDER GARANTIA TECNICO","cbo":"520110","sumaria":"Liderar os processos de garantia técnica e atendimento pós-venda, assegurando a correta análise de falhas, conformidade com políticas de garantia, suporte técnico às assistências autorizadas e satisfação do cliente. Atua como elo entre a área técnica, comercial e rede de serviços, garantindo agilidade, qualidade e segurança jurídica nas decisões de garantia.","atividades":"Liderar os atendimentos técnicos relacionados a produtos em garantia, incluindo análise de falhas, trocas e reparos.\nGerenciar o relacionamento com assistências técnicas e rede de autorizadas, garantindo capacitação, padronização e cumprimento de SLA.\nValidar solicitações de garantia conforme políticas internas e legislação vigente (ex: Código de Defesa do Consumidor).\nMonitorar indicadores de pós-venda (tempo de resposta, taxa de aprovação, índice de retrabalho, NPS técnico).\nApoiar auditorias internas e externas relacionadas a processos de garantia.\nInteragir com áreas de engenharia, qualidade, comercial e jurídico para resolução de casos críticos.\nParticipar da revisão de políticas de garantia e manuais técnicos.\nLiderar equipe técnica interna (analistas, técnicos de campo, suporte).\nAtuar na prevenção de falhas recorrentes e propor melhorias nos produtos com base em dados de pós-venda.","formacao":"Superior completo em Engenharia, Administração, Tecnologia ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Conhecimento em análise de falhas, processos de RMA, atendimento técnico e legislação de consumo.","softskills":"Liderança Situacional – Direciona equipe conforme contexto.\nTomada de Decisão – Decide com agilidade em situações operacionais.\nComunicação Assertiva – Dá feedback claro e construtivo.\nGestão de Conflitos – Resolve divergências de forma equilibrada.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Líder","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Rogerio Campaner","dataHist":"2026-06-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Rogerio Campaner","atual":"Atual"},{"row":327,"empresa":"","gestor":"","area":"EXPEDIÇÃO","cargo":"MOTORISTA PL","cargoNovo":"","cbo":"","sumaria":"","atividades":"Registrar divergências em sistema ou planilhas.","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":328,"empresa":"","gestor":"","area":"LOGISTICA","cargo":"MOTORISTA PL","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":329,"empresa":"","gestor":"","area":"EXPEDIÇÃO","cargo":"MOTORISTA SR","cargoNovo":"","cbo":"","sumaria":"","atividades":"Auxiliar na organização física do estoque.","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":330,"empresa":"WAP","gestor":"SUPERVISOR DE PRODUÇÃO / ALMOX DE PÓS VENDA / EXPEDIÇÃO","area":"PRODUÇÃO / ALMOX DE PÓS VENDA / EXPEDIÇÃO","cargo":"OPERADOR DE EMPILHADEIRA JR","cargoNovo":"OPERADOR DE EMPILHADEIRA JR","cbo":"782220","sumaria":"Responsável pela movimentação, transporte, carga e descarga de materiais, produtos e insumos dentro do ambiente industrial ou logístico, garantindo segurança, eficiência e conformidade com os procedimentos internos e normas regulamentadoras.","atividades":"Operar empilhadeira para movimentação de materiais dentro do ambiente fabril ou logístico;\nAuxiliar na carga e descarga de caminhões, garantindo a correta disposição dos produtos;\nArmazenar e organizar mercadorias em prateleiras, racks, pallets e em áreas específicas;\nRealizar a inspeção diária da empilhadeira, verificando nível de óleo, combustível, bateria e funcionamento geral realizando o check-list;\nCumprir normas de segurança e procedimentos internos;\nApoiar na separação e conferência de materiais;\nAtender as solicitações de movimentações de pallets a fim de evitar interrupções na produção e na logística;\nGarantir aplicação do 5S (Utilização, Organização, Limpeza, Padronização e Disciplina) no setor.\nEm situações específicas, auxiliar no preenchimento de formulários de controle de movimentação de estoque.","formacao":"Ensino Médio Completo. Curso de Operador de Empilhadeira (NR-11) válido","experiencia":"6 meses","conhecimentos":"Noções básicas de segurança no trabalho. Conhecimento básico sobre tipos de empilhadeiras (gás, elétrica, GLP). Noções básicas de organização de estoque.","softskills":"Organização – Planeja e executa atividades de forma estruturada, garantindo cumprimento de prazos e padrões.\nComunicação Clara – Transmite informações técnicas de maneira objetiva e compreensível para diferentes públicos.\nProatividade – Antecipar problemas e propor soluções práticas para garantir segurança e conformidade.\nAtenção aos Detalhes – Observa minuciosamente processos e ambientes para identificar riscos e oportunidades de melhoria.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Operador","dataRevisao":"2026-02-01","elaborador":"Rafael Veiber","aprovador":"Pablo Mello","dataHist":"2026-02-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Pablo Mello","atual":"Atual"},{"row":331,"empresa":"WAP","gestor":"SUPERVISOR DE PRODUÇÃO / ALMOX DE PÓS VENDA / EXPEDIÇÃO","area":"PRODUÇÃO / ALMOX DE PÓS VENDA / EXPEDIÇÃO","cargo":"OPERADOR DE EMPILHADEIRA PL","cargoNovo":"OPERADOR DE EMPILHADEIRA PL","cbo":"782220","sumaria":"Responsável pela operação plena e autônoma de empilhadeiras para movimentação, armazenagem, carga e descarga de materiais e produtos no ambiente industrial e logístico, atuando com autonomia na priorização de atividades, tratamento de não conformidades e garantia de fluidez entre produção, almoxarifado de pós-venda e expedição, assegurando segurança e conformidade com normas regulamentadoras.","atividades":"Operar empilhadeiras elétrica, GLP e/ou a gás conforme a frente de trabalho, definindo por conta própria a sequência e a prioridade das movimentações com base em urgência de produção, prazo de expedição e ocupação de docas, sem depender de direcionamento constante do supervisor;\nReorganizar a própria sequência de trabalho quando surgem demandas concorrentes, decidindo qual atender primeiro dentro dos critérios de criticidade estabelecidos;\nConduzir a carga e descarga de caminhões definindo a disposição e o sequenciamento dos produtos por peso, fragilidade e ordem de entrega/romaneio;\nConferir volumes, notas e etiquetas no recebimento e na expedição, identificando divergências entre físico e sistema antes de liberar a movimentação;\nSeparar e sinalizar cargas não conformes, registrando a ocorrência e decidindo o encaminhamento sem necessidade de escalonar toda não conformidade simples;\nArmazenar mercadorias em racks, pallets e endereços específicos aplicando otimização de espaço;\nRealizar contagens cíclicas de inventário, registrar no sistema de controle de estoque e investigar divergências antes de repassar ao Almoxarifado;\nApoiar o fechamento de inventário periódico, participando da reconciliação física x sistêmica;\nExecutar o check-list diário completo da empilhadeira, registrando formalmente e acionando manutenção preventiva ou corretiva conforme criticidade da falha identificada;\nInterromper a operação e sinalizar a liderança quando identificar risco iminente à segurança, sem aguardar autorização para essa decisão pontual;\nApoiar operacionalmente colegas Júnior na execução das rotinas do setor, orientando na prática, sem responsabilidade formal de treinamento/avaliação (atribuição do Sênior);\nGarantir e disseminar a aplicação do 5S  no setor, sinalizando desvios recorrentes;\nPreencher e validar formulários de controle de movimentação de estoque, sendo o responsável pela exatidão do registro antes de submeter ao sistema.","formacao":"Ensino Médio Completo. Curso de Operador de Empilhadeira (NR-11) válido","experiencia":"1 ano","conhecimentos":"Domínio de tipos de empilhadeira ;;\nLógica de armazenagem;\nUso básico de sistema de controle de estoque para apontamento de movimentações;\nIdentificação e tratamento de não conformidades;\nRotinas de inventário cíclico.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar c s e pessoais que impactam diretamente a disponibilidade, foco e efetividade do executivo. Exerce papel chave na integração de informações, no gerenciamento de prioridades e na coordenação de demandas sensíveis, com alto grau de autonomia, antecipação e confiabilidade, contribuindo para a eficiência da governança corporativa e para a sustentação da agenda executiva como um todo.","atividades":"Gerenciar de forma integral e estratégica a agenda da alta liderança, incluindo Presidência, Diretoria, Conselheiros e Sócios, conciliando compromissos profissionais, institucionais e outras demandas que impactem a disponibilidade do executivo.\nOrganizar e apoiar reuniões executivas e institucionais (Diretoria, Comitês e Conselho de Administração), com preparação de pautas, materiais, atas e acompanhamento de deliberações.\nAtuar como ponto focal entre a alta liderança, Conselho, Sócios e stakeholders internos e externos, assegurando comunicação clara, profissional e alinhada às diretrizes de governança.\nAdministrar viagens nacionais e internacionais da alta liderança, Conselheiros e Sócios, incluindo logística completa, documentação, reservas e gestão de imprevistos.\nGerenciar informações estratégicas, sensíveis e de caráter reservado, garantindo absoluto sigilo, ética e confiabilidade.\nApoiar a organização das rotinas, prioridades e demandas da Presidência e dos Sócios, antecipando necessidades, organizando compromissos paralelos e mitigando impactos na agenda executiva.Elaborar, revisar e organizar documentos executivos, apresentações institucionais e materiais de apoio à tomada de decisão.\nControlar demandas administrativas complexas, contratos, pagamentos, reembolsos e relatórios vinculados à alta liderança.\nAtuar com elevada autonomia na resolução de assuntos do dia a dia, representando a liderança em encaminhamentos preliminares e na condução de demandas delegadas.\nApoiar eventos corporativos, assembleias, visitas institucionais e compromissos de alto nível, garantindo organização, confidencialidade e excelência na execução.\nInteragir com diferentes áreas da organização e com interlocutores externos, assegurando alinhamento, discrição e cumprimento de prazos estratégicos.\nApoiar diretamente aos compromissos pessoais da Presidência e Sócios, incluindo desde assuntos médicos, financeiros e demais assuntos que sejam solicitados.","formacao":"Ensino Superior completo em Secretariado Executivo, Administração, Relações Internacionais, Letras ou áreas correlatas.","experiencia":"Experiência consolidada como Secretária Executiva ou Assistente Executivo(a), com atuação direta junto à alta liderança, diretoria, conselho ou sócios.","conhecimentos":"Gestão avançada de agenda executiva e institucional.\nExpertise na compra de passagens aéreas, hospedagens, gestão de viagens nacionais e internacionais e administração de custos, incluindo negociação com fornecedores, reembolsos e mitigação de imprevistos.\nOrganização administrativa de alta complexidade e governança corporativa.\nElaboração de apresentações executivas e materiais para Conselho.\nComunicação escrita e verbal em nível corporativo.\nDomínio de ferramentas de produtividade (Pacote Office e afins).\nInglês em nível intermediário ou avançado como diferencial, especialmente para interações institucionais, viagens e materiais internacionais.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-03-31","elaborador":"Rafael Veiber","aprovador":"Cicero Brandt","dataHist":"2026-03-31","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Cicero Brandt","atual":"Atual"},{"row":343,"empresa":"WAP","gestor":"GERENTE DE SUPRIMENTOS","area":"SUPRIMENTOS","cargo":"SUPERVISOR COMEX","cargoNovo":"SUPERVISOR COMEX","cbo":"410105","sumaria":"Supervisionar as operações de Comércio Exterior, assegurando a execução correta dos processos de importação e exportação, conformidade aduaneira, controle documental, logística internacional, gestão de prazos, custos e interface com parceiros externos e áreas internas. Atua na liderança operacional da equipe, no acompanhamento de desembaraços, embarques, entregas, regimes aduaneiros, adequações legais e melhoria contínua dos processos de Comex.","atividades":"Supervisionar as rotinas de importação e exportação, garantindo aderência à legislação vigente, políticas internas e procedimentos da área.\nAcompanhar processos aduaneiros, desembaraço de mercadorias, registros, licenças, documentos e tratativas com parceiros especializados.\nCoordenar a logística internacional, acompanhando embarques, prazos, custos, transporte internacional, armazenagem e entrega dos produtos.\nValidar e controlar documentos internacionais, como faturas comerciais, listas de embalagem, certificados de origem, conhecimentos de embarque e demais documentos aplicáveis.\nNegociar e acompanhar demandas com fornecedores internacionais, despachantes, agentes de carga, transportadores, seguradoras e demais parceiros externos.\nMonitorar custos das operações internacionais, identificando desvios, oportunidades de redução de custos e riscos operacionais.\nAtuar em interface com Compras, Fiscal, Logística, Financeiro, Contabilidade, Planejamento e áreas demandantes, garantindo fluidez nos processos.\nLiderar, orientar e desenvolver a equipe de Comércio Exterior, distribuindo atividades, acompanhando entregas e apoiando a solução de problemas.\nAcompanhar alterações em normas, regimes aduaneiros, exigências legais e procedimentos de comércio exterior, propondo adequações quando necessário.\nElaborar, revisar e acompanhar indicadores, relatórios e controles de performance das operações internacionais.\nIdentificar gargalos, retrabalhos e riscos nos processos de Comex, propondo melhorias, padronizações e automações.\nGarantir a organização, rastreabilidade e segurança das informações e documentos relacionados às operações de importação e exportação.","formacao":"Superior completo em Comércio Exterior, Relações Internacionais, Administração, Logística, Economia ou áreas correlatas.\nDesejável pós-graduação ou especialização em Comércio Exterior, Supply Chain, Logística Internacional, Gestão Aduaneira ou Negócios Internacionais.","experiencia":"5 anos","conhecimentos":"Legislação de Comércio Exterior, importação, exportação e regimes aduaneiros.\nDocumentação internacional, processos aduaneiros e desembaraço de mercadorias.\nLogística internacional, custos de importação/exportação, fretes e prazos.\nERP, sistemas corporativos, plataformas de gestão documental e controles operacionais.\nIndicadores de performance, análise de custos, gestão de prazos e melhoria de processos.\nInterface com Fiscal, Financeiro, Compras, Logística, fornecedores e parceiros externos.","softskills":"Gestão de Pessoas – Desenvolve equipe e delega responsabilidades.\nVisão Sistêmica – Compreende impacto das decisões no processo.\nInfluência Positiva – Engaja equipe para atingir metas.\nGestão de Conflitos Complexos – Media situações críticas.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Supervisor","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Alexandre Pinheiro","dataHist":"2026-05-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Alexandre Pinheiro","atual":"Atual"},{"row":344,"empresa":"WAP","gestor":"GERENTE DE SUPRIMENTOS","area":"SUPRIMENTOS","cargo":"SUPERVISOR COMEX","cargoNovo":"SUPERVISOR COMEX","cbo":"410105","sumaria":"Responsável por supervisionar as atividades de importação e exportação da empresa, garantindo o cumprimento de prazos, normas legais e procedimentos internos. Atua na gestão de processos aduaneiros, logística internacional, negociação com fornecedores e parceiros externos, além de coordenar a equipe e assegurar a documentação correta para as operações de comércio exterior.","atividades":"Supervisionar e orientar as atividades de importação e exportação, garantindo o cumprimento da legislação vigente.\nAcompanhar processos aduaneiros, desembaraço de mercadorias e controle de documentos. \nCoordenar a logística internacional, desde o embarque até a entrega dos produtos. \nNegociar com fornecedores, despachantes, agentes de carga e outros parceiros externos. \nGarantir o correto preenchimento e controle de documentos internacionais, como faturas comerciais, listas de embalagem e certificados de origem.\nMonitorar custos e prazos das operações internacionais.\nManter interface com áreas internas como Compras, Fiscal, Logística e Financeiro.\nLiderar e desenvolver a equipe de Comércio Exterior.\nAcompanhar mudanças nas normas de comércio exterior e implementar adequações quando necessário.","formacao":"Graduação completa em Comércio Exterior, Relações Internacionais, Administração ou áreas correlatas.","experiencia":"Não cadastrado","conhecimentos":"Legislação de comércio exterior em importação e exportação.\nRegimes aduaneiros.\nDocumentação internacional.\nPacote de produtividade e planilhas.\nConhecimento em sistema ERP específico citado no documento original.","softskills":"Gestão de Pessoas – Desenvolve equipe e delega responsabilidades.\nVisão Sistêmica – Compreende impacto das decisões no processo.\nInfluência Positiva – Engaja equipe para atingir metas.\nGestão de Conflitos Complexos – Media situações críticas.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Supervisor","dataRevisao":"2025-06-30","elaborador":"Fernanda Cestaro","aprovador":"Alexandre Pinheiro","dataHist":"2025-06-30","versao":"0","descRev":"Emissão Inicial","revisor":"Fernanda Cestaro","aprovadorHist":"Alexandre Pinheiro","atual":"Histórico"},{"row":345,"empresa":"WAP","gestor":"COORDENADOR DE CUSTOMER EXPERIENCE","area":"CUSTOMER EXPERIENCE","cargo":"SUPERVISOR CUSTOMER EXPERIENCE SR","cargoNovo":"SUPERVISOR CUSTOMER EXPERIENCE","cbo":"520110","sumaria":"Responsável por supervisionar as operações diárias da área de Customer Experience, garantindo a execução dos padrões de atendimento, o cumprimento dos indicadores de qualidade e produtividade, e o desenvolvimento da equipe de atendimento nos canais (telefonia, whatsapp), assegurando uma experiência consistente e alinhada às diretrizes definidas pela gerência de Customer Experience.","atividades":"Supervisionar a equipe de atendimento (atendentes e assistentes) nos canais de telefonia e whatsapp, garantindo aderência a scripts, políticas e padrões de qualidade definidos.\nMonitorar indicadores operacionais e de qualidade, identificando desvios e implementando ações corretivas de curto prazo.\nApoiar a gerência na implantação de novos processos, políticas e ferramentas de atendimento, garantindo a correta comunicação e aplicação junto ao time.\nRealizar interfaces com fornecedores reportando oportunidades e assegurando correções sustentáveis para a melhor experiência dos clientes.\nAcompanhar a jornada do cliente nos canais sob sua responsabilidade, sinalizando à gerência as recorrências, causas-raiz e oportunidades de melhoria.\nGarantir o registro adequado dos atendimentos nos sistemas (CRM, plataformas de atendimento, URA, bot, etc.), assegurando integridade e rastreabilidade das informações.\nAtuar como ponto de escalonamento operacional para casos críticos de clientes, buscando soluções rápidas e alinhadas às diretrizes de Customer Experience, conforme canais de sua responsabilidade.\nDistribuir tarefas, organizar escalas, pausas e plantões da equipe, garantindo cobertura adequada dos canais conforme demanda.\nContribuir com a gerência na definição de metas da área e na análise periódica de resultados, sugerindo melhorias em processos e rotinas.\nAuxiliar na identificação de necessidades de treinamento (técnico e comportamental) com base em avaliações de qualidade e desempenho da equipe.\nApoiar as atividades da Líder quando necessário.\nZelar pelo cumprimento de normas, políticas internas e regulatórias aplicáveis às operações de atendimento ao cliente.","formacao":"Superior completo ou em andamento em Administração, Marketing, Comunicação, Gestão de Serviços, ou áreas correlatas.","experiencia":"3 anos","conhecimentos":"Conhecimento em rotinas de atendimento ao cliente multicanal (telefone, chat, e-mail, redes sociais e canais digitais). Familiaridade com ferramentas de CRM, URA, chatbots e sistemas de ticket. Noções de Customer Experience, métricas de operação e indicadores de satisfação (NPS, CSAT). Capacidade de ler relatórios operacionais, identificar tendências e propor ajustes táticos na operação.","softskills":"Gestão de Pessoas – Desenvolve equipe e delega responsabilidades.\nVisão Sistêmica – Compreende impacto das decisões no processo.\nInfluência Positiva – Engaja equipe para atingir metas.\nGestão de Conflitos Complexos – Media situações críticas.","areaAtuacao":"Administrativo","eGestor":"Sim","nivel":"Supervisor","dataRevisao":"2026-03-01","elaborador":"Rafael Veiber","aprovador":"Marcos Oliveira","dataHist":"2026-03-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Marcos Oliveira","atual":"Atual"},{"row":346,"empresa":"WAP","gestor":"GERENTE DE SUPRIMENTOS","area":"SUPRIMENTOS","cargo":"SUPERVISOR DE COMPRAS","cargoNovo":"SUPERVISOR DE COMPRAS","cbo":"410105","sumaria":"Supervisionar os processos e a equipe de Compras, assegurando atendimento às demandas internas, conformidade com políticas e alçadas, negociação adequada com fornecedores, controle de prazos, custos, qualidade e desenvolvimento da base fornecedora. Atua na gestão da rotina, indicadores, prioridades, riscos de abastecimento e melhoria contínua dos processos de aquisição de materiais, produtos e serviços.","atividades":"Supervisionar a equipe de compras, distribuindo demandas, acompanhando entregas e orientando prioridades.\nGarantir o cumprimento das políticas, procedimentos, alçadas e fluxos de aprovação de compras.\nAcompanhar processos de cotação, negociação, pedidos, contratos e entregas.\nMonitorar indicadores de compras, saving, prazos, qualidade, atendimento e desempenho de fornecedores.\nApoiar negociações críticas, demandas estratégicas e resolução de conflitos com fornecedores.\nSupervisionar a base de fornecedores, homologação, avaliação de desempenho e desenvolvimento de alternativas.\nAtuar em interface com áreas solicitantes, Almoxarifado, Logística, Fiscal, Financeiro, Contabilidade e Suprimentos.\nAnalisar riscos de abastecimento, atrasos, divergências comerciais e impactos operacionais.\nElaborar relatórios gerenciais e apoiar a liderança em decisões sobre custos, fornecedores e prioridades.\nPropor melhorias em processos, controles, indicadores, automações e governança de compras.","formacao":"Superior completo em Administração, Logística, Economia, Engenharia, Ciências Contábeis, Gestão Comercial ou áreas correlatas. Desejável pós-graduação em Supply Chain, Compras, Gestão de Negócios, Finanças ou áreas correlatas.","experiencia":"6 anos","conhecimentos":"Conhecimento sólido em compras, suprimentos, negociação e gestão de fornecedores.\nDomínio de processos de cotação, pedidos, contratos, follow-up e indicadores.\nExperiência com saving, avaliação de fornecedores, riscos de abastecimento e prazos.\nConhecimento em ERP, BI, controles gerenciais e políticas de compras.\nCapacidade de liderar equipe, priorizar demandas e conduzir melhorias operacionais.","softskills":"Influência – Orienta decisões de área com base em conhecimento profundo.\nResolução de Problemas Complexos – Propõe soluções inovadoras.\nOrientação para Resultados – Foco em metas e qualidade.\nInovação – Busca melhorias contínuas nos processos.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Alexandre Pinheiro","dataHist":"2026-05-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Alexandre Pinheiro","atual":"Atual"},{"row":347,"empresa":"WAP","gestor":"GERENTE DE PEOPLE","area":"PEOPLE","cargo":"SUPERVISOR DE DHO","cargoNovo":"SUPERVISOR DE DHO","cbo":"252405","sumaria":"Responsável por supervisionar as atividades de Desenvolvimento Humano e Organizacional, garantindo a execução das políticas de gestão de pessoas, programas de treinamento, desenvolvimento de liderança, gestão de clima e cultura organizacional, atua como elo entre a estratégia de RH e a operação, assegurando alinhamento às diretrizes corporativas e às melhores práticas de mercado.","atividades":"Planejar, supervisionar e acompanhar programas de treinamento e desenvolvimento (T&D), incluindo levantamento de necessidades, cronogramas e avaliação de eficácia.\nSupervisionar processos de gestão de desempenho, incluindo definição de metas, feedback e planos de desenvolvimento individual.\nApoiar iniciativas de cultura organizacional, engajamento e clima, conduzindo pesquisas e planos de ação.\nGarantir a atualização e aplicação das políticas de DHO, alinhadas à legislação trabalhista e às diretrizes internas.\nGerir equipe de analistas, lideres, assistentes e demais subordinados diretos, promovendo desenvolvimento técnico e comportamental.\nElaborar relatórios gerenciais e indicadores de efetividade dos programas de DHO.\nAtuar como parceiro interno para líderes, orientando sobre práticas de gestão de pessoas.","formacao":"Ensino Superior completo em Psicologia, Administração, Gestão de Recursos Humanos ou áreas correlatas.\nDesejável Pós-graduação em Gestão de Pessoas, Desenvolvimento Organizacional ou áreas afins.","experiencia":"5 anos","conhecimentos":"Técnicas de avaliação de desempenho e gestão por competências.\nMetodologias de treinamento e desenvolvimento.\nFerramentas de pesquisa de clima e engajamento.\nIndicador {"row":368,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ANALISTA DE OPERACOES DE RH JR","cargoNovo":"ANALISTA DE OPERACOES DE RH JR","cbo":"410105","sumaria":"Executar, sob supervisão, as rotinas de administração de pessoal e benefícios das unidades atribuídas, apoiando o fechamento mensal, a apuração de ponto, a conferência de faturas, e desenvolvendo o domínio das regras de cálculo, da legislação e dos contratos de benefícios aplicáveis.","atividades":"Processar a folha de pagamento mensal e as movimentações de benefícios das unidades atribuídas, lançando eventos de proventos, descontos e benefícios e submetendo o resultado à conferência de um Analista mais experiente ou do Especialista antes do encerramento\nCalcular verbas trabalhistas de menor complexidade, como férias e adiantamentos, aplicando as regras da CLT e das Convenções Coletivas e encaminhando os casos atípicos ao nível superior\nApurar e integrar os dados de ponto eletrônico à folha, identificando divergências entre marcações e lançamentos e tratando-as com o time de Administração de Pessoal sob orientação\nApoiar a geração das obrigações acessórias mensais (eSocial, DCTFWeb, FGTS Digital), conferindo os dados de entrada e reportando inconsistências ao responsável pela transmissão\nConferir e validar o faturamento mensal das operadoras de benefícios (saúde, odontológico, seguro de vida em grupo, refeitórios e transporte), apurando divergências entre o cadastro ativo e o faturado e sinalizando pendências ao Analista responsável pela liberação\nApoiar a atualização do capital segurado do seguro de vida em grupo e a conferência do seu faturamento mensal, sinalizando divergências de valor ou de colaboradores segurados\nAcompanhar os dados de utilização e de sinistralidade dos planos de saúde e odontológico, organizando as bases que subsidiam as ações de mitigação de custo conduzidas pelos níveis superiores\nApoiar a operação dos programas de parcerias e descontos e a rotina de reembolsos, incluindo o cadastro de elegíveis e o acompanhamento das solicitações junto aos fornecedores\nApoiar os processos de rescisão, preparando documentos, agendando o exame demissional, encerrando os benefícios do colaborador e organizando as informações para o cálculo conduzido por um Analista mais experiente\nManter atualizados os controles de estabilidades e de vencimentos de contratos e de benefícios, monitorando prazos e reportando os pontos de atenção\nAtender colaboradores e gestores em dúvidas de rotina sobre cálculos, descontos, elegibilidade, cobertura e uso de benefícios, escalando ao nível superior as questões que envolvam interpretação de legislação ou de contrato\nApoiar a renovação de contratos de benefícios já vigentes, reunindo o histórico de utilização, sinistralidade e reajustes anteriores para embasar a análise dos níveis superiores\nOrganizar os documentos e as memórias de cálculo solicitados em auditorias trabalhistas, previdenciárias, fiscais e de benefícios, sob coordenação de um Analista mais experiente\nAlimentar as planilhas e as bases de dados de utilização e custo usadas na construção de relatórios e indicadores de folha e de benefícios em Excel e Power BI","formacao":"Superior cursando em Administração, Ciências Contábeis, Gestão de RH, Economia ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Conhecimento básico em rotinas de administração de pessoal. Noções de folha de pagamento, encargos trabalhistas e controle de ponto. Entendimento de benefícios e processos de admissão e desligamento. Familiaridade com legislação trabalhista em nível operacional. Uso de ferramentas de controle e organização de dados.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":369,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ANALISTA DE OPERACOES DE RH PL","cargoNovo":"ANALISTA DE OPERACOES DE RH PL","cbo":"410105","sumaria":"Conduzir com autonomia o fechamento completo da folha de pagamento e a administração de benefícios das unidades sob sua responsabilidade, respondendo pela conformidade legal e contratual, pela gestão dos programas de benefícios, pelo controle de sinistralidade e pela qualidade dos dados entregues às áreas de People, Finanças e Compliance.","atividades":"Conduzir de ponta a ponta o fechamento mensal da folha e a validação do faturamento de benefícios das unidades sob sua responsabilidade, abrangendo conferências finais, cálculo de encargos, envio ao banco, liberação de faturas e conciliação dos valores pagos com os previstos\nCalcular e validar rescisões, décimo terceiro salário e demais verbas de maior complexidade, garantindo aderência à CLT e às Convenções Coletivas de cada sindicato aplicável\nGerar e transmitir as obrigações acessórias mensais (eSocial, DCTFWeb, FGTS Digital e, quando aplicável, CAGED e RAIS), respondendo pela consistência das informações enviadas aos órgãos competentes\nConduzir o processo completo de rescisão, incluindo análise de estabilidades e movimentações, cálculo das verbas, encerramento dos benefícios, geração de guias e arquivos bancários e realização da homologação quando exigida\nRealizar o fechamento, a auditoria e o controle de assinaturas do ponto eletrônico e controlar os saldos e vencimentos do Banco de Horas, incluindo a assinatura dos termos de acordo pelos colaboradores\nResponder pela gestão dos programas de benefícios das unidades sob sua responsabilidade (saúde, odontológico, seguro de vida em grupo, alimentação, refeição, transporte, convênios e previdência), garantindo a correta concessão, o encerramento e a liberação do faturamento dentro do prazo\nGerenciar a operação do benefício de refeição e alimentação corporativa, incluindo a relação com os refeitórios terceirizados, a aprovação de cardápio e a proposição de melhorias no serviço prestado nas unidades\nAcompanhar os indicadores de utilização e de sinistralidade dos planos de saúde e odontológico, propondo ações de mitigação de custo e reportando os casos que demandem revisão contratual\nConduzir a operação de benefícios pontuais e institucionais, como o checkup médico anual da Diretoria e as premiações e brindes corporativos, coordenando cotação, agendamento e faturamento junto aos fornecedores\nDesenvolver e divulgar novas parcerias e descontos para os colaboradores e apoiar a renovação e a renegociação de contratos de benefícios vigentes, consolidando o histórico de sinistralidade e de reajustes para subsidiar a negociação conduzida pelo Coordenador de Operações de RH\nElaborar a DIRF e o Informe de Rendimentos das unidades sob sua responsabilidade e apurar estudos de incidências sobre a folha, sinalizando impactos ao Especialista em Operações de RH\nAtender e orientar gestores e colaboradores sobre cálculos, descontos, legislação trabalhista e dúvidas complexas de benefícios, resolvendo com autonomia as questões de complexidade intermediária\nControlar e lançar as notas fiscais de prestadores PJ na folha e apoiar o processo de distribuição de lucros aos sócios, conferindo valores e documentação fiscal antes do repasse\nPropor e implementar melhorias de processo, automações e padronizações das rotinas de folha e de benefícios entre as unidades, e apoiar a simulação de cenários de custo de folha e de benefícios (reajustes, dissídios, sinistralidade, mudanças de regime)","formacao":"Superior completo em Administração, Ciências Contábeis, Gestão de RH, Economia ou áreas correlatas.","experiencia":"4 anos","conhecimentos":"Conhecimento intermediário em folha de pagamento, encargos e legislação trabalhista. Experiência com controle de ponto, benefícios e rotinas completas de administração de pessoal. Capacidade de análise de inconsistências e indicadores operacionais. Vivência com auditorias e obrigações legais. Conhecimento de melhoria de processos.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":370,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ANALISTA DE OPERACOES DE RH SR","cargoNovo":"ANALISTA DE OPERACOES DE RH SR","cbo":"410105","sumaria":"Atuar como referência técnica da equipe de Operações de RH nas questões de maior complexidade de folha de pagamento, legislação trabalhista e benefícios, conduzindo a padronização de processos entre unidades, a validação de casos atípicos, a análise de sinistralidade e a interface com as áreas de Contabilidade, Compliance e Segurança do Trabalho.","atividades":"Tratar os casos de maior complexidade de cálculo, de legislação trabalhista e de benefícios de todas as unidades, atuando como ponto focal técnico da equipe nas situações que fogem da rotina padrão\nRevisar e validar os fechamentos de folha e a liberação das faturas de benefícios conduzidos pelos Analistas Jr e Pl nos pontos críticos, identificando riscos de cálculo, de conformidade e de custo antes da consolidação\nConduzir os processos de rescisão de maior complexidade, envolvendo estabilidades, movimentações especiais e situações litigiosas, articulando-se com o Jurídico quando necessário\nInteragir diretamente com Contabilidade, Compliance e Segurança do Trabalho para garantir a correta aderência de FAP e RAT, encargos, provisões e demais obrigações correlatas à folha e aos benefícios\nConduzir estudos de incidências e cenários de impacto de mudanças legais, de dissídios e de sinistralidade sobre a folha e sobre o custo de benefícios das unidades, apresentando os resultados ao Coordenador\nLiderar tecnicamente a padronização das rotinas de folha e de benefícios entre as unidades, definindo o processo de referência a ser seguido pela equipe e apoiando os Especialistas na revisão das políticas\nConduzir a análise técnica de casos complexos de benefícios, como reenquadramentos de sinistralidade, glosas de faturamento e situações contratuais atípicas, subsidiando as decisões do Especialista de Remuneração e Benefícios\nConsolidar e analisar os indicadores de custo de pessoal e de sinistralidade de benefícios de todas as unidades, identificando tendências e propondo ações estruturais à liderança da área\nAtuar como ponto focal técnico na operação de benefícios institucionais de maior valor ou visibilidade (checkup da Diretoria, premiações executivas e seguro de vida em grupo), garantindo a correta contratação e faturamento\nOrientar tecnicamente os Analistas em início de carreira e os Assistentes de Operações de RH, atuando como referência em legislação trabalhista, execução de contratos de benefícios e sinistralidade\nValidar tecnicamente as parametrizações do sistema de gestão de pessoal propostas para novas rotinas de folha e de benefícios, testando cenários antes da liberação em produção\nApoiar tecnicamente a renovação e a renegociação de contratos de benefícios, fornecendo ao Especialista de Remuneração e Benefícios as análises de utilização, sinistralidade e custo per capita necessárias à negociação\nApoiar auditorias trabalhistas, previdenciárias, fiscais e de benefícios nos temas de maior complexidade, elaborando as memórias de cálculo e as justificativas técnicas solicitadas pelos auditores","formacao":"Superior cursando em Administração, Ciências Contábeis, Gestão de RH, Economia ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Conhecimento básico em rotinas de administração de pessoal. Noções de folha de pagamento, encargos trabalhistas e controle de ponto. Entendimento de benefícios e processos de admissão e desligamento. Familiaridade com legislação trabalhista em nível operacional. Uso de ferramentas de controle e organização de dados.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":371,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ASSISTENTE DE OPERACOES DE RH","cargoNovo":"ASSISTENTE DE OPERACOES DE RH","cbo":"410105","sumaria":"Atua na execução de atividades operacionais básicas de Operações de RH, apoiando os processos de administração de pessoal por meio da organização de dados, controle de informações e atendimento inicial aos colaboradores, garantindo padronização e conformidade.","atividades":"Realizar o cadastro e atualização de dados de colaboradores, garantindo integridade das informações\nOrganizar e manter arquivos físicos e digitais de documentos trabalhistas\nApoiar o processo admissional com conferência de documentação e controles operacionais\nAuxiliar no lançamento de informações relacionadas ao controle de ponto e frequência\nApoiar a conferência inicial de dados para processamento da folha de pagamento\nAuxiliar no controle de benefícios, incluindo movimentações simples de inclusão e exclusão\nControlar e atualizar planilhas de acompanhamento de férias e vencimentos\nPrestar atendimento inicial aos colaboradores, direcionando demandas para os responsáveis\nApoiar na organização de documentação para desligamentos\nApoiar o controle de afastamentos e licenças com registro de informações\nExecutar rotinas administrativas da área, garantindo organização e padronização\nDar suporte geral às atividades operacionais da equipe de RH","formacao":"Ensino médio completo, desejável superior cursando","experiencia":"1 ano","conhecimentos":"Noções básicas de rotinas administrativas e de RH. Familiaridade com controle de documentos e organização de informações. Conhecimento inicial em folha, ponto e benefícios. Uso básico de planilhas e sistemas operacionais de RH. Entendimento básico de rotinas de admissão e desligamento.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato","atual":"Atual"},{"row":372,"empresa":"WAP","gestor":"GERENTE DE OPERACAO","area":"PRODUÇÃO","cargo":"ANALISTA DE PRODUCAO JR","cargoNovo":"ANALISTA DE PRODUCAO JR","cbo":"252705","sumaria":"Responsável por apoiar o controle da performance produtiva por meio da coleta, consolidação, tratamento e disponibilização de dados operacionais, assegurando a qualidade das informações, a atualização dos indicadores da área e a preparação de materiais gerenciais para acompanhamento da rotina industrial.","atividades":"Coletar dados de produção, paradas, perdas, retrabalho, produtividade e volumes produzidos, consolidando as informações em bases padronizadas para acompanhamento diário, semanal e mensal.\nAtualizar relatórios operacionais e gerenciais com indicadores de eficiência, rendimento, cumprimento de plano, níveis de perdas e aderência à rotina produtiva. \nApoiar a construção, manutenção e atualização de dashboards de acompanhamento da performance da manufatura, garantindo consistência entre fonte, cálculo e apresentação. \nPreparar bases de dados, gráficos, tabelas e consolidações para reuniões de rotina, reuniões de performance e apresentações executivas da área.\nValidar a integridade dos dados apontados pela operação, identificando divergências, inconsistências de lançamento e oportunidades de padronização da informação.\nRealizar análises descritivas de baixa complexidade, comparando meta x realizado, histórico x resultado corrente e comportamento dos principais indicadores da área. \nApoiar o acompanhamento de indicadores-chave de produção, qualidade e produtividade, sinalizando desvios para o superior imediato e áreas responsáveis. \nOrganizar evidências e informações para fóruns operacionais, auditorias internas, planos de ação e acompanhamento de ofensores de resultado. \nInteragir com produção, qualidade, manutenção e planejamento para obter dados, esclarecer variações e garantir rastreabilidade das informações reportadas. \nApoiar iniciativas de melhoria contínua com levantamento de dados, consolidação de resultados antes/depois e acompanhamento de indicadores de sustentação.","formacao":"Superior cursando ou completo em Engenharia, Administração ou áreas correlatas. Desejável vivência com rotinas de produção, indicadores e elaboração de relatórios.","experiencia":"2 anos","conhecimentos":"Excel intermediário para tratamento e análise de bases; noções de indicadores in órico, turno, linha, produto, célula ou unidade produtiva, gerando visão crítica de performance. \nInvestigar desvios operacionais e ofensores de performance por meio de análises quantitativas, cruzamento de informações e suporte à identificação de causa-raiz. \nPadronizar conceitos, fórmulas e critérios de medição dos principais KPIs industriais, contribuindo para uma governança mínima de dados da operação. \nAutomatizar rotinas de consolidação e atualização de relatórios, reduzindo retrabalho manual e aumentando confiabilidade, velocidade e rastreabilidade da informação.\nApoiar a coordenação e a supervisão em fóruns de performance, fornecendo leitura crítica dos números, síntese executiva e recomendação de prioridades. \nAtuar com produção, qualidade, manutenção, logística e planejamento para integrar informações e construir uma visão consolidada dos resultados da operação. \nParticipar de projetos de melhoria contínua com base em indicadores, estudos de produtividade, análises de perdas, acompanhamento de plano de ação e mensuração de ganhos.\nElaborar materiais de fechamento mensal, performance review e reuniões gerenciais, com foco em objetividade, consistência analítica e leitura executiva.","formacao":"Superior completo em Engenharia, Administração ou áreas correlatas. Desejável formação complementar em gestão da produção, melhoria contínua ou análise de dados.","experiencia":"4 anos","conhecimentos":"Excel intermediário para tratamento e análise de bases; noções de indicadores industriais (eficiência, produtividade, perdas, rendimento e aderência a plano); leitura e consolidação de dados operacionais; estatística descritiva básica; conhecimento inicial de melhoria contínua e controle de processo; capacidade de estruturar tabelas, gráficos e materiais de acompanhamento gerencial; noções de comunicação executiva para apresentar dados de forma objetiva.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Pablo Mello","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"João Pedro","aprovadorHist":"Pablo Mello","atual":"Atual"},{"row":374,"empresa":"WAP","gestor":"GERENTE DE OPERACAO","area":"PRODUÇÃO","cargo":"ANALISTA DE PRODUCAO SR","cargoNovo":"ANALISTA DE PRODUCAO SR","cbo":"252705","sumaria":"Responsável por conduzir análises avançadas da performance produtiva, estruturar indicadores estratégicos, integrar dados de múltiplas interfaces da operação e suportar decisões gerenciais por meio de diagnósticos robustos e apresentações executivas de alto nível.","atividades":"Conduzir análises avançadas de desempenho produtivo, avaliando capacidade, eficiência, perdas, custos operacionais, variabilidade de processo e impacto de restrições produtivas no resultado do negócio.\nEstruturar painéis executivos e modelos analíticos para leitura gerencial da operação, priorizando indicadores estratégicos, ofensores relevantes e recomendações objetivas de ação. \nElaborar apresentações executivas para gerência, industrial/operacional e diretoria, com storytelling baseado em fatos, evidências quantitativas, cenários e impactos esperados. \nRevisar, definir e evolucionar KPIs da manufatura, garantindo coerência entre estratégia, conceito de medição, governança da informação e comparabilidade histórica. \nLiderar diagnósticos de causa-raiz para desvios recorrentes ou críticos, com utilização de bases históricas, correlação de variáveis, leitura de tendência e avaliação de impacto. \nIntegrar dados de produção, qualidade, manutenção, suprimentos, PCP e logística para construir visão sistêmica da performance e suportar decisões interfuncionais. \nDesenvolver análises de cenário, sensibilidade e projeções para suportar decisões relacionadas a capacidade, plano produtivo, alocação de recursos, perdas e produtividade.\nAtuar como referência da área em qualidade da informação, criticidade dos dados, definição de conceitos e padronização de relatórios executivos. \nLiderar a frente analítica de iniciativas de melhoria contínua, transformação operacional ou aumento de eficiência, medindo baseline, resultado e captura de ganho.\nRecomendar ações estruturantes com base em dados, traduzindo conclusões analíticas em decisões práticas para gerência e liderança operacional. \nMentorar analistas Jr e Pl no tratamento de dados, estruturação de indicadores, lógica analítica e construção de apresentações executivas.","formacao":"Superior completo em Engenharia, Administração ou áreas correlatas. Desejável pós-graduação ou especialização em operações, gestão industrial, melhoria contínua ou áreas relacionadas.","experiencia":"2 anos","conhecimentos":"Excel intermediário para tratamento e análise de bases; noções de indicadores industriais (eficiência, produtividade, perdas, rendimento e aderência a plano); leitura e consolidação de dados operacionais; estatística descritiva básica; conhecimento inicial de melhoria contínua e controle de processo; capacidade de estruturar tabelas, gráficos e materiais de acompanhamento gerencial; noções de comunicação executiva para apresentar dados de forma objetiva.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Pablo Mello","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"João Pedro","aprovadorHist":"Pablo Mello","atual":"Atual"},{"row":375,"empresa":"WAP","gestor":"LIDER DE PRODUÇÃO / LOGÍSTICA","area":"PRODUÇÃO / LOGÍSTICA","cargo":"AUXILIAR DE PRODUCAO","cargoNovo":"AUXILIAR DE PRODUCAO","cbo":"784205","sumaria":"Executar atividades de apoio ao processo produtivo, assegurando abastecimento de materiais, movimentação interna, organização do posto de trabalho, suporte aos operadores, inspeção visual básica, embalagem e cumprimento das rotinas de qualidade, segurança, higiene e produtividade da operação.","atividades":"Preparar, separar e disponibilizar materiais, componentes e insumos para abastecimento da linha de produção. \nAbastecer equipamentos e postos de trabalho conforme orientação operacional e sequência do processo produtivo. \nApoiar operadores e demais profissionais da área nas rotinas de fabricação, montagem, acabamento e movimentação de peças e produtos. \nRealizar movimentação interna de materiais, produtos em processo e produtos acabados entre etapas da produção. \nExecutar embalagem, identificação, conferência visual e separação de itens conforme padrões do processo. \nEfetuar inspeções visuais simples e apoiar o controle de qualidade, comunicando não conformidades à liderança. \nManter a organização, limpeza e conservação da área de trabalho, ferramentas e equipamentos de uso compartilhado. \nRegistrar informações operacionais básicas, como quantidades produzidas, materiais movimentados e ocorrências do processo, quando aplicável. \nAuxiliar no controle de desperdícios, segregação de resíduos e cumprimento das práticas de boas condições de fabricação. \nCumprir normas e procedimentos de segurança, higiene, saúde ocupacional e uso correto de equipamentos de proteção.","formacao":"Ensino fundamental completo.\nDesejável ensino médio em andamento ou completo, preferencialmente em áreas relacionadas a operações, logística ou produção.","experiencia":"Não necessita","conhecimentos":"Noções de rotina industrial e fluxo produtivo; abastecimento de linha; movimentação e acondicionamento de materiais; inspeção visual básica; práticas de organização e limpeza; noções de qualidade, segurança do trabalho e uso de equipamentos de proteção; leitura de instruções operacionais simples. Conforme o segmento, podem ser desejáveis conhecimentos básicos de montagem, acabamento, medição simples ou apoio à operação de máquinas, sempre sob orientação.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Operacional","eGestor":"Não","nivel":"Operacional","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Rogério Rezende","dataHist":"2026-06-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Rogério Rezende","atual":"Atual"},{"row":376,"empresa":"WAP","gestor":"COORDENADOR DE PRODUCAO","area":"PRODUÇÃO","cargo":"ELETROMECANICO SR","cargoNovo":"ELETROMECANICO SR","cbo":"300305","sumaria":"Executar e liderar tecnicamente intervenções eletromecânicas de maior complexidade em máquinas, equipamentos e instalações de alta criticidade, atuando em falhas relevantes, diagnósticos aprofundados, melhoria de confiabilidade, orientação técnica da equipe e suporte técnico à priorização das atividades de manutenção.","atividades":"Executar e liderar tecnicamente intervenções de maior complexidade em máquinas, equipamentos e instalações eletromecânicas de alta criticidade para a operação.\nDiagnosticar falhas críticas, intermitentes ou não padronizadas, consolidando informações de testes, histórico, desenhos, diagramas e comportamento operacional do equipamento.\nPlanejar tecnicamente intervenções complexas, definindo etapas de desmontagem, reparo, substituição, remontagem, testes, validações e retorno assistido do ativo à operação.\nAtuar diretamente na solução de problemas de alto impacto operacional, apoiando a
