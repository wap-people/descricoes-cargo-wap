<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Mantém a página fora dos buscadores. No GitHub Pages não é possível
     enviar o cabeçalho X-Robots-Tag, então a meta tag faz esse papel. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Descrições de Cargo — Consulta e Geração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Identidade: Azul Freso #2A4A8B + neutros WAP (Preto Absoluto, Geada,
       Cinza Maciota) e apoios Verde Grilo / Amarelo Sol Nascente / Martim-Pescador */
    --brand:#2A4A8B; --brand-dark:#1E3766; --brand-bg:#E9EEF8; --ink:#28292B; --muted:#6b7280;
    --bg:#F5F5F5; --card:#ffffff; --line:#E8E8E8; --teal:#0095A2;
    --ok:#4C7A26; --warn:#8F6400; --bad:#A81F38;
    --ok-bg:#E9F4DE; --warn-bg:#FFF3D6; --bad-bg:#F9E0E5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Inter','Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
  header.app{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header.app .marca{display:flex;align-items:center;gap:12px;padding-right:14px;border-right:1px solid rgba(255,255,255,.35)}
  header.app .marca img{height:30px;display:block}
  header.app .marca .ppl{font-size:19px;font-weight:800;letter-spacing:.4px;font-style:italic}
  header.app h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
  header.app .sub{font-size:12px;opacity:.85}
  #topo{position:fixed;bottom:26px;right:26px;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;font-size:21px;border:none;box-shadow:0 4px 14px rgba(40,41,43,.35);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(8px);z-index:50;font-family:inherit}
  #topo.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  #topo:hover{background:var(--brand-dark)}
  .btnHead{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btnHead:hover{background:rgba(255,255,255,.28)}
  .wrap{display:flex;flex:1;min-height:0}
  aside{width:390px;min-width:300px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .filters{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .filters input,.filters select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
  .filters .row{display:flex;gap:8px}
  .count{font-size:11.5px;color:var(--muted);padding:0 2px}
  #lista{overflow-y:auto;flex:1}
  .grpArea{padding:7px 14px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;background:#fafafa;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0}
  .item{padding:9px 14px;border-bottom:1px solid #f1f1f1;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item:hover{background:#F3F6FB}
  .item.sel{background:var(--brand-bg);border-left:3px solid var(--brand);padding-left:11px}
  .item .nome{font-size:13px;font-weight:600}
  .item .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .grpArea{color:var(--teal)}
  main{flex:1;padding:22px;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
  .toolbar{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .toolbar .info{font-size:12.5px;color:var(--muted)}
  button.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  button.btn:hover{background:var(--brand-dark)}
  button.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .placeholder{color:var(--muted);font-size:14px;margin-top:80px;text-align:center;line-height:1.8}
  /* ===== DOCUMENTO ===== */
  .doc{background:#fff;width:100%;max-width:820px;padding:34px 44px;box-shadow:0 2px 14px rgba(0,0,0,.12);font-size:12.5px;line-height:1.5}
  .doc table{width:100%;border-collapse:collapse}
  .doc .cab td,.doc .cab th{border:1px solid #444;padding:5px 8px;font-size:11px;vertical-align:middle}
  .doc .cab .titulo{font-size:17px;font-weight:700;text-align:center}
  .doc .cab .lbl{background:#f3f4f6;font-weight:700;text-align:center;font-size:10px}
  .doc .cab .val{text-align:center}
  .doc .cab img{height:38px;display:block;margin:0 auto}
  h2.secjd{font-size:14px;font-weight:800;letter-spacing:1px;text-align:center;margin:20px 0 10px;color:var(--ink)}
  .doc .ident td{padding:2.5px 0;font-size:12.5px}
  .doc .ident td:first-child{font-weight:700;width:90px}
  h3.sec{font-size:12.5px;font-weight:800;background:#efefef;border-left:4px solid var(--brand);padding:5px 10px;margin:16px 0 7px}
  .doc .txt{white-space:pre-wrap;margin:0 2px}
  .doc .hs{margin:4px 2px}
  .doc .hs b{display:block;margin-bottom:2px}
  .doc .hs .txt{margin-left:0}
  .doc table.hist td,.doc table.hist th{border:1px solid #666;padding:4px 7px;font-size:11px;vertical-align:top}
  .doc table.hist th{background:#efefef;font-size:10.5px}
  .doc .rodape{margin-top:18px;font-size:11.5px}
  .doc .rodape b{font-weight:800}
  @media print{
    @page{size:A4;margin:14mm 12mm}
    body{background:#fff}
    header.app,aside,.toolbar,#topo{display:none!important}
    html,body{height:auto;display:block;overflow:visible}
    .wrap{display:block}
    main{padding:0;overflow:visible}
    .doc{box-shadow:none;max-width:none;padding:0}
    h3.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .doc .cab .lbl,.doc table.hist th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

    <h1>Descrições de Cargo — Consulta e Geração</h1>

</header>
<button id="topo" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>
<div class="wrap">
  <aside>
    <div class="filters">
      <input id="busca" type="search" placeholder="Buscar cargo, área ou gestor…">
      <div class="row">
        <select id="fArea"><option value="">Todas as áreas</option></select>
        <select id="fStatus">
          <option value="">Todos os status</option>
          <option value="ok">Em dia</option>
          <option value="warn">Vence em até 60 dias</option>
          <option value="bad">Revisão vencida (&gt;1 ano)</option>
        </select>
      </div>
      <div class="count" id="contagem"></div>
    </div>
    <div id="lista"></div>
  </aside>
  <main>

oles e registros.","atividades":"Conduzir análises de desempenho de armazenagem, movimentação e expedição, identificando gargalos, perdas e oportunidades de padronização.\nGerir indicadores de logística, estruturar planos de ação e acompanhar execução e eficácia das melhorias.\nLiderar inventários cíclicos e apoiar inventários gerais, garantindo metodologia, evidências e tratativas de divergências.\nApoiar auditorias internas e externas de processos e estoque, preparando informações, registros e planos de correção.\nRevisar e padronizar procedimentos operacionais, garantindo clareza, aderência e orientação aos envolvidos.\nConduzir melhorias de média complexidade com foco em produtividade, nível de serviço e redução de custo operacional.\nApoiar planejamento de capacidade e necessidades operacionais, antecipando riscos de demanda e propondo ajustes de fluxo e recursos.\nAtuar como ponto focal para ajustes e melhorias em relatórios e sistemas de gestão logística, garantindo aderência ao processo e qualidade do dado.\nAcompanhar ocorrências relacionadas a expedição e transporte, estruturando tratativas, evidências e ações preventivas quando aplicável. [salario.com.br]\nOrientar analistas júnior e apoiar a operação na execução correta de rotinas, controles e registros.\nGarantir cumprimento de requisitos de compliance, auditoria e segurança aplicáveis à operação logística.\nElaborar relatórios analíticos de resultados, suportando tomada de decisão da liderança em iniciativas logísticas.","formacao":"Ensino superior completo em Logística, Administração, Engenharia ou áreas correlatas. Desejável pós-graduação em Logística, Supply Chain ou áreas afins.","experiencia":"3 anos","conhecimentos":"Gestão de indicadores e planos de ação; inventários, auditorias e controles de estoque; padronização de processos logísticos; análise de dados e relatórios; domínio funcional de sistemas de gestão logística; disciplina de compliance e segurança aplicada à operação.","softskills":"Pen ganizar dados de teste e registrar evidências de execução.\nAcompanhar feedbacks de usuários durante validações, consolidar ajustes necessários e apoiar o retorno para o time técnico.\nApoiar a comunicação de mudanças para usuários, preparando orientações de uso, materiais simples e notas de versão.\nApoiar a análise de ocorrências pós entrega, registrando sintomas, contexto e recorrência para apoiar triagem e priorização.","formacao":"Ensino superior completo em Administração, Engenharia, Sistemas de Informação ou áreas correlatas.","experiencia":"1 ano","conhecimentos":"Noções de levantamento e documentação de requisitos; mapeamento de processo atual; escrita estruturada e organização de informações; critérios de aceite e evidências; noções de testes de aceitação; rotinas de backlog e refinamento; comunicação com usuários e times técnicos.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Mayra Santos","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Mayra Santos","atual":"Atual"},{"row":79,"empresa":"WAP","gestor":"GERENTE INOVACAO E DEV DE SOFTWARE","area":"TI","cargo":"ANALISTA DE NEG E PROCESSOS PL","cargoNovo":"ANALISTA DE NEG E PROCESSOS PL","cbo":"142330","sumaria":"Conduz análises de negócio e processo associadas a entregas de software, garantindo entendimento aprofundado da necessidade, desenho do fluxo alvo e definição de requisitos com critérios de aceite objetivos. Atua com autonomia moderada para conduzir entrevistas e workshops, detalhar itens do backlog, reduzir incertezas técnicas e funcionais e apoiar decisões de priorização com base em valor, impacto e risco. Sustenta a qualidade dos artefatos de análise, promove alinhamento contínuo entre áreas usuárias e times de desenvolvimento e qualidade, e garante validação efetiva das entregas por meio de testes de aceitação e critérios de sucesso mensuráveis. Atua também na transição para sustentação e adoção, assegurando documentação final, treinamento e estabilização.","atividades":"Conduzir entrevistas e workshops para levantamento de requisitos, alinhando objetivos, escopo, regras, exceções e restrições.\nMapear processo ponta a ponta da jornada atendida, identificando gargalos, riscos operacionais e oportunidades de simplificação.\nElaborar requisitos funcionais e regras de negócio com rastreabilidade, incluindo critérios de aceite verificáveis.\nDetalhar backlog com histórias de usuário consistentes, priorizadas por valor, urgência, risco e dependências.\nFacilitar refinamentos com desenvolvimento e qualidade, assegurando entendimento comum e redução de ambiguidades antes do início da construção.\nIdentificar e registrar dependências entre sistemas e integrações, apoiando o planejamento de entrega e mitigação de riscos.\nApoiar a definição de requisitos não funcionais relevantes, como desempenho, disponibilidade, rastreabilidade e segurança, conforme contexto da solução.\nPlanejar e conduzir testes de aceitação com usuários, garantindo cenários críticos, dados, evidências e registro de resultados.\nAcompanhar a entrega em ciclos, promover validações incrementais e ajustar requisitos quando necessário, mantendo controle de mudanças.\nMedir resultados pós entrega com indicadores combinados, consolidar ganhos, lições aprendidas e oportunidades para evolução do produto.","formacao":"Ensino superior completo em Administração, Engenharia, Sistemas de Informação ou áreas correlatas. Desejável pós graduação.","experiencia":"3 anos","conhecimentos":"Levantamento e especificação de requisitos; modelagem de processos e jornadas; érios de qualidade para requisitos, histórias de usuário, critérios de aceite e documentação, garantindo consistência e governança.\nElaborar análises de viabilidade e impacto, consolidando custo, benefício, risco, dependências e recomendação de abordagem de entrega.\nApoiar priorização do portfólio e do backlog em nível tático, conectando valor de negócio, risco e capacidade de entrega.\nGarantir rastreabilidade ponta a ponta entre demanda, requisitos, decisões, entregas, testes, aceite e estabilização pós entrega.\nAntecipar riscos e dependências críticas, propondo mitigação e critérios mínimos de aceite para proteção do negócio.\nDefinir estratégia de validação com usuários, incluindo cenários críticos, critérios de sucesso e plano de estabilização e adoção.\nAcompanhar resultados após implantação, definir métricas, avaliar aderência e orientar ajustes estruturais para melhoria contínua.\nOrientar analistas júnior e pleno, revisando entregas, elevando qualidade e desenvolvendo capacidade de facilitação e análise.","formacao":"Ensino superior completo em Administração, Engenharia, Sistemas de Informação ou áreas correlatas. Desejável Pós-graduação em Gestão de Processos, Projetos, Qualidade ou áreas afins.","experiencia":"5 anos","conhecimentos":"Arquitetura e governança de processos; levantamento avançado de requisitos e regras; análise de viabilidade, impacto e risco; gestão de dependências e integrações; definição de critérios de aceite robustos; validação e mensuração de resultados; facilitação e negociação com múltiplos stakeholders; liderança técnica sem gestão formal.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","apro ntroles produtivos e indicadores.\nNoções de capacidade produtiva, materiais, estoque e sequenciamento.\nCapacidade de atualizar relatórios, planilhas e dados operacionais.\nInterface básica com Produção, Compras, Logística e Almoxarifado.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Cleber Pereira","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Cleber Pereira","atual":"Atual"},{"row":82,"empresa":"WAP","gestor":"SUPERVISOR DE PCP","area":"SUPRIMENTOS","cargo":"ANALISTA DE PCP PL","cargoNovo":"ANALISTA DE PCP PL","cbo":"391105","sumaria":"Executar o planejamento e controle da produção com autonomia moderada, analisando demanda, capacidade produtiva, disponibilidade de materiais, ordens de produção, prazos e indicadores. Atua na programação das atividades produtivas, acompanhamento de desvios, priorização de demandas e proposição de ações corretivas para garantir aderência ao plano de produção.","atividades":"Elaborar e acompanhar a programação da produção, considerando demanda, capacidade e recursos disponíveis.\nAnalisar ordens de produção, prioridades, prazos, sequenciamento e restrições produtivas.\nVerificar disponibilidade de materiais, mão de obra, equipamentos e insumos para execução do plano.\nMonitorar produção planejada versus realizada, identificando desvios e causas.\nApoiar ajustes na programação em função de atrasos, rupturas, paradas ou alterações de demanda.\nAcompanhar indicadores de produtividade, atendimento, eficiência, atrasos e cumprimento do plano.\nInteragir com Produção, Compras, Almoxarifado, Logística, Qualidade e áreas comerciais/demandantes.\nAtualizar parâmetros, cadastros, lead times, roteiros ou informações produtivas em sistemas corporativos.\nElaborar relatórios de acompanhamento e análises de performance do PCP.\nPropor melhorias em sequenciamento, controles, comunicação e processos de programação.\nApoiar reuniões de planejamento, rotina operacional e acompanhamento de produção.\nSinalizar riscos operacionais à liderança, propondo alternativas de priorização ou reprogramação.","formacao":"Superior completo em Engenharia de Produção, Administração, Logística, Gestão da Produção, Supply Chain, Processos Industriais ou áreas correlatas.","experiencia":"3 anos","conhecimentos":"Conhecimento intermediário em PCP, MRP, sequenciamento e programação da produção.\nDomínio de ordens de produção, capacidade produtiva, materiais e indicadores.\nExperiência com ERP, controles produtivos, análise de desvios e relatórios.\nNoções de processos industriais, lead time, estoque e atendimento ao plano.\nCapacidade de propor ações corretivas e negociar prioridades com áreas internas.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Cleber Pereira","dataHist":"2026-05-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Cleber Pereira","atual":"Atual"},{"row":83,"empresa":"WAP","gestor":"SUPERVISOR DE PCP","area":"SUPRIMENTOS","cargo":"ANALISTA DE PCP SR","cargoNovo":"ANALISTA DE PCP SR","cbo":"391105","sumaria":"Conduzir análises e processos críticos de planejamento e controle da produção, atuando como referência técnica na programação, sequenciamento, capacidade produtiva, disponibilidade de materiais, indicadores e mitigação de riscos operacionais. Apoia decisões de priorização, reprogramação, eficiência produtiva e melhoria contínua do fluxo de produção.","atividades":"Conduzir a programação de produção de maior complexidade, considerando demanda, capacidade, materiais e restrições operacionais.\nAvaliar cenários de produção, gargalos, prioridades, mix produtivo e impactos de alterações de demanda.\nRevisar parâmetros de planejamento, lead times, capacidade, sequenciamento e premissas produtivas.\nMonitorar indicadores de aderência ao plano, produtividade, atrasos, eficiência, ocupação e atendimento.\nIdentificar causas-raiz de desvios produtivos e propor ações corretivas estruturadas.\nAtuar como referência técnica para Analistas Jr/Pl e áreas parceiras em temas de PCP.\nApoiar reuniões de rotina, S&OP, programação, capacidade e revisão de plano de produção.\nAnalisar impactos de materiais críticos, paradas, manutenção, qualidade ou restrições logísticas no plano.\nPropor melhorias em processos, controles, automações, indicadores e governança de dados do PCP.\nApoiar decisões de priorização junto à Produção, Comercial, Compras, Logística, Almoxarifado e Qualidade.\nElaborar relatórios executivos e recomendações para liderança sobre riscos, desempenho e capacidade.\nContribuir para projetos de aumento de eficiência, redução de atrasos, melhoria de nível de serviço e estabilidade produtiva.","formacao":"Superior completo em Engenharia de Produção, Administração, Logística, Supply Chain, Gestão da Produção, Processos Industriais ou áreas correlatas.\nDesejável pós-graduação ou especialização em Planejamento Industrial, Supply Chain, Lean Manufacturing, S&OP, Gestão de Operações ou áreas correlatas.","experiencia":"5 anos","conhecimentos":"Conhecimento avançado em PCP, MRP, sequenciamento, capacidade e indicadores industriais.\nDomínio de análise de demanda, restrições produtivas, materiais e plano de produção.\nExperiência com ERP ","nivel":"Analista","dataRevisao":"2026-03-01","elaborador":"Rafael Veiber","aprovador":"Diego Mafioletti","dataHist":"2026-03-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Renata Mazoti","atual":"Atual"},{"row":90,"empresa":"WAP","gestor":"DIRETOR DE NEGOCIOS","area":"P&D","cargo":"ANALISTA DE PRODUTO JR","cargoNovo":"ANALISTA DE PRODUTO JR","cbo":"262410","sumaria":"Apoiar a área de Produto/P&D na sustentação e evolução do portfólio, executando análises técnicas e de mercado, acompanhando homologações, organizando informações de desempenho em campo e contribuindo com iniciativas de melhoria e redução de custos, sempre com orientação da liderança e interação com áreas internas e fornecedores.","atividades":"Realizar levantamentos de mercado, benchmarking e análise de concorrência, consolidando informações sobre características técnicas, posicionamento, diferenciais e oportunidades de melhoria dos produtos da linha para subsidiar decisões da área. \nApoiar o processo de homologação de novos produtos, componentes e alterações de materiais, acompanhando o recebimento de amostras, organização de testes, coleta de resultados e controle da documentação técnica necessária para aprovação. \nCompilar, organizar e analisar informações provenientes de RMA, assistência técnica, reclamações recorrentes e devoluções de clientes, estruturando dados para identificação inicial de falhas e suporte à tratativa técnica. \nApoiar a atualização de fichas técnicas, especificações de produto, atributos funcionais, composição de itens e registros de engenharia, garantindo padronização e consistência das informações utilizadas pela empresa. \nDar suporte em projetos de redução de custos, realizando comparações entre componentes, materiais e alternativas técnicas, levantando impactos básicos em desempenho, qualidade, viabilidade e aderência ao produto atual. \nAuxiliar no levantamento de dados para enquadramento técnico e classificação fiscal dos produtos, reunindo características construtivas, funcionais e documentais para encaminhamento às áreas responsáveis.\nManter contato com fornecedores para solicitação de laudos, desenhos, amostras, relatórios de testes e demais informações técnicas necessárias à análise e homologação de produtos e componentes.Acompanhar a execução de testes funcionais e avaliações comparativas de produto, registrando resultados, desvios observados e pontos de atenção para discussão com analistas mais experientes e liderança. \nPreparar relatórios, apresentações e controles internos da área, apoiando o acompanhamento de indicadores técnicos, evolução de análises e status de demandas relacionadas ao portfólio. \nPrestar suporte às rotinas gerais de P&D relacionadas à manutenção da linha, acompanhamento de ocorrências e atualização de informações técnicas dos produtos sob responsabilidade da área.","formacao":"Ensino Superior completo em Engenharia, preferencialmente Engenharia Elétrica, Engenharia Mecânica, Engenharia de Produção ou áreas correlatas com aderência a produto, processos, qualidade ou manufatura.","experiencia":"2 anos","conhecimentos":"Vivência inicial em homologação de produtos e componentes, leitura e interpretação de especificações técnicas, acompanhamento de testes e suporte à análise de falhas em campo. Conhecimento em documentação técnica, certificação de produtos, interface com fornecedores e organização de dados técnicos será diferencial. Também é desejável familiaridade com análise de mercado, apoio a projetos de melhoria de produto e iniciativas de redução de custos em linhas industrializadas.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Victoria Borba","dataHist":"2026-06-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Victoria Borba","atual":"Atual"},{"row":91,"empresa":"WAP","gestor":"DIRETOR DE NEGOCIOS","area":"P&D","cargo":"ANALISTA DE PRODUTO JR","cargoNovo":"ANALISTA DE PRODUTO JR","cbo":"262410","sumaria":"Apoiar o desenvolvimento e a manutenção do portfólio de produtos, executando análises técnicas e de mercado, atividades de homologação, acompanhamento de desempenho em campo e suporte a projetos de melhoria e redução de custos, sob orientação da liderança.","atividades":"Realizar levantamentos de mercado, concorrência e tendências para subsidiar decisões sobre produtos da linha.\nApoiar o processo de homologação de produtos e componentes, acompanhando testes, amostras e documentação técnica.\nConsolidar dados de falhas em campo e devoluções, organizando informações para análise de causa e plano de ação.\nExecutar cadastros e revisões de especificações técnicas de produtos, componentes e embalagens.\nApoiar projetos de redução de custos, comparando alternativas técnicas e impactos básicos de qualidade e desempenho.\nDar suporte à classificação técnica e fiscal dos itens, reunindo atributos do produto para validação das áreas envolvidas.\nInteragir com fornecedores para coleta de informações técnicas, amostras, laudos e esclarecimentos de produto.\nPreparar relatórios, apresentações e indicadores básicos da linha de produtos.\nAcompanhar alterações de produto em conjunto com áreas parceiras, garantindo atualização de documentos e registros.\nCumprir padrões técnicos, regulatórios e de qualidade aplicáveis ao portfólio sob sua atuação.","formacao":"Ensino Superior completo em Engenharia ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Vivência inicial em homologação de produtos, leitura e interpretação de especificações técnicas, análise básica de falhas em campo e acompanhame cnicos, identificando causas prováveis e propondo ações corretivas e preventivas para estabilização do produto. \nDesenvolver e acompanhar projetos de redução de custos, avaliando alternativas de componentes, materiais, fornecedores e configurações de produto, equilibrando impacto financeiro, qualidade, funcionalidade e risco técnico. \nElaborar, revisar e validar especificações técnicas, requisitos funcionais, parâmetros construtivos e informações cadastrais dos produtos, garantindo alinhamento entre o que foi definido, homologado e aplicado na linha. \nAtuar no suporte à classificação técnica e fiscal dos produtos, assegurando consistência das informações técnicas compartilhadas com áreas parceiras e contribuindo para reduzir divergências de enquadramento. \nConduzir negociações técnicas com fornecedores nacionais e estrangeiros, discutindo performance, especificações, adequação de componentes, qualidade percebida e viabilidade de alterações de produto. \nAcompanhar a implementação de mudanças de produto, revisões de materiais e melhorias aprovadas, monitorando riscos, aderência técnica, impactos em processo e possíveis reflexos na experiência do cliente. \nProduzir relatórios técnicos, indicadores e apresentações gerenciais sobre performance da linha, status de homologações, incidência de falhas, custo de produto e andamento dos projetos sob sua responsabilidade. \nAtuar como referência técnica da linha sob sua responsabilidade, apoiando analistas juniores, alinhando decisões com Qualidade, Compras, Operações, Pós-venda e demais áreas envolvidas no ciclo de vida do produto.","formacao":"Ensino Superior completo em Engenharia, Engenharia Elétrica, Engenharia Mecânica, Engenharia de Produção ou áreas correlatas","experiencia":"4 anos","conhecimentos":"Experiência em homologação de produtos e componentes, análise de falhas em campo, elaboração e revisão de especificações técnicas e interface com fornecedores. Vivência em projetos de redução de custos, melhoria contínua de produto e sustentação de linha. Conhecimento em certificação, requisitos regulatórios, documentação técnica e classificação técnica/fiscal é importante para o nível. Também é desejável boa atuação interfuncional com Qualidade, Compras, Operações e Pós-venda.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Victoria Borba","dataHist":"2026-06-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Victoria Borba","atual":"Atual"},{"row":93,"empresa":"WAP","gestor":"DIRETOR DE NEGOCIOS","area":"P&D","cargo":"ANALISTA DE PRODUTO PL","cargoNovo":"ANALISTA DE PRODUTO PL","cbo":"262410","sumaria":"Conduzir análises e atividades de desenvolvimento e sustentação do portfólio de produtos, coordenando homologações, avaliações de desempenho em campo, projetos de melhoria e redução de custos, com autonomia moderada e interface frequente com fornecedores e áreas internas.","atividades":"Realizar análises de mercado, concorrência e portfólio para recomendar inclusões, substituições ou melhorias de produtos.\nConduzir o processo de homologação de produtos e componentes, definindo cronograma, testes, critérios técnicos e documentação necessária.\nAnalisar ocorrências de campo e devoluções, identificando causas prováveis e propondo ações corretivas e preventivas.\nDesenvolver e implementar projetos de redução de custos e melhoria de desempenho, equilibrando qualidade, prazo e viabilidade técnica.\nDefinir e revisar especificações técnicas de produtos, componentes e requisitos de embalagem para lançamento ou alteração.\nAtuar na classificação técnica e fiscal dos produtos em interface com áreas parceiras, assegurando consistência das informações técnicas.\nConduzir negociações técnicas com fornecedores nacionais e estrangeiros para ajustes de produto, qualidade e performance.\nAcompanhar mudanças de engenharia e sua implementação, monitorando riscos, impactos e aderência ao escopo aprovado.\nGerar indicadores e relatórios analíticos da linha de produtos para suportar decisões da gestão.\nAtuar como referência técnica da linha sob sua responsabilidade, apoiando níveis mais juniores e influenciando áreas parceiras.","formacao":"Ensino Superior completo em Engenharia ou áreas correlatas.","experiencia":"4 anos","conhecimentos":"Experiência em homologação de produtos e componentes, análise de falhas em campo, especificações técnicas e interface com fornecedores. Vivência em projetos de redução de custos, melhoria de produto e sustentação de linha. Conhecimento em requisitos regulatórios, certificações aplicáveis e classificação técnica/fiscal será importante. Desejável experiência com negociações técnicas e atuação interfuncional com P&D, Qualidade, Compras e Operações.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2023-04-04","elaborador":"Aline Cunha","aprovador":"Leandro Azevedo","dataHist":"2023-04-04","versao":"0","descRev":"Emissão Inicial","revisor":"Aline Cunha","aprovadorHist":"Leandro Azevedo","atual":"Histórico"},{"row":94,"empresa":"WAP","gestor":"DIRETOR DE NEGOCIOS","area":"P&D","cargo":"ANALISTA DE PRODUTO SR","cargoNovo":"ANALISTA DE PRODUTO SR","cbo":"262410","sumaria":"Responder tecnicamente pela gestão e evolução do portfólio de produtos sob sua responsabilidade, liderando homologações complexas, análises aprofundadas de desempenho e falhas em campo, projetos estruturantes de redução de custos e interfaces críticas com fornecedores e áreas internas, com elevada autonomia e forte influência técnica nas decisões da área.","atividades":"Definir direcionamentos técnicos para evolução do portfólio com base em análises de mercado, benchmarking, comportamento da concorrência, desempenho dos produtos atuais e oportunidades de ganho em competitividade, margem e percepção de valor. \nLiderar homologações mais complexas de produtos, componentes, revisões técnicas e mudanças de configuração, garantindo aderência funcional, regulatória, comercial e operacional antes da implementação definitiva na linha. \nConduzir análises aprofundadas de falhas em campo, RMA, devoluções e ocorrências críticas, estabelecendo hipóteses técnicas, validando causa raiz e definindo planos de correção e estabilização do produto em conjunto com áreas parceiras. \nEstruturar e liderar projetos de redução de custos e melhoria de produto com maior relevância para o negócio, avaliando impacto em margem, confiabilidade, desempenho, experiência do cliente e riscos associados às alterações propostas. \nValidar especificações técnicas, mudanças de engenharia, requisitos críticos de performance e documentação de produto, assegurando que as definições reflitam a necessidade do negócio e a viabilidade técnica de aplicação. \nAtuar como principal referência técnica para enquadramento e classificação de produto, contribuindo com argumentos técnicos, consistência documental e mitigação de riscos associados a divergências de interpretação. \nNegociar tecnicamente com fornecedores estratégicos nacionais e estrangeiros, sustentando decisões relacionadas à performance, qualidade, custo, padronização, adequação de componentes e roadmap de evolução do produto. \nIntegrar e alinhar decisões com as áreas de Qualidade, Compras, Operações, Pós-venda e Negócios, garantindo coerência entre especificação, homologação, implementação e sustentação do produto ao longo do ciclo de vida. \nMonitorar indicadores técnicos e econômicos da linha, priorizando ações estruturais de correção, padronização, melhoria contínua e prevenção de recorrências que afetem custo, desempenho ou reputação do produto. \nElaborar pareceres técnicos, estudos comparativos e materiais executivos para apoiar decisões da liderança e da diretoria sobre continuidade, revisão, substituição ou reposicionamento técnico de produtos. \nAtuar como referência para analistas de menor senioridade, orientando critérios de análise, boas práticas de homologação, lógica de tratativa de falhas e racional técnico aplicado ao portfólio sob gestão da área.","formacao":"Ensino Superior completo em Engenharia, Engenharia Elétrica, Engenharia Mecânica, Engenharia de Produção ou áreas correlatas. Desejável Pós-graduação ou especialização em produto, qualidade, processos, confiabilidade ou gestão de projetos.","experiencia":"6 anos","conhecimentos":"Experiência sólida em homologação de produtos e componentes, análise aprofundada de falhas em campo, gestão técnica de portfólio e condução de melhorias estruturantes. Domínio de especificações técnicas, mudanças de produto, requisitos regulatórios e certificações aplicáveis. Vivência forte com negociação técnica junto a fornecedores estratégicos e atuação interfuncional com áreas internas. Conhecimento em classificação técnica/fiscal e projetos relevantes de redução de custos fortalece a aderência ao cargo.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Victoria Borba","dataHist":"2026-06-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist"  de desempenho do portfólio sob sua responsabilidade.","formacao":"Ensino Superior completo em Engenharia ou áreas correlatas.","experiencia":"6 anos","conhecimentos":"Experiência sólida em homologação complexa de produtos, análise aprofundada de falhas em campo, gestão técnica de portfólio e projetos estruturantes de redução de custos. Vivência consistente com especificações técnicas, mudanças de engenharia, requisitos regulatórios e certificações aplicáveis. Domínio em negociação técnica com fornecedores estratégicos e forte interface com áreas multidisciplinares. Desejável atuação como referência técnica em classificação de produto e sustentação de linha.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2023-04-04","elaborador":"Aline Cunha","aprovador":"Leandro Azevedo","dataHist":"2023-04-04","versao":"0","descRev":"Emissão Inicial","revisor":"Aline Cunha","aprovadorHist":"Leandro Azevedo","atual":"Histórico"},{"row":96,"empresa":"WAP","gestor":"SUPERVISOR DE PROJETOS JR","area":"BPM & PMO","cargo":"ANALISTA DE PROJETOS JR","cargoNovo":"ANALISTA DE PROJETOS JR","cbo":"251220","sumaria":"Atua no suporte à gestão e controle dos projetos, executando atividades operacionais e administrativas do PMO, garantindo atualização de informações, organização da documentação e aderência básica à metodologia definida.","atividades":"Manter cadastro e estruturação do projeto nas ferramentas conforme padrão do PMO.\nAtualizar cronogramas com base em inputs dos responsáveis, registrando evidências e justificativas de alterações.\nConsolidar e atualizar painel de status, registrando progresso, impedimentos e próximos passos por frente/entrega.\nControlar lista de pendências e ações, g al. Funciona como par técnico do Especialista/Coordenador de Remuneração & Benefícios, sendo referência para BP e liderança em temas de remuneração e benefícios.","atividades":"Liderar estudos de competitividade salarial e de benefícios, consolidando pesquisas de mercado, comparando com práticas internas e propondo ajustes em estruturas salariais e pacote de benefícios.\nPropor e apoiar a definição e revisão de políticas de remuneração fixa, variável e benefícios (elegibilidade, critérios, estruturas), em alinhamento com estratégia de negócios e diretrizes de People. \nConduzir análises complexas de movimentações internas (promoções, mérito, ajustes estruturais, correções de equidade), avaliando impacto financeiro, posicionamento em faixa e riscos de compressão/inversão interna.\nLiderar a revisão e atualização de estruturas de cargos e salários, incluindo arquitetura de cargos, níveis, faixas salariais e vinculação a CBO. \nAtuar como ponto de referência técnica em Remuneração & Benefícios para Business Partners, gestores e alta liderança, apoiando decisões críticas (contratações-chave, retenção, ajustes pontuais).\nCoordenar análises de budget de pessoal (salários, encargos e benefícios), incluindo simulações de cenários (planos de meritocracia, revisões de benefícios, reestruturações).\nLiderar ou co-liderar projetos de revisão/ampliação do pacote de benefícios (benefícios flexíveis, novos produtos, redesenho de plano médico), avaliando impacto em custo, engajamento e atração/ retenção.\nDesenvolver e manter dashboards avançados de Total Rewards (analytics de faixa, pay mix, custo de benefícios por colaborador, pay equity, compa-ratio por área). \nAssessorar a liderança de People em comitês de pessoas e remuneração (promoções, revisões salariais, exceções), fornecendo análises, riscos e recomendações técnicas. \nAtuar junto a fornecedores estratégicos de benefícios e consultorias de remuneração, avaliando propostas, contratos, índices de reajuste e qualidade de serviço.","formacao":"Ensino superior completo em Administração, Economia, Contabilidade, Estatística, Engenharia, Gestão de RH ou áreas correlatas.\nDesejável: Pós-graduação em Remuneração, Finanças, Controladoria, Estatística ou Gestão de Pessoas.","experiencia":"4 anos","conhecimentos":"Domínio de metodologias de Remuneração.\nConhecimento em administração de benefícios e análise de custo/benefício, incluindo trato com operadoras e consultorias.\nExcel avançado e bom domínio de Power BI ou ferramentas de People Analytics para modelagens e simuladores.\nConhecimento consistente de legislação trabalhista e práticas de mercado em remuneração e benefícios. \nExperiência com sistemas de RH/Folha com módulos de cargos, salários e benefícios, incluindo geração de relatórios para análise.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2025-02-04","elaborador":"João Pedro","aprovador":"Ewerson Rossato","dataHist":"2025-02-04","versao":"0","descRev":"Emissão Inicial","revisor":"João Pedro","aprovadorHist":"Ewerson Rossato","atual":"Histórico"},{"row":104,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH","area":"PEOPLE","cargo":"ANALISTA DE R&B SR","cargoNovo":"ANALISTA DE R&B SR","cbo":"252405","sumaria":"Atua de forma estratégica em Total Rewards, liderando análises, desenhos e revisões de políticas de remuneração e benefícios, apoiando decisões de alto impacto em competitividade, equidade interna e custos de pessoal. Funciona como par técnico do Especialista/Coordenador de Remuneração & Benefícios, sendo referência para BP e liderança em temas de remuneração e benefícios.","atividades":"Liderar estudos de competitividade salarial e de benefícios, consolidando pesquis rículos e identificar candidatos aderentes às posições abertas. \nConduzir entrevistas individuais e coletivas, de acordo com o perfil da vaga. \nApoiar na condução de dinâmicas de grupo e testes, quando aplicáveis. \nElaborar pareceres dos candidatos avaliados, registrando percepções e recomendações. \nSolicitar e conferir documentação de novos colaboradores, garantindo conformidade. \nConduzir o processo de integração inicial de novos colaboradores. \nAuxiliar e orientar gestores sobre a aplicação da avaliação do período de experiência. \nPreencher relatórios e indicadores básicos de recrutamento e seleção, dando suporte às demais demandas de People.","formacao":"Superior cursando em Psicologia, Gestão de Recursos Humanos, Administração ou áreas correlatas.","experiencia":"1 ano","conhecimentos":"Noções básicas de recrutamento e seleção; utilização de plataformas de recrutamento; boa comunicação verbal e escrita; organização de processos seletivos operacionais; noções de Pacote Office para registro e controle de vagas e candidatos","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-03-05","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-03-05","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":106,"empresa":"WAP","gestor":"SUPERVISOR DE DHO","area":"PEOPLE","cargo":"ANALISTA DE R&S PL","cargoNovo":"ANALISTA DE R&S PL","cbo":"351315","sumaria":"Responsável por planejar e executar processos seletivos de média complexidade, garantindo contratações alinhadas aos requisitos das vagas e à cultura organizacional. Atua em parceria com gestores das áreas clientes, monitora indicadores de R&S e contribui para melhoria contínua de processos e iniciativas de employer branding.","atividades":"Analisar solicitações de abertura de vagas (MOV), validar requisitos e realizar alinhamento de perfil com gestores. \nPlanejar e conduzir processos seletivos de média complexidade (divulgação, triagem, entrevistas individuais e coletivas). \nAplicar testes, dinâmicas de grupo e elaborar pareceres técnicos dos candidatos avaliados. \nGarantir contratações aderentes aos requisitos técnicos e à cultura organizacional. \nMonitorar indicadores de R&S (tempo de preenchimento, qualidade de contratação, fonte de candidatos) e propor melhorias de processo. \nParticipar de projetos internos de inovação em R&S e ações de employer branding. \nConduzir e acompanhar a integração de novos colaboradores, incluindo orientações sobre o período de experiência para gestores. \nAssegurar conformidade documental em processos de admissão e apoiar, quando necessário, rotinas de desligamento e folha de pagamento. \nApoiar as demais demandas da área de People, contribuindo com práticas de gestão de pessoas e desenvolvimento organizacional.","formacao":"Superior completo em Psicologia, Gestão de Recursos Humanos, Administração ou áreas correlatas.\nDesejável pós-graduação em Gestão de Pessoas, Psicologia Organizacional ou áreas afins.","experiencia":"2 anos","conhecimentos":"Domínio de processos de recrutamento e seleção; boa comunicação escrita (gramatical e ortográfica) e oral; condução de entrevistas e dinâmicas; Pacote Office intermediário para elaboração de relatórios; familiaridade com plataformas de recrutamento e sistemas de RH","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-03-05","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-03-05","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":107,"empresa":"WAP","gestor":"SUPERVISOR DE DHO","area":"PEOPLE","cargo":"ANALISTA DE R&S SR","cargoNovo":"ANALISTA DE R&S SR","cbo":"351315","sumaria":"Responsável por liderar processos seletivos estratégicos e de alta complexidade, assegurando a atração e seleção de talentos alinhados à cultura e aos objetivos da empresa. Atua de forma consultiva junto à liderança, desenvolvendo estratégias de recrutamento, aprimorando processos, fortalecendo a marca empregadora e sendo referência técnica para a equipe de R&S.","atividades":"Conduzir processos seletivos para posições estratégicas, especialistas e cargos de liderança, garantindo qualidade e prazo. \nRealizar alinhamentos detalhados com gestores e diretores, definindo requisitos técnicos e comportamentais das vagas. \nDesenvolver e implementar estratégias de atração de talentos e ações de employer branding. \nMonitorar indicadores e métricas de R&S, propor melhorias estruturantes e liderar projetos de inovação e transformação digital na área. \nAplicar metodologias avançadas de avaliação (assessment, testes psicológicos, entrevistas por competências). \nAtuar como referência técnica em R&S, orientando e desenvolvendo profissionais mais juniores da equipe. \nGarantir práticas de diversidade e inclusão em todos os processos seletivos. \nConduzir programas de integração, acompanhar o período de experiência e realizar entrevistas de desligamento, quando necessário. \nRepresentar a empresa em eventos, feiras de carreira e parcerias com instituições de ensino e entidades de mercado. \nApoiar demandas estratégicas e operacionais da área de People, incluindo atualização de políticas, procedimentos e diretrizes de R&S.","formacao":"Pós-graduação em Psicologia, Administração, Recursos Humanos ou áreas correlatas.","experiencia":"4 anos","conhecimentos":"Técnicas avançadas de R&S e metodologias de avaliação (incluindo assessment); domínio de entrevistas por competências; Pacote Office avançado e ferramentas ATS; gestão e análise de indicadores e métricas de R&S; comunicação clara e escrita impecável para relatórios e interação com alta liderança.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-03-05","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-03-05","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":108,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH / DHO","area":"PEOPLE","cargo":"ANALISTA DE REC.HUMANOS PL","cargoNovo":"ANALISTA DE RECURSOS HUMANOS PL","cbo":"252405","sumaria":"Atua de forma generalista na execução e melhoria de processos de RH, com autonomia moderada para conduzir rotinas, analisar indicadores, orientar clientes internos e implementar ações relacionadas a atração, integração, desenvolvimento, clima, comunicação e suporte às políticas de pessoas.","atividades":"Conduzir rotinas generalistas de RH com autonomia moderada, assegurando aderência às políticas, qualidade das entregas e atendimento consistente às áreas clientes.\nExecutar processos de recrutamento e seleção de vagas de média complexidade, realizando alinhamento de perfil, triagem, entrevistas, pareceres e interface com gestores.\nCoordenar etapas de admissão, integração e movimentações internas, garantindo fluidez entre RH, liderança, candidato e áreas administrativas envolvidas.\nPlanejar e apoiar iniciativas de treinamento e desenvolvimento, controlando cronogramas, fornecedores, indicadores de participação e avaliações de reação.\nConsolidar, analisar e reportar indicadores de RH, identificando desvios, oportunidades de melhoria e recomendações práticas para os processos sob sua responsabilidade.\nAtuar no atendimento consultivo de lideranças em temas recorrentes de RH, orientando sobre procedimentos, fluxos, políticas e boas práticas de gestão de pessoas.\nApoiar ciclos de desempenho, clima, comunicação interna e ações de engajamento, acompanhando prazos, governança, base de dados e devolutivas necessárias.\nRevisar procedimentos e controles da área, propondo padronizações, simplificações e melhorias que reduzam retrabalho e aumentem a eficiência operacional.\nAcompanhar fornecedores e demandas administrativas de RH, validando escopo, qualidade das entregas, prazos, documentos e conformidade contratual.\nApoiar auditorias, revisões internas e projetos da área, assegurando organização das evidências, qualidade das informações e sustentação dos processos implantados.","formacao":"Ensino superior completo em Administração, Psicologia, Recursos Humanos ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Vivência em processos generalistas de RH com interface com lideranças. Conhecimento intermediário de indicadores, fluxo de recrutamento e seleção, integração, treinamento e rotinas de people support. Excel intermediário/avançado. Noções consistentes de legislação trabalhista, políticas internas e sistemas de RH. Capacidade de documentar processos e apoiar melhorias.","softskills":"Pensamento Crítico – Analisar problemas e propor soluções viáveis.\nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-04-01","elaborador":"Rafael Veiber","aprovador":"Ewerson Rossato / Joana Bernardi","dataHist":"2026-04-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Ewerson Rossato / Joana Bernardi","atual":"Atual"},{"row":109,"empresa":"","gestor":"","area":"RECEBIMENTO FISCAL","cargo":"ANALISTA DE RECEBIMENTO FISCAL JR","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":"","eGestor":"","nivel":"","dataRevisao":"","elaborador":"","aprovador":"","dataHist":"","versao":"","descRev":"","revisor":"","aprovadorHist":"","atual":""},{"row":110,"empresa":"WAP","gestor":"COORDENADOR DE OPERAÇÕES DE RH / DHO","area":"PEOPLE","cargo":"ANALISTA DE RECURSOS HUMANOS JR","cargoNovo":"ANALISTA DE RECURSOS HUMANOS JR","cbo":"252405","sumaria":"Atua no suporte generalista aos processos de Recursos Humanos, executando rotinas operacionais e analíticas de menor complexidade em recrutamento e seleção, onboarding, treinamento, indicadores, atendimento interno e apoio às políticas de pessoas, assegurando conformidade, organização e qualidade na execução","atividades":"Apoiar a execução das rotinas generalistas de RH, garantindo cumprimento de prazos, padrões internos e atualização correta de controles, documentos e registros da área.\nPrestar atendimento inicial a colaboradores e lideranças sobre processos de RH, esclarecendo dúvidas frequentes e direcionando demandas mais complexas para níveis superiores.\nApoiar processos de recrutamento e seleção, incluindo triagem inicial de currículos, agendamento de entrevistas, organização de feedbacks e atualização do pipeline de vagas.\nAcompanhar o processo de admissão e integração de novos colaboradores, conferindo documentos, checklists, cronogramas e comunicação com áreas envolvidas.\nDar suporte às ações de treinamento e desenvolvimento, controlando listas de presença, avaliações, logística, materiais e indicadores básicos de participação.\nAuxiliar na consolidação de indicadores operacionais de RH, nuo em engenharia de dados e analytics.","atividades":"Apoiar a construção e atualização de tabelas analíticas na prateleira de dados, seguindo especificações técnicas definidas pelo time.\nAjudar na implementação e manutenção de pipelines de dados (scripts SQL/Python, jobs em Databricks), realizando ajustes simples.\nExecutar testes básicos em queries e datasets, verificando consistência, volumes e regras de negócio.\nAuxiliar na correção de falhas em rotinas de dados, sob orientação de Analytics Engineer Pl/Sr.\nAtualizar documentação de tabelas, campos, regras de transformação e fluxos de dados.\nApoiar a manutenção do catálogo de dados, incluindo descrições, owners e tags.\nContribuir na preparação de datasets para consumo por analistas de BI e áreas de negócio.\nManter organização de repositórios de código (Git) e pipelines, seguindo padrões definidos.","formacao":"Superior cursando ou completo em Engenharia, Ciência da Computação, Sistemas de Informação, Estatística ou áreas correlatas.","experiencia":"1 ano","conhecimentos":"Conhecimento prático de SQL e noções de Python para manipulação de dados.\nNoções de modelagem de dados e de conceitos de Data Warehouse/Lake.\nFamiliaridade com alguma plataforma de dados/BI (por exemplo, Databricks, Power BI, ou similar).\nNoções de versionamento de código (Git) e organização de projetos.\nCapacidade de leitura e entendimento de documentação técnica de dad","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-03-06","elaborador":"Rafael Veiber","aprovador":"Beatriz Paulino","dataHist":"2026-03-06","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Beatriz mance de vendas.\nCapacidade de tratar, organizar, validar e consolidar dados de diferentes fontes.\nConhecimento em elaboração de relatórios, dashboards, gráficos e análises comparativas.\nNoções de interface com Vendas, Marketing, Trade, Supply Chain e Planejamento de Demanda.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Mauri Souza","dataHist":"2026-05-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Mauri Souza","atual":"Atual"},{"row":139,"empresa":"WAP","gestor":"GERENTE DE TRADE MARKETING","area":"DTM / TRADE MKT","cargo":"ANALISTA DE INT. TRADE MARKETING JR","cargoNovo":"ANALISTA DE INT. TRADE MARKETING JR","cbo":"142335","sumaria":"Apoia a consolidação, organização e leitura de dados de vendas, canais, campanhas e indicadores de trade marketing, contribuindo para a produção de relatórios, dashboards e análises iniciais que suportem a rotina da área e a tomada de decisão da liderança comercial.","atividades":"Coletar e consolidar dados de vendas, canais, categorias, campanhas e parceiros em bases padronizadas para análise da área. \nAtualizar relatórios periódicos de desempenho comercial e de trade marketing, garantindo consistência e acuracidade das informações. \nApoiar o acompanhamento de indicadores de performance, como volume de vendas, ticket médio, taxa de conversão e resultados de ações promocionais. \nAuxiliar na construção de dashboards e painéis gerenciais para facilitar a leitura dos dados pela liderança e pelas áreas parceiras. \nApoiar análises comparativas entre períodos, canais, regiões, parceiros ou categorias, destacando variações relevantes. \nRealizar pesquisas básicas de mercado e concorrência para complementar análises de desempenho da área. \nOrganizar históricos analíticos, materiais de acompanhamento e evidências de campanhas e ações realizadas. \nDar suporte à elaboração de apresentações analíticas para reuniões da área e fóruns de gestão comercial. \nApoiar a apuração de resultados de campanhas, promoções e ações de sell-in e sell-out. \nSinalizar inconsistências, desvios de informação ou oportunidades simples de melhoria na qualidade dos dados da área.","formacao":"Ensino superior em andamento em Administração, Economia, Estatística, Engenharia, Marketing ou áreas correlatas.","experiencia":"2 anos","conhecimentos":"Conhecimento básico a intermediário em análise de dados, indicadores comerciais e interpretação de desempenho de vendas. Capacidade de estruturar relatórios e painéis com clareza e consistência. Familiaridade com métricas de trade marketing, sell-in, sell-out e campanhas promocionais. Boa organização de bases e histórico de informações. Atenção à qualidade dos dados e disciplina analítica.","softskills":"Gestão do Tempo – Priorizar tarefas simples e lidar com demandas simultâneas.\nAprendizado Contínuo – Buscar feedback e aplicar melhorias.\nRelacionamento Interpessoal – Construir boa relação com pares e clientes internos.\nAdaptabilidade – Ajustar-se a mudanças de processos e prioridades.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Silvia Vilela","dataHist":"2026-06-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Silvia Vilela","atual":"Atual"},{"row":140,"empresa":"WAP","gestor":"GERENTE DE TRADE MARKETING","area":"DTM / TRADE MKT","cargo":"ANALISTA DE INT. TRADE MARKETING PL","cargoNovo":"ANALISTA DE INT. TRADE MARKETING PL","cbo":"142335","sumaria":"Analisa dados de vendas, canais, campanhas, mercado e execução de trade marketing, traduzindo informações em diagnósticos, relatórios analíticos e recomendações para apoiar decisões da liderança, evolução de performance e priorização de iniciativas comerciais.","atividades":"Construir análises periódicas de desempenho por canal, região, parceiro, categoria e período, identificando variações, tendências e pontos de atenção. \nMonitorar e interpretar indicadores de performance comercial e de trade marketing, incluindo conversão, volume, ticket médio, giro e resultados promocionais. \nDesenvolver e manter dashboards gerenciais que apoiem a leitura da liderança e das áreas comerciais. \nAvaliar resultados de campanhas, promoções e ações de canal, apontando aprendizados, oportunidades e desvios. \nApoiar a construção de previsões de vendas, metas e cenários de performance com base em histórico e dinâmica de mercado. \nRealizar análises de concorrência, mercado e movimentações relevantes que impactem a estratégia de trade marketing. \nTraduzir dados em insights práticos para apoiar decisões da área comercial, marketing e trade. \nEstruturar relatórios executivos e materiais de apresentação com leitura clara dos principais indicadores e impactos para o negócio. \nApoiar a padronização de indicadores, conceitos e critérios analíticos da área, fortalecendo a governança de dados. \nAtuar com menor supervisão na priorização das análises de rotina e em demandas táticas da liderança.","formacao":"Ensino superior completo em Administração, Economia, Estatística, Engenharia, Marketing ou áreas correlatas.","experiencia":"4 anos","conhecimentos":"Experiência em análise de dados, relatórios gerenciais, interpretação de KPIs comerciais e leitura de resultados de campanhas e canais. Capacidade de transformar dados em recomendações práticas para a liderança. Boa visão de negócio, organização de indicadores e consistência metodológica nas análises. Conhecimento de métricas de sell-in, sell-out, giro, cobertura e performance promocional. Capacidade de estruturar materiais executivos de boa leitura.","softskills l. \nTransformar dados complexos em recomendações claras, objetivas e acionáveis para trade, comercial, marketing e liderança. \nAtuar como referência metodológica para indicadores, critérios analíticos e governança de informação da área. \nApoiar o desenvolvimento técnico dos níveis JR e PL, orientando boas práticas analíticas e consistência de interpretação. \nSustentar discussões estratégicas com liderança, oferecendo leitura de impacto, priorização e implicações de negócio a partir dos dados disponíveis.","formacao":"Ensino superior completo em Administração, Economia, Estatística, Engenharia, Marketing ou áreas correlatas. Desejável pós-graduação em áreas correlatas.","experiencia":"6 anos","conhecimentos":"Domínio de análise de dados aplicada a vendas, canais, campanhas e performance comercial. Capacidade de estruturar dashboards executivos, leituras de tendência, forecast e recomendações para negócio. Sólida compreensão de KPIs de trade marketing, sell-in, sell-out, giro, cobertura, conversão e retorno de ações promocionais. Habilidade para conduzir análises mais ambíguas, com diferentes fontes de informação e maior exigência de julgamento. Boa capacidade de comunicação executiva e influência técnica.","softskills":"Influência Positiva – Orientar colegas menos experientes.\nGestão de Conflitos – Resolver divergências de forma construtiva.\nVisão Sistêmica – Entender impactos das ações no negócio.\nTomada de Decisão – Assumir responsabilidade por escolhas técnicas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-06-01","elaborador":"Rafael Veiber","aprovador":"Silvia Vilela","dataHist":"2026-06-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Silvia Vilela","atual":"Atual"},{"row":142,"empresa":"","gestor":"","area":"","cargo":"ASSISTENTE DE CADASTRO","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","softskills":"","areaAtuacao":" nComunicação Assertiva – Expressar ideias com clareza e segurança.\nColaboração Ampliada – Apoiar colegas e compartilhar conhecimento.\nAutonomia Moderada – Executar tarefas com pouca supervisão.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Analista","dataRevisao":"2026-07-01","elaborador":"Rafael Veiber","aprovador":"Leandro de Azevedo","dataHist":"2026-07-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Leandro de Azevedo","atual":"Atual"},{"row":145,"empresa":"WAP","gestor":"LIDER DE COMEX","area":"SUPRIMENTOS","cargo":"ASSIST DE COMEX JR","cargoNovo":"ASSISTENTE DE COMEX","cbo":"342105","sumaria":"Prestar apoio administrativo e operacional às rotinas de Comércio Exterior, auxiliando no controle de documentos, atualização de informações, acompanhamento de processos de importação e exportação, suporte a parceiros externos e interface com áreas internas. Atua garantindo organização, rastreabilidade e atualização das informações necessárias ao fluxo das operações internacionais.","atividades":"Apoiar o controle de documentos de importação e exportação, mantendo arquivos físicos ou digitais organizados.\nInserir e atualizar informações de processos internacionais em ERP, sistemas corporativos ou controles internos.\nAuxiliar no acompanhamento de embarques, entregas, prazos e pendências operacionais.\nApoiar a conferência de faturas comerciais, listas de embalagem, certificados, conhecimentos de embarque e demais documentos aplicáveis.\nSolicitar e acompanhar informações junto a despachantes, agentes de carga, transportadores e fornecedores.\nApoiar o envio de documentos e informações para áreas como Fiscal, Financeiro, Compras, Logística e Contabilidade.\nAtualizar controles de custos, prazos, status de processos e documentação pendente.\nPrestar suporte administrativo à equipe de Comex em demandas recorrentes.\nAuxiliar na preparação de documentos e informações para auditorias, controles internos e conferências.\nSinalizar inconsistências documentais ou pendências operacionais aos analistas ou liderança.\nCumprir procedimentos internos, políticas de segurança da informação e regras aplicáveis ao processo de Comex.\nApoiar melhorias simples em controles, arquivos e organização das rotinas da área.","formacao":"Ensino médio completo. Desejável curso técnico ou graduação em andamento em Comércio Exterior, Administração, Logística, Relações Internacionais ou áreas correlatas.","experiencia":"1 ano","conhecimentos":"Noções de importação, exportação e documentação internacional.\nConhecimento básico em controles administrativos e organização documental.\nNoções de ERP, sistemas corporativos e pacote de produtividade.\nNoções de logística internacional e acompanhamento de processos.\nCapacidade de apoiar interface com Fiscal, Financeiro, Logística e Compras.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-05-01","elaborador":"Rafael Veiber","aprovador":"Greciene Zaramella","dataHist":"2026-05-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Greciene Zaramella","atual":"Atual"},{"row":146,"empresa":"WAP","gestor":"SUPERVISOR DE DHO","area":"PEOPLE","cargo":"ASSIST DE COMUNICACAO INTERNA JR","cargoNovo":"ASSISTENTE DE COMUNICACAO INTERNA","cbo":"142335","sumaria":"Atuar no suporte operacional e administrativo das ações de comunicação interna da organização, auxiliando na produção, organização e divulgação de conteúdos institucionais, garantindo o fluxo adequado de informações aos colaboradores e o alinhamento às diretrizes de comunicação corporativa.","atividades":"Apoiar a produção e revisão de comunicados internos, avisos, newsletters e conteúdos para canais internos (intranet, e-mail, murais, TV corporativa).\nAuxiliar na organização e atualização de calendários de comunicação interna.\nApoiar a divulgação de campanhas institucionais, eventos internos e programas corporativos.\nManter organizados arquivos, materiais e bases de conteúdo da área.\nApoiar a coleta de informações junto às áreas internas para elaboração de comunicados.\nAuxiliar no acompanhamento de fornecedores gráficos e digitais (quando aplicável).\nApoiar a atualização de conteúdos em plataformas internas de comunicação.\nContribuir para a padronização visual e textual dos materiais internos.\nAuxiliar no controle de indicadores simples da área (envios, prazos, publicações).\nApoiar ações de endomarketing e clima organizacional.\nCumprir normas, políticas internas e diretrizes de comunicação da empresa.","formacao":"Ensino médio completo. \nDesejável superior em andamento em Comunicação Social, Jornalismo, Publicidade e Propaganda, Relações Públicas, Marketing ou áreas correlatas.","experiencia":"6 meses","conhecimentos":"Noções de comunicação interna e institucional.\nRedação básica e revisão de textos.\nPacote Office e Pacote Adobe (Photoshop, Illustrator).\nConhecimento em edições de vídeo e imagem.\nOrganização de informações e arquivos digitais.\nNoções de identidade visual e linguagem corporativa.\nDesejável familiaridade com intranet ou ferramentas de comunicação interna.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-04-01","elaborador":"Rafael Veiber","aprovador":"Joana Bernardi","dataHist":"2026-04-01","versao":"0","descRev":"Emissão Inicial","revisor":"Rafael Veiber","aprovadorHist":"Joana Bernardi","atual":"Atual"},{"row":147,"empresa":"WAP","gestor":"LIDER DE CUSTOMER EXPERIENCE / SUPERVISOR CUSTOMER EXPERIENCE","area":"CUSTOMER EXPERIENCE","cargo":"ASSIST DE CUSTOMER EXPERIENCE JR","cargoNovo":"ASSISTENTE DE CUSTOMER EXPERIENCE","cbo":"354125","sumaria":"Responsável por atender os acionamentos dos clientes e revendas nos canais de atendimento disponibilizados pela empresa (telefone, bot do WhatsApp, e-mail, Fale Conosco, marketplaces e redes sociais), assegurando orientação clara, registro adequado das interações e encaminhamento correto das demandas, de forma a garantir uma experiência positiva e alinhada às diretrizes de Customer Experience","atividades":"Atender clientes e revendas por diversos canais (bot do WhatsApp, telefonia, e-mail, Fale Conosco, Revendas, plataformas como Mercado Livre e Amazon, Redes Sociais e Reclame Aqui), seguindo roteiros e políticas estabelecidas.\nEsclarecer dúvidas e orientar o cliente de forma clara e assertiva, garantindo conformidade nas informações prestadas e alinhamento às políticas da empresa.\nRegistrar corretamente todas as informações dos atendimentos nos sistemas internos (plataformas de atendimento/CRM), garantindo integridade, rastreabilidade e qualidade dos dados.\nClassificar o motivo do contato com visão qualitativa, identificando a causa raiz das demandas e contribuindo com insumos para melhorias de processos e produtos.\nRealizar interfaces com áreas internas (ex.: logística, assistência técnica, comercial, financeiro, qualidade) para garantir que as demandas dos clientes sejam atendidas de forma completa e dentro dos prazos.\nEncaminhar casos complexos ou fora do escopo para níveis superiores (Líder, Supervisor ou áreas especializadas), acompanhando o desfecho quando necessário.\nAtuar com foco na satisfação do cliente em cada atendimento, buscando transformar situações negativas em experiências positivas, dentro dos limites de alçada.\nCumprir as escalas de trabalho, turnos e pausas conforme definição da área, garantindo disponibilidade adequada dos canais de atendimento.\nSeguir rigorosamente os procedimentos, scripts e diretrizes de atendimento definidos pela área de Customer Experience, contribuindo para a consistência do serviço prestado.\nContribuir com sugestões de melhoria para scripts, FAQs e fluxos de atendimento com base nas dúvidas e recorrências identificadas na linha de frente.","formacao":"Ensino médio completo.","experiencia":"1 ano","conhecimentos":"Vivência no uso de plataformas de atendimento ao cliente (telefonia, WhatsApp, e-mail, sistemas de ticket/CRM). Conhecimento intermediário em Excel e informática para registro, consulta e análise simples de informações. Noções de ferramentas de Qualidade e Lean Six Sigma aplicadas a processos de atendimento serão consideradas diferenciais. Familiaridade com canais digitais (redes sociais, marketplaces, Reclame Aqui) e boas práticas de comunicação escrita com clientes.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-03-01","elaborador":"Rafael Veiber","aprovador":"Marcos Oliveira","dataHist":"2026-03-01","versao":"1","descRev":"Revisão Geral","revisor":"Rafael Veiber","aprovadorHist":"Marcos Oliveira","atual":"Atual"},{"row":148,"empresa":"WAP","gestor":"LIDER DE CUSTOMER EXPERIENCE / SUPERVISOR CUSTOMER EXPERIENCE","area":"CUSTOMER EXPERIENCE","cargo":"ASSIST DE CUSTOMER EXPERIENCE JR","cargoNovo":"ASSISTENTE DE CUSTOMER EXPERIENCE","cbo":"354125","sumaria":"Responsável por atender os acionamentos dos clientes e revendas nos canais de atendimento disponibilizados pela empresa (telefone, bot do WhatsApp, e-mail, Fale Conosco, marketplaces e redes sociais), assegurando orientação clara, registro adequado das interações e encaminhamento correto das demandas, de forma a garantir u ações de faturamento no ERP ou em sistemas corporativos de gestão comercial e fiscal.\nEncaminhar documentos fiscais às áreas responsáveis, como Logística, Comercial, Fiscal, Financeiro e Administração de Vendas.\nApoiar a conferência de impostos, natureza de operação, códigos fiscais, dados cadastrais e demais informações necessárias à emissão correta dos documentos.\nAcompanhar pendências que impeçam o faturamento, acionando áreas responsáveis para correção de cadastro, crédito, pedido, estoque, preço ou documentação.\nOrganizar e arquivar documentos fiscais e comprovantes relacionados ao processo de faturamento em meio físico ou digital.\nApoiar a emissão de faturas, duplicatas, boletos ou demais documentos relacionados ao processo de cobrança, conforme fluxo interno.\nAtualizar controles, planilhas e relatórios operacionais de faturamento, pedidos pendentes, notas emitidas, devoluções, cancelamentos e inconsistências.\nPrestar suporte às áreas Comercial, Logística, Fiscal e Financeira em dúvidas relacionadas a notas fiscais, status de faturamento e documentos emitidos.\nIdentificar inconsistências recorrentes no processo de faturamento e sugerir melhorias em fluxos, controles e registros.\nCumprir políticas internas, prazos, procedimentos fiscais, regras de compliance e padrões definidos para o processo de faturamento.","formacao":"Ensino médio completo.","experiencia":"1 ano","conhecimentos":"Conhecimento básico em rotinas de faturamento, emissão de documentos fiscais e conferência de pedidos.\nNoções de impostos, natureza de operação, dados cadastrais, devoluções, remessas e transferências.\nConhecimento em ERP, sistemas fiscais, planilhas e controles administrativos.\nNoções de interface com Comercial, Logística, Fiscal, Financeiro e Administração de Vendas.\nCapacidade de organizar documentos, acompanhar pendências e cumprir prazos operacionais.\nAtenção a detalhes para conferência de informações fiscais, comerciais e cadastrais.","softskills":"Organização – ervisão, com foco em conformidade tributária e suporte às rotinas de apuração de impostos.","atividades":"Efetuar lançamento de notas fiscais de materiais de revenda, uso e consumo, devoluções, matéria-prima, importação e serviços no sistema.\nConferir documentos fiscais recebidos, garantindo aderência aos pedidos de compra e à legislação vigente.\nValidar dados fiscais antes da escrituração.\nApoiar na apuração de impostos indiretos e retenções na fonte.\nControlar prazos para escrituração e envio de obrigações acessórias.\nAuxiliar na organização e arquivamento de documentos fiscais físicos e digitais.\nMonitorar divergências entre notas fiscais e pedidos, acionando áreas responsáveis.\nApoiar na geração de relatórios fiscais para conferência e auditoria interna.\nInteragir com fornecedores para correção de documentos fiscais quando necessário.\nCumprir normas internas de compliance e segurança da informação.","formacao":"Ensino Médio completo.\nDesejável cursando graduação em Ciências Contábeis, Administração ou áreas correlatas.","experiencia":"6 meses","conhecimentos":"Legislação tributária municipal, estadual e federal.\nCálculo de impostos: ICMS, IPI, PIS, COFINS e retenções na fonte.\nDiferencial: experiência com sistema TOTVS Datasul.","softskills":"Organização – Mantém tarefas organizadas e cumpre prazos.\nComunicação Clara – Expressa informações de forma simples e precisa.\nAdaptabilidade – Ajusta-se rapidamente a mudanças.\nColaboração – Trabalha bem em equipe e apoia colegas.","areaAtuacao":"Administrativo","eGestor":"Não","nivel":"Assistente","dataRevisao":"2026-03-01","elaborador":"Rafael Veiber","aprovador":"Loanda Cardoso","dataHist":"2026-03-01","versao":"0","descRev":"Emissão inicial","revisor":"Rafael Veiber","aprovadorHist":"Loanda Cardoso","atual":"Atual"},{"row":165,"empresa":"","gestor":"","area":"JURÍDICO","cargo":"ASSIST JURIDICO JR","cargoNovo":"","cbo":"","sumaria":"","atividades":"","formacao":"","experiencia":"","conhecimentos":"","soft
